<!DOCTYPE html>
<html lang="ru">
<head>
<base target="_top">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Индивидуальные</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.wrap{max-width:560px;margin:0 auto;padding:0 16px}
h1{font-size:22px;margin:16px 0 10px}
input,select{font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;min-height:46px;width:100%}
input[type=date]{-webkit-appearance:none;appearance:none;width:0;min-width:100%;max-width:100%;display:block;box-sizing:border-box}
button{font:inherit;cursor:pointer}
.btn{width:100%;min-height:48px;border:0;border-radius:14px;background:var(--g);color:var(--gi);font-weight:700}
.sm{min-height:44px;padding:6px 12px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--g);font-weight:600;font-size:14px}
.sm.bad{color:var(--a,#C0392B)}
.sm.armed{background:var(--a,#C0392B);color:#fff;border-color:transparent}
.row2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:8px;margin:8px 0}.row2 input{min-width:0;max-width:100%;box-sizing:border-box} /* DS-017: дата и время сжимаются на 320 px */
details{background:var(--card);border:1px solid var(--line);border-radius:14px;margin:0 0 10px;padding:0 14px}
summary{cursor:pointer;padding:12px 0;display:flex;gap:8px;align-items:baseline;flex-wrap:wrap;list-style:none}
summary::-webkit-details-marker{display:none}
.cnt{margin-left:auto;color:var(--mute);font-size:14px}
.th{color:var(--mute);font-size:14px;margin:-4px 0 8px}
.pl{border-top:1px solid var(--line);padding:10px 0}
.pn{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}.pn b{flex:1}
.gr{color:var(--mute);font-size:13px}
.tag{font-size:12px;font-weight:700;padding:2px 8px;border-radius:8px;background:var(--pb);color:var(--g)}
.tag.no{background:none;border:1px solid var(--line);color:var(--mute)}
.acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.add{border-top:1px solid var(--line);padding:12px 0 14px;display:grid;gap:8px}
.full{color:var(--mute);font-size:14px;padding:10px 0 14px;border-top:1px solid var(--line)}
.msg{color:var(--mute);font-size:14px;min-height:20px;margin:6px 0}.err{color:var(--a,#C0392B)}
.sk-row{display:flex;gap:12px;align-items:center;padding:12px 14px;background:var(--card);border:1px solid var(--line);border-radius:12px;margin-bottom:8px}
.sk-t{flex:1;min-width:0}.sk-l{display:block;height:12px;border-radius:6px;background:var(--line);margin:8px 0;width:100%;animation:skp 1.2s ease-in-out infinite}
.sk-l.w60{width:60%}.sk-l.w40{width:40%}
@keyframes skp{50%{opacity:.45}}
@media (prefers-reduced-motion:reduce){.sk-l{animation:none}}
</style>
</head>
<body>
<div id="login" class="wrap" hidden>
  <h1>Индивидуальные</h1><label for="pin" class="ks-pinl">Введите код администратора</label>
  <input id="pin" type="password" autocomplete="off"><p id="lerr" class="err" role="alert"></p>
  <button class="btn" id="go">Войти</button>
</div>
<div id="app" class="wrap ks-wide-w" hidden>
  <div class="msg" id="msg" role="status"></div>
  <details id="debt"><summary><b>Должники</b><span class="cnt" id="dcnt"></span></summary>
    <div id="dlist"></div>
  </details>
  <details id="perm"><summary><b>Постоянные</b><span class="cnt" id="pcnt"></span></summary>
    <div id="plist"></div>
    <div class="add">
      <input list="dl" id="pn" placeholder="Игрок из реестра или гость (имя)" autocomplete="off">
      <select id="ps" aria-label="Расписание"><option value="6-ind">Сб · индивидуальные</option><option value="0-ind">Вс · индивидуальные</option><option value="0-gk">Вс · вратари</option></select>
      <button class="btn" id="padd">Добавить в постоянные</button>
    </div>
  </details>
  <details id="ilist"><summary><b>Список записавшихся</b></summary>
    <label>Занятие</label><select id="iev"></select>
    <div id="itxt" style="margin-top:8px;padding:12px 14px;border:1px solid var(--line,#d9dce3);border-radius:12px;background:var(--card,#fff);color:inherit;white-space:pre-line;line-height:1.6;min-height:60px;font-size:15px"></div>
    <button class="btn" id="icopy">Скопировать список</button>
    <div class="sub" style="margin-top:8px">Заголовок пишете сами; здесь только нумерованный список по порядку записи.</div>
  </details>
  <details id="newev"><summary><b>+ Новое занятие</b></summary>
    <div class="row2"><input type="date" id="nd" aria-label="Дата"><input type="time" id="nt" value="19:00" aria-label="Время"></div>
    <div class="row2"><select id="nk" aria-label="Тип занятия"><option value="0">Индивидуальные</option><option value="1">Вратари</option></select><input id="nth" placeholder="Тема (пусто = по кругу)"></div>
    <div style="padding-bottom:14px"><button class="btn" id="nadd">Создать занятие</button></div>
  </details>
  <div id="list"></div>
</div>
<datalist id="dl"></datalist>
<script>
var pin='',D=null,PL=[],open={},armed='',editing='',busy=false,flash='';
var SL={'6-ind':'Сб · индивидуальные','0-ind':'Вс · индивидуальные','0-gk':'Вс · вратари'};
function $(i){return document.getElementById(i)}
function run(fn,args,ok,fail){var r=google.script.run.withSuccessHandler(ok).withFailureHandler(function(e){fail(e&&e.message?e.message:String(e))});r[fn].apply(r,args)}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function gl(k){try{return localStorage.getItem(k)||''}catch(e){return''}}
function sl(k,v){try{localStorage.setItem(k,v)}catch(e){}}
function msg(t,bad){$('msg').textContent=t||'';$('msg').className='msg'+(bad?' err':'')}
// Ошибка в диалоге: снимаем занятость экрана; неверный код обрабатывает общий диалог (Ui.html)
function failIn(bad){return function(m){busy=false;bad(m)}}
function showLogin(t){$('app').hidden=true;$('login').hidden=false;$('lerr').textContent=t||''}
function showApp(){$('login').hidden=true;$('app').hidden=false}
function dl(d){var p=d.split('-'),w=['вс','пн','вт','ср','чт','пт','сб'][new Date(Date.UTC(+p[0],+p[1]-1,+p[2])).getUTCDay()];return w+' '+p[2]+'.'+p[1]}
function today(){var d=new Date(),z=function(n){return(n<10?'0':'')+n};return d.getFullYear()+'-'+z(d.getMonth()+1)+'-'+z(d.getDate())}
function fail(m){busy=false;flash='';if(/Неверный код/.test(m))showLogin('Неверный код администратора');else{showApp();msg(m,true)}}
function skelRows(n){var h='';for(var i=0;i<n;i++)h+='<div class="sk-row" aria-hidden="true"><span class="sk-t"><span class="sk-l w60"></span><span class="sk-l w40"></span></span></div>';return h}
function load(){
  if(!D){msg('');$('list').innerHTML=skelRows(3)}else msg('Загрузка…');
  run('appIndData',[pin],function(r){D=r;busy=false;armed='';showApp();msg(flash);flash='';render()},function(m){if(!D&&!/Неверный код/.test(String(m))){busy=false;showApp();msg('');$('list').innerHTML=ksEmpty({tag:'div',icon:'alert',title:'Не удалось загрузить данные',text:'Проверьте соединение и попробуйте ещё раз.',btn:'Повторить',id:'iretry'});return}fail(m)});
  if(!PL.length)run('appIndPlayers',[pin],function(r){PL=r;$('dl').innerHTML=r.map(function(p){return'<option value="'+esc(p.name)+'">'+esc(p.group)+'</option>'}).join('')},function(){});
}
function renderPerm(){
  var h='';
  Object.keys(SL).forEach(function(s){
    var a=D.perms.filter(function(p){return p.slot==s});
    h+='<div class="th" style="margin-top:10px"><b>'+SL[s]+'</b> · '+a.length+'</div>';
    a.forEach(function(p){
      var k='p'+s+'_'+p.name;
      h+='<div class="pl"><div class="pn"><b>'+esc(p.name)+'</b><span class="gr">'+esc(p.group)+'</span><button class="sm bad'+(armed==k?' armed':'')+'" data-a="poff" data-s="'+s+'" data-n="'+esc(p.name)+'" data-k="'+esc(k)+'">'+(armed==k?'Точно убрать?':'Убрать')+'</button></div></div>';
    });
  });
  $('plist').innerHTML=h;$('pcnt').textContent=D.perms.length;
}
// Список записавшихся: нумерованные ФИ по порядку записи, без заголовка. Копируется как HTML, как на сборах.
function iRichHtml(txt){return txt.split('\n').map(function(l){return l.trim()?'<div>'+esc(l)+'</div>':'<div>&nbsp;</div>'}).join('')}
function iCopyRich(txt){
  var box=document.createElement('div'),ok=false;
  box.contentEditable='true';box.style.cssText='position:fixed;left:-9999px;top:0;width:1px;overflow:hidden;';
  box.innerHTML=iRichHtml(txt);document.body.appendChild(box);
  var sel=window.getSelection(),r=document.createRange();r.selectNodeContents(box);sel.removeAllRanges();sel.addRange(r);
  try{ok=document.execCommand('copy')}catch(e){}
  sel.removeAllRanges();document.body.removeChild(box);return ok;
}
function fillIList(){
  var sel=$('iev'),prev=sel.value,evs=D.events.slice().sort(function(a,b){return(b.date+b.time).localeCompare(a.date+a.time)});
  sel.innerHTML=evs.map(function(e){return'<option value="'+esc(e.id)+'">'+esc(dl(e.date)+' '+e.time+(e.gk?' · вратари':' · индивидуальные'))+'</option>'}).join('')||'<option value="">Нет занятий</option>';
  if(prev&&evs.some(function(e){return e.id===prev}))sel.value=prev;
  renderIList();
}
function renderIList(){
  var e=D.events.filter(function(x){return x.id===$('iev').value})[0];
  $('itxt').textContent=e?e.players.map(function(p,i){return(i+1)+'. '+p.name}).join('\n'):'';
}
$('iev').onchange=renderIList;
$('icopy').onclick=function(){
  var t=$('itxt').textContent,b=this;if(!t)return;
  var flash=function(){var old=b.textContent;b.textContent='Скопировано';setTimeout(function(){b.textContent=old},1800)};
  var fallback=function(){if(iCopyRich(t))flash()};
  try{
    if(window.ClipboardItem&&navigator.clipboard&&navigator.clipboard.write){
      var item=new ClipboardItem({'text/html':new Blob([iRichHtml(t)],{type:'text/html'}),'text/plain':new Blob([t],{type:'text/plain'})});
      navigator.clipboard.write([item]).then(flash,fallback);return;
    }
    fallback();
  }catch(e){fallback()}
};
function render(){
  renderPerm();
  renderDebts();
  fillIList();
  var h='';
  D.events.forEach(function(e,i){
    var paid=e.players.filter(function(p){return p.paid}).length,dk='d'+e.id;
    h+='<details data-id="'+esc(e.id)+'"'+(open[e.id]?' open':'')+'><summary><b>'+dl(e.date)+' · '+e.time+'</b><span>'+(e.gk?'Вратари':'Индивидуальные')+'</span><span class="cnt">'+e.players.length+'/'+e.cap+' · '+paid*(e.price||D.price)+' ₾</span></summary>';
    if(e.theme&&!e.gk)h+='<div class="th">'+esc(e.theme)+'</div>';
    if(editing==e.id){
      h+='<div class="add" style="border-top:0;padding-top:0"><div class="row2"><input type="date" id="ed'+i+'" value="'+e.date+'"><input type="time" id="et'+i+'" value="'+e.time+'"></div><input id="eth'+i+'" value="'+esc(e.theme)+'" placeholder="Тема"><div class="acts"><button class="sm" data-a="esave" data-e="'+i+'">Сохранить</button><button class="sm" data-a="ecancel" data-e="'+i+'">Отмена</button></div></div>';
    }else{
      h+='<div class="acts" style="margin:0 0 8px"><button class="sm" data-a="eedit" data-e="'+i+'">Изменить занятие</button><button class="sm bad'+(armed==dk?' armed':'')+'" data-a="edel" data-e="'+i+'">'+(armed==dk?'Точно удалить?':'Удалить занятие')+'</button></div>';
    }
    e.players.forEach(function(p,j){
      var k='r'+i+'_'+j;
      h+='<div class="pl"><div class="pn"><b>'+esc(p.name)+'</b><span class="gr">'+esc(p.group)+'</span><span class="tag'+(p.paid?'':' no')+'">'+(p.paid?'Оплачено '+(e.price||D.price)+' ₾':'Не оплачено')+'</span></div><div class="acts">';
      if(!p.paid)h+='<button class="sm" data-a="pay" data-m="Наличные" data-e="'+i+'" data-p="'+j+'">Оплата: наличные</button><button class="sm" data-a="pay" data-m="Перевод" data-e="'+i+'" data-p="'+j+'">Оплата: перевод</button><button class="sm bad'+(armed==k?' armed':'')+'" data-a="rm" data-k="'+k+'" data-e="'+i+'" data-p="'+j+'">'+(armed==k?'Точно снять?':'Снять')+'</button>';
      else h+='<button class="sm bad'+(armed==k?' armed':'')+'" data-a="unpay" data-k="'+k+'" data-e="'+i+'" data-p="'+j+'">'+(armed==k?'Точно отменить?':'Отменить оплату')+'</button>';
      h+='</div></div>';
    });
    if(e.players.length<e.cap)h+='<div class="add"><input list="dl" id="in'+i+'" placeholder="Игрок из реестра или гость (имя)" autocomplete="off"><button class="btn" data-a="add" data-e="'+i+'">Записать</button></div>';
    else h+='<div class="full">Мест нет: максимум '+e.cap+'</div>';
    h+='</details>';
  });
  $('list').innerHTML=h||ksEmpty({tag:'div',icon:'box',title:'Занятий пока нет',text:'Создайте занятие в форме выше.'});
}
$('list').addEventListener('click',function(e){if(e.target.closest('#iretry'))load()});
$('list').addEventListener('toggle',function(ev){var d=ev.target;if(d.dataset&&d.dataset.id)open[d.dataset.id]=d.open},true);
$('list').onclick=function(ev){
  var b=ev.target.closest('button');if(!b||busy||!b.dataset.a)return;
  var a=b.dataset.a,e=D.events[b.dataset.e],p=e&&e.players[b.dataset.p];
  function go(fn,args,ok){busy=true;msg('Сохраняю…');run(fn,args,function(){flash=ok;load()},function(m){fail(m)})}
  if(a=='pay'){
    // Быстрая кнопка выбирает способ и открывает подтверждение; до подтверждения записи нет
    var mt=b.dataset.m;
    ksConfirm({title:'Подтвердить оплату?',ok:'Подтвердить оплату',rows:indRows(p.name,p.group,e,mt),
      run:function(ok,bad){busy=true;run('appIndPay',[pin,e.id,p.name,mt],function(){ok();flash='Оплата принята: '+p.name;load()},failIn(bad))}});
  }else if(a=='unpay'){
    ksConfirm({title:'Отменить оплату?',ok:'Отменить оплату',danger:true,
      text:'Отметка об оплате будет снята, у игрока снова появится долг за это занятие.',
      rows:indRows(p.name,p.group,e,''),
      run:function(ok,bad){busy=true;run('appIndUnpay',[pin,e.id,p.name],function(){ok();flash='Оплата отменена: '+p.name;load()},failIn(bad))}});
  }else if(a=='rm'){
    if(armed!=b.dataset.k){armed=b.dataset.k;render();return}
    armed='';
    go('appIndRemove',[pin,e.id,p.name],'Игрок снят: '+p.name);
  }else if(a=='add'){
    var nm=$('in'+b.dataset.e).value.trim();if(!nm){msg('Укажите имя игрока',true);return}
    var g='гость';PL.forEach(function(x){if(x.name.toLowerCase()==nm.toLowerCase()){g=x.group;nm=x.name}});
    go('appIndAdd',[pin,e.id,nm,g],'Записан: '+nm+(g=='гость'?' (гость)':''));
  }else if(a=='eedit'){editing=e.id;open[e.id]=true;armed='';render()}
  else if(a=='ecancel'){editing='';render()}
  else if(a=='esave'){
    var i=b.dataset.e,d=$('ed'+i).value,t=$('et'+i).value;
    if(!d||!t){msg('Укажите дату и время',true);return}
    editing='';go('appIndEventEdit',[pin,e.id,d,t,$('eth'+i).value.trim()],'Занятие изменено');
  }else if(a=='edel'){
    var k='d'+e.id;if(armed!=k){armed=k;render();return}
    armed='';go('appIndEventDelete',[pin,e.id],'Занятие удалено');
  }
};
$('plist').onclick=function(ev){
  var b=ev.target.closest('button');if(!b||busy||b.dataset.a!='poff')return;
  if(armed!=b.dataset.k){armed=b.dataset.k;renderPerm();return}
  armed='';busy=true;msg('Сохраняю…');
  run('appIndPermOff',[pin,b.dataset.n,b.dataset.s],function(){flash='Убран из постоянных: '+b.dataset.n;load()},fail);
};
$('padd').onclick=function(){
  if(busy)return;var nm=$('pn').value.trim();if(!nm){msg('Укажите имя игрока',true);return}
  var g='гость';PL.forEach(function(x){if(x.name.toLowerCase()==nm.toLowerCase()){g=x.group;nm=x.name}});
  busy=true;msg('Сохраняю…');
  run('appIndPermAdd',[pin,nm,g,$('ps').value],function(r){$('pn').value='';flash='Добавлен в постоянные: '+nm+'. Вписан в ближайшие занятия: '+r.applied;load()},fail);
};
function renderDebts(){
  var h='',tot=0;
  D.debts.forEach(function(d,i){
    tot+=d.total;
    h+='<div class="pl"><div class="pn"><b>'+esc(d.name)+'</b><span class="gr">'+esc(d.group)+'</span><span class="tag no">'+d.total+' ₾</span></div>';
    d.events.forEach(function(e,j){
      h+='<div class="acts" style="align-items:center"><span class="gr" style="flex:1">'+dl(e.date)+' · '+e.time+' · '+(e.gk?'вратари':'индив.')+'</span><button class="sm" data-a="dpay" data-m="Наличные" data-i="'+i+'" data-j="'+j+'">Наличные</button><button class="sm" data-a="dpay" data-m="Перевод" data-i="'+i+'" data-j="'+j+'">Перевод</button></div>';
    });
    h+='</div>';
  });
  $('dlist').innerHTML=h||'<p class="th">Долгов нет</p>';
  $('dcnt').textContent=D.debts.length?D.debts.length+' · '+tot+' ₾':'нет';
}
$('dlist').onclick=function(ev){
  var b=ev.target.closest('button');if(!b||busy||b.dataset.a!='dpay')return;
  var d=D.debts[b.dataset.i],e=d.events[b.dataset.j],mt=b.dataset.m;
  ksConfirm({title:'Подтвердить оплату?',ok:'Подтвердить оплату',rows:indRows(d.name,d.group,e,mt),
    run:function(ok,bad){busy=true;run('appIndPay',[pin,e.id,d.name,mt],function(){ok();flash='Оплата принята: '+d.name;load()},failIn(bad))}});
};
// Сводка для диалога: игрок или гость, сумма занятия, занятие, способ
function indRows(name,group,e,mt){
  return [[group=='гость'?'Гость':'Игрок',name],['Сумма',ksMoney(e&&e.price||D.price)],
    ['За что',(e.gk?'Вратарская тренировка, ':'Индивидуальное занятие, ')+dl(e.date)+' '+e.time],['Способ',mt]];
}
$('nd').value=today();
$('nadd').onclick=function(){
  if(busy)return;if(!$('nd').value||!$('nt').value){msg('Укажите дату и время',true);return}
  busy=true;msg('Создаю…');
  run('appIndAddEvent',[pin,$('nd').value,$('nt').value,$('nk').value=='1',$('nth').value.trim()],function(r){flash=r.exists?'Такое занятие уже есть':'Занятие создано';$('newev').open=false;load()},fail);
};
$('go').onclick=function(){pin=$('pin').value.trim();if(!pin)return;sl('kspin',pin);sl('kspin',pin);load()};
pin=gl('kspin')||gl('kspin')||gl('kspin');
if(pin)load();else showLogin('');
</script>
</body>
</html>
