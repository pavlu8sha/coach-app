<style>
:root{--sh:0 1px 2px rgba(20,32,26,.07),0 2px 8px rgba(20,32,26,.04);--navh:64px}
/* Тема: «Как на устройстве» — по системе; html[data-theme=light|dark] — выбор пользователя (меню «Ещё», хранится в браузере) */
@media(prefers-color-scheme:dark){html:not([data-theme=light]){--sh:none;color-scheme:dark}}
html[data-theme=dark]{--sh:none;color-scheme:dark}html[data-theme=light]{color-scheme:light}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg)!important;color:var(--ink)!important;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif!important}
h1{font-size:24px!important;letter-spacing:-.01em}
input,select{border-radius:12px!important;min-height:46px}
input:focus,select:focus,button:focus-visible,a:focus-visible{outline:3px solid var(--g);outline-offset:1px}
.btn{border-radius:14px!important;min-height:48px!important;font-weight:700!important}
.btn.sec{background:var(--card)!important;color:var(--g)!important;border:1px solid var(--line)!important}
.res,.prog,.tile,details,li.p,.card{border-radius:14px!important;box-shadow:var(--sh)}
#ksnav{position:fixed;left:0;right:0;bottom:0;z-index:50;display:flex;background:var(--card);border-top:1px solid var(--line);height:calc(var(--navh) + env(safe-area-inset-bottom));padding-bottom:env(safe-area-inset-bottom)}
#ksnav[hidden],#ksmore[hidden],#ksblock[hidden],#kstoast[hidden]{display:none}
/* До входа по коду не показываем ни меню, ни вкладки страницы: только форму входа */
html:not([data-ok]) #ksnav,html:not([data-ok]) [data-gate]{display:none!important}
.kst{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;border:0;background:none;color:var(--mute);text-decoration:none;font:600 11px system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;cursor:pointer;min-width:0}
.kst.on{color:var(--g)}
#ksmore{position:fixed;right:12px;bottom:calc(var(--navh) + 10px + env(safe-area-inset-bottom));width:min(300px,calc(100vw - 24px));z-index:55;background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:0 8px 30px rgba(0,0,0,.18);padding:6px;display:flex;flex-direction:column}
.ksi{display:flex;align-items:center;min-height:44px;width:100%;text-align:left;padding:12px 14px;border:0;background:none;border-radius:10px;color:var(--ink);text-decoration:none;font:600 15px system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;cursor:pointer}
.ksi.on{background:var(--bg);color:var(--g)}
.ksmode{display:flex;margin:6px 8px;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.ksmode button{flex:1;min-height:44px;border:0;background:var(--card);color:var(--mute);padding:10px;font:600 14px system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;cursor:pointer}
.ksmode button.on{background:var(--g);color:var(--gi)}
.kslbl{margin:8px 14px 0;color:var(--mute);font:600 12px system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.ksmode.kstheme button{min-height:44px;padding:6px 4px;font-size:13px;line-height:1.2}
.ksmode button+button{border-left:1px solid var(--line)}
#kstoast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--navh) + 18px + env(safe-area-inset-bottom));max-width:min(92vw,520px);z-index:70;background:var(--ink);color:var(--bg);padding:12px 16px;border-radius:14px;font:600 14px/1.35 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;box-shadow:0 8px 24px rgba(0,0,0,.25)}
html .msg.ks-inl{visibility:hidden}
#kstoast.bad{background:var(--a);color:var(--color-on-danger,#fff)}
#ksblock{position:fixed;top:0;right:0;bottom:0;left:0;z-index:60;background:var(--bg);color:var(--ink);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:24px;text-align:center;font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
#ksblock b{font-size:18px;max-width:320px}
#ksblock p{margin:0;color:var(--mute);max-width:320px}
#ksblock button{background:var(--g)!important;color:var(--gi)!important;border-color:var(--g)!important}
#ksblock a,#ksblock button{display:inline-flex;align-items:center;justify-content:center;min-width:220px;min-height:44px;padding:12px 18px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:700 15px system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;text-decoration:none;cursor:pointer}
@media(max-width:839px){
  body{padding-bottom:calc(var(--navh) + 28px + env(safe-area-inset-bottom))!important}
  html[data-page="att"] body{padding-bottom:calc(var(--navh) + 150px + env(safe-area-inset-bottom))!important}
  footer{bottom:calc(var(--navh) + env(safe-area-inset-bottom))!important}
}
@media(min-width:840px){
  #ksnav{position:sticky;top:0;bottom:auto;height:auto;padding:8px 12px;gap:4px;justify-content:center;border-top:0;border-bottom:1px solid var(--line)}
  .kst{flex:none;flex-direction:row;gap:8px;padding:10px 16px;font-size:14px;border-radius:10px}
  .kst.on{background:var(--bg)}
  #ksmore{top:56px;bottom:auto}
  #kstoast{bottom:24px}
}
/* Цвета клуба: синий */
:root:root{--bg:#F3F5FA;--card:#fff;--ink:#141C33;--mute:#5A6584;--line:#DADFEC;
--g:#25335A;--gi:#fff;--pb:#DDE4F6;--n:#D2D8E6;--a:#C0392B}
@media (prefers-color-scheme:dark){
html:not([data-theme=light]):root:root{--bg:#0D1324;--card:#161F38;--ink:#E8ECF7;--mute:#97A3C2;--line:#27325A;
--g:#7F9DEB;--gi:#0B1020;--pb:#1F2D54;--n:#2F3B63;--a:#F0866F}}
/* UI-003: подразделы (Приём оплат / По месяцам и группам / Должники и др.) */
.ks-sub{display:grid;gap:4px;max-width:592px;width:100%;margin:0 auto;padding:10px 16px 12px;box-sizing:border-box}
.ks-sub a{display:flex;align-items:center;justify-content:center;text-align:center;min-height:44px;padding:6px 8px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);text-decoration:none;font:600 14px/1.2 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow-wrap:anywhere}
.ks-sub a.on{background:var(--g);border-color:var(--g);color:var(--gi)}
@media(max-width:380px){.ks-sub a{font-size:13px;padding:6px 4px}}
/* UI-017 (проба): раздел внутри каркаса — своё меню скрыто, меню показывает каркас */
html[data-embed] #ksnav,html[data-embed] #ksmore{display:none!important}
/* в окне раздела меню нет — всё, что отступало от меню (закреплённая панель «Отметок», тосты, отступ снизу), прижимается к низу */
html[data-embed]{--navh:0px}
@media(max-width:839px){html[data-embed] body{padding-bottom:28px!important}html[data-embed] #kstoast{bottom:calc(18px + env(safe-area-inset-bottom))}}
html,body{max-width:100%} /* DS-017: overflow-x:hidden снят — проверка на телефоне с реальными данными */
*,*::before,*::after{box-sizing:border-box}
img,table,select,input,textarea{max-width:100%}
.wrap{max-width:560px;margin-left:auto;margin-right:auto}
</style>
<nav id="ksnav" aria-label="Разделы" hidden></nav>
<div id="ksmore" hidden></div>
<div id="ksblock" hidden>
  <b>Этот раздел недоступен в режиме тренера</b>
  <p id="ksbt"></p>
  <a id="ksgo" target="_top">К отметкам</a>
  <button id="ksadm">Режим администратора</button>
</div>
<div id="kstoast" hidden></div>
<script>
(function(){
  var URL='__URL__',PAGE='__PAGE__',CL='__CL__';
  // Ссылка на раздел; в запасном режиме (?classic=1) ссылки остаются в нём же
  function pageUrl(p){return URL+(p?'?page='+p+(CL?'&classic=1':''):(CL?'?classic=1':''))}
  window.KS_NAVPAGE=PAGE;
  // UI-017 (проба): в каркасе ссылки раздела (подразделы, «К отметкам») переключают раздел, а не перезагружают страницу
  if(document.documentElement.hasAttribute('data-embed'))document.addEventListener('click',function(e){
    var a=e.target.closest&&e.target.closest('a[target="_top"][href]');if(!a)return;
    try{if(window.parent!==window&&window.parent.ksShellGo){e.preventDefault();window.parent.ksShellGo(a.getAttribute('href'))}}catch(x){}
  },true);
  var ICON={
    att:'<path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/>',
    admin:'<path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/>',
    pay:'<rect x="1" y="4" width="22" height="16" rx="2"/><path d="M1 10h22"/>',
    games:'<path d="M8 21h8M12 17v4M7 4h10v5a5 5 0 0 1-10 0V4z"/><path d="M17 5h3v2a3 3 0 0 1-3 3M7 5H4v2a3 3 0 0 0 3 3"/>',
    stats:'<path d="M18 20V10M12 20V4M6 20v-6"/>',
    camp:'<path d="M3 20L12 4l9 16H3z"/><path d="M12 20v-6"/>',
    funnel:'<path d="M22 3H2l8 9.46V19l4 2v-8.54L22 3z"/>',
    ind:'<circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/>',
    more:'<circle cx="5" cy="12" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="19" cy="12" r="1.6"/>'
  };
  var ITEMS={att:['Отметки',''],stats:['Статистика','stats'],admin:['Игроки','admin'],equip:['Экипировка','equip'],games:['Матчи','games'],pay:['Оплаты','cash'],camp:['Сборы','camp'],ind:['Индивидуальные','ind'],funnel:['Новые игроки','funnel'],accounting:['Посещаемость тренеров','accounting'],settings:['Настройки','settings']};
  var ADMINP=['admin','equip','pay','camp','ind','funnel','accounting','settings'];
  document.documentElement.setAttribute('data-page',PAGE);
  function get(k){try{return localStorage.getItem(k)||''}catch(e){return''}}
  function set(k,v){try{localStorage.setItem(k,v)}catch(e){}}
  // Тема — Ui.html (window.ksTheme / ksSetTheme, ключ kstheme); здесь только переключатель в «Ещё»
  var nav=document.getElementById('ksnav'),sheet=document.getElementById('ksmore'),blk=document.getElementById('ksblock'),toast=document.getElementById('kstoast'),last='',role='',tt;
  document.getElementById('ksgo').href=pageUrl('');
  function asTrainer(){return role!='admin'||get('ksmode')=='trainer'}
  function svg(k){return'<svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'+ICON[k]+'</svg>'}
  function link(k,cls){
    var it=ITEMS[k],href=pageUrl(it[1]);
    return'<a class="'+cls+(k==PAGE?' on':'')+'"'+(k==PAGE?' aria-current="page"':'')+' target="_top" href="'+href+'">'+(cls=='kst'?svg(k)+'<span>'+it[0]+'</span>':it[0])+'</a>';
  }
  function show(){
    if(!role){ // без проверенного кода меню не показываем
      document.documentElement.removeAttribute('data-ok');
      nav.hidden=true;sheet.hidden=true;blk.hidden=true;document.getElementById('ksadm').hidden=true;return;
    }
    var tr=asTrainer(),main=tr?['att','games','stats']:['att','admin','pay','games'],more=tr?[]:['stats','equip','camp','ind','funnel','accounting','settings'];
    var moreOn=more.indexOf(PAGE)>=0,sh='';
    document.documentElement.setAttribute('data-ok','1');
    nav.innerHTML=main.map(function(k){return link(k,'kst')}).join('')+'<button type="button" class="kst'+(moreOn?' on':'')+'" id="ksmb" aria-haspopup="true" aria-expanded="false" aria-controls="ksmore">'+svg('more')+'<span>Ещё</span></button>';
    more.forEach(function(k){sh+=link(k,'ksi')});
    if(role=='admin')sh+='<div class="kslbl">Режим</div><div class="ksmode"><button data-m="admin"'+(tr?'':' class="on"')+'>Админ</button><button data-m="trainer"'+(tr?' class="on"':'')+'>Тренер</button></div>';
    var th=window.ksTheme?window.ksTheme():'';
    sh+='<div class="kslbl" id="ksthl">Тема</div><div class="ksmode kstheme" role="radiogroup" aria-labelledby="ksthl">'+[['','Как на устройстве'],['light','Светлая'],['dark','Тёмная']].map(function(x){
      return'<button type="button" role="radio" aria-checked="'+(th==x[0])+'" data-th="'+x[0]+'"'+(th==x[0]?' class="on"':'')+'>'+x[1]+'</button>'}).join('')+'</div>';
    sh+='<button class="ksi" id="ksref">Обновить данные</button><button class="ksi" id="kslo">Выйти</button>';
    sheet.innerHTML=sh;
    nav.hidden=false;sheet.hidden=true;
    blk.hidden=!(tr&&ADMINP.indexOf(PAGE)>=0);
    document.getElementById('ksadm').hidden=(role!='admin');
    document.getElementById('ksbt').textContent=role=='admin'?'Переключитесь в режим администратора или вернитесь к отметкам.':'Этот раздел доступен только администратору.';
  }
  function refresh(){
    if(window.ksCacheClear)ksCacheClear();
    sheet.hidden=true;say('Обновляю данные…');
    google.script.run.withSuccessHandler(function(){say('Данные обновлены. Откройте раздел заново, чтобы увидеть свежие.')})
      .withFailureHandler(function(e){say(e&&e.message?e.message:'Не удалось обновить',true)})
      .appRefreshData(get('kspin')||get('kspin')||get('kspin'));
  }
  function setMode(m){set('ksmode',m);show();try{window.dispatchEvent(new Event('ksmodechange'))}catch(e){}}
  function logout(){
    if(window.ksCacheClear)ksCacheClear();
    ['kspin','ksmode','ksrole'].forEach(function(k){try{localStorage.removeItem(k)}catch(e){}});
    try{window.top.location.href=pageUrl('')}catch(e){location.reload()}
  }
  function sheetOpen(on){sheet.hidden=!on;var mb=document.getElementById('ksmb');if(mb)mb.setAttribute('aria-expanded',String(!!on))}
  nav.addEventListener('click',function(e){if(e.target.closest('#ksmb'))sheetOpen(sheet.hidden)});
  document.addEventListener('keydown',function(e){if(e.key==='Escape'&&!sheet.hidden){sheetOpen(false);var mb=document.getElementById('ksmb');if(mb)mb.focus()}});
  sheet.addEventListener('click',function(e){
    var b=e.target.closest('button');if(!b)return;
    if(b.hasAttribute('data-th')){if(window.ksSetTheme)window.ksSetTheme(b.dataset.th);return}
    if(b.dataset.m)setMode(b.dataset.m);else if(b.id=='kslo')logout();else if(b.id=='ksref')refresh();
  });
  document.addEventListener('click',function(e){if(!e.target.closest('#ksmore,#ksmb')&&!sheet.hidden)sheetOpen(false)});
  // В каркасе нажатие по разделу приходится на его окно и сюда не доходит: закрываем «Ещё», когда фокус ушёл в окно раздела
  window.addEventListener('blur',function(){if(!sheet.hidden)sheetOpen(false)});
  window.ksMoreClose=function(){if(!sheet.hidden)sheetOpen(false)};
  document.getElementById('ksadm').onclick=function(){setMode('admin')};
  // тема сменилась (здесь, в «Настройках» или в другой вкладке) — отметка в «Ещё»
  document.addEventListener('kstheme',function(){var t=window.ksTheme?window.ksTheme():'';[].forEach.call(sheet.querySelectorAll('[data-th]'),function(x){var on=x.dataset.th===t;x.classList.toggle('on',on);x.setAttribute('aria-checked',String(on))})});
  // UI-010. Сообщения страницы (.msg):
  //  • тост — только для итогов: общее сообщение страницы (.msg с role="status"), кроме «Загрузка…»/«Сохраняю…»;
  //  • ошибка формы — внутри формы: если ошибка пришла в общее сообщение сразу после нажатия кнопки на странице,
  //    она показывается под этой кнопкой (.ks-ferr), без тоста; ошибки без нажатия (загрузка) — тостом, как раньше;
  //  • сообщения внутри форм (.msg без role) тостом не дублируются; ошибка в них объявляется (role="alert")
  //    и прокручивается в видимую область, если оказалась за экраном.
  function say(t,bad){
    toast.textContent=t;toast.className=bad?'bad':'';toast.hidden=false;
    clearTimeout(tt);tt=setTimeout(function(){toast.hidden=true},bad?7000:4000);
  }
  window.ksToast=say;
  var lastBtn=null,lastAt=0,ferrEl=null,ferrSrc=null;
  document.addEventListener('click',function(e){
    var b=e.target.closest&&e.target.closest('button,input[type=button],input[type=submit]');
    if(!b||b.closest('#ksdlg,#ksnav,#ksmore,#kstoast,#ksblock'))return;
    lastBtn=b;lastAt=Date.now();clearFerr();
  },true);
  function clearFerr(){if(ferrEl){ferrEl.remove();ferrEl=null}if(ferrSrc){ferrSrc.classList.remove('ks-inl');ferrSrc=null}}
  document.addEventListener('input',function(e){if(ferrEl&&!e.target.closest('#ksdlg'))clearFerr()},true);
  function seen(el){var r=el.getBoundingClientRect();return r.height>0&&r.top>=0&&r.bottom<=(window.innerHeight||0)}
  function nearest(el){try{el.scrollIntoView({block:'nearest'})}catch(x){}}
  function formErr(t,src){
    var b=lastBtn;
    if(!b||Date.now()-lastAt>15000||!document.body.contains(b)||b.offsetParent===null||b.closest('[role=tablist],[role=radiogroup]'))return false; // вкладки: ошибка показывается страницей
    var nx=b.nextElementSibling;
    if(nx&&nx.classList.contains('msg')&&nx.classList.contains('err')&&!nx.hasAttribute('role'))return false; // у формы своё поле ошибки
    ferrEl=document.createElement('p');ferrEl.className='ks-ferr';ferrEl.setAttribute('role','alert');ferrEl.textContent=t;
    b.insertAdjacentElement('afterend',ferrEl);
    ferrSrc=src;src.classList.add('ks-inl'); // копия вверху страницы скрыта, место сохраняется
    if(!seen(ferrEl))nearest(ferrEl);
    return true;
  }
  new MutationObserver(function(ms){
    ms.forEach(function(m){
      var el=m.target.nodeType==3?m.target.parentElement:m.target;
      el=el&&el.closest?el.closest('.msg'):null;
      if(!el||el.closest('#ksdlg'))return;
      var t=el.textContent.trim();
      if(!t){el.__t='';return}
      if(el.__t===t)return;
      el.__t=t;
      if(/…$/.test(t))return;
      var bad=el.classList.contains('err');
      if(el.getAttribute('role')!=='status'){                // сообщение внутри формы
        if(bad){el.setAttribute('role','alert');if(!seen(el))nearest(el)}
        return;
      }
      if(!bad&&el.hasAttribute('data-ks-quiet'))return;   // справочная строка страницы (например, «Период: …»): без тоста
      if(bad){clearFerr();if(formErr(t,el))return}
      if(!bad)clearFerr();
      say(t,bad);
    });
  }).observe(document.body,{subtree:true,childList:true,characterData:true,attributes:true,attributeFilter:['class']});
  // Проверка кода на сервере: роль не берётся из сохранённых значений, меню появляется только после ответа сервера
  function check(){
    var c=get('kspin');
    if(c===last)return;last=c;
    if(!c){role='';show();return}
    google.script.run.withSuccessHandler(function(r){
      if(get('kspin')!==c)return; // код сменили, пока шла проверка
      if(r=='admin'||r=='trainer'){role=r;set('ksrole',r)}
      else{role='';try{localStorage.removeItem('kspin')}catch(e){}}
      show();
    }).withFailureHandler(function(){}).appWho(c);
  }
  check();setInterval(check,2000);
})();
function friendly_(m) {
  m = String(m || '');
  if (/Timeout|Тайм-аут|timed out|waitLock/i.test(m)) return 'Система сейчас занята. Подождите несколько секунд и повторите.';
  return m.replace(/^Exception:\s*/, '').replace(/^Error:\s*/, '');
}
</script>
<script>
// Клавиатура на всех страницах: Enter («Готово») скрывает её в полях ввода; вверху над клавиатурой тоже.
(function(){
  function fix(t){
    if(t&&t.tagName==='INPUT'&&/^(text|search|number|tel|email)?$/.test(t.type||'text')){t.setAttribute('enterkeyhint','done');return true}
    return false;
  }
  document.addEventListener('focusin',function(e){fix(e.target)},true);
  document.addEventListener('keydown',function(e){
    var t=e.target;
    if(e.key==='Enter'&&fix(t)){e.preventDefault();t.blur()}
  },true);
})();
</script>
