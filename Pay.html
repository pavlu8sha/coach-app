<!DOCTYPE html>
<html lang="ru">
<head>
<base target="_top">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Оплаты</title>
<style>
:root{--bg:#F4F6F3;--card:#fff;--ink:#15211A;--mute:#5B6B61;--line:#DCE3DD;--g:#1E6B3C;--gi:#fff;--a:#B23A2B;--n:#D3DAD5}
@media(prefers-color-scheme:dark){:root{--bg:#0F1712;--card:#17221B;--ink:#E8F0EA;--mute:#93A69A;--line:#26362C;--g:#4FAE74;--gi:#0B1410;--a:#E8806F;--n:#33443A}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding-bottom:40px}
.wrap{max-width:560px;margin:0 auto;padding:0 16px}
h1{font-size:22px;margin:16px 0 10px}
input,select{font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px;min-height:44px;width:100%}
label{display:block;margin:10px 0 4px;color:var(--mute);font-size:14px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.row2>div{min-width:0}.row2 input{min-width:0;max-width:100%}
.row2 input[type=date]{-webkit-appearance:none;appearance:none;width:0;min-width:100%;max-width:100%;display:block;box-sizing:border-box}
button{font:inherit;cursor:pointer}
.btn{width:100%;min-height:46px;border:0;border-radius:12px;background:var(--g);color:var(--gi);font-weight:800;font-size:15px;margin-top:10px}
.btn.sec{background:none;color:var(--g);border:1px solid var(--line)}
.btn:disabled{opacity:.5}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.seg button{min-height:46px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--mute);font-weight:700}
.seg button[aria-pressed=true]{background:var(--g);border-color:var(--g);color:var(--gi)}
.tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin:12px 0}
.tile{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px}
.tile b{display:block;font-size:18px}.tile span{color:var(--mute);font-size:12px}
details{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 14px;margin-bottom:8px}
summary{cursor:pointer;list-style:none}summary::-webkit-details-marker{display:none}
.top{display:flex;justify-content:space-between;gap:8px;font-weight:700}
.bar{height:6px;border-radius:3px;background:var(--n);margin:8px 0 4px;overflow:hidden}.bar i{display:block;height:100%;background:var(--g)}
.sub{color:var(--mute);font-size:13px}
.ok{color:var(--g)}.err{color:var(--a)}
.pr{border-top:1px solid var(--line);margin-top:8px;padding-top:8px;font-size:14px}
.prh{display:flex;justify-content:space-between;gap:8px}
.msg{color:var(--mute);font-size:14px;min-height:20px;margin-top:8px}
</style>
</head>
<body>
<div id="login" class="wrap" hidden>
  <h1>Оплаты</h1><p>Введите код администратора</p>
  <input id="pin" type="password" autocomplete="off"><p id="lerr" class="err"></p><button class="btn" id="go">Войти</button>
</div>
<div id="app" class="wrap" hidden>
  <h1>Оплаты по месяцам</h1>
  <div class="row2"><select id="mon" aria-label="Месяц"></select>
    <select id="fs" aria-label="Показать"><option value="all">Все</option><option value="debt">Только должники</option></select></div>
  <input id="q" placeholder="Поиск по ФИ" style="margin-top:8px">
  <div class="row2">
    <div><label>Дата оплаты</label><input type="date" id="dt"></div>
    <div><label>Комментарий</label><input id="cm" placeholder="необязательно"></div>
  </div>
  <div class="tiles" id="sum"></div>
  <div class="msg" id="msg" role="status"></div>
  <div id="list"></div>
</div>
<script>
var pin='',D=null,flash='',reqN=0,method='',MN=['Январь','Февраль','Март','Апрель','Май','Июнь','Июль','Август','Сентябрь','Октябрь','Ноябрь','Декабрь'];
function monLabel(m){var a=m.split('.');return(MN[Number(a[0])-1]||m)+' 20'+a[1]}
function $(i){return document.getElementById(i)}
function run(fn,args,ok,fail){var r=google.script.run.withSuccessHandler(ok).withFailureHandler(function(e){fail(e&&e.message?e.message:String(e))});r[fn].apply(r,args)}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function money(n){return String(Math.round(n*100)/100).replace('.',',')+' ₾'}
function nn(s){return String(s).trim().toLowerCase()}
function today(){var d=new Date(),z=function(n){return(n<10?'0':'')+n};return d.getFullYear()+'-'+z(d.getMonth()+1)+'-'+z(d.getDate())}
function setMsg(t,bad){$('msg').textContent=t||'';$('msg').className='msg'+(bad?' err':'')}
function showLogin(t){$('app').hidden=true;$('login').hidden=false;$('lerr').textContent=t||''}
function friendly_(m){return String(m)}
function fail(m){m=friendly_(m);if(/уже оплачен/.test(m)){$('login').hidden=true;$('app').hidden=false;flash=m+' ';loadMonth();return}if(/код (администратора|доступа)/.test(m))showLogin('Неверный код доступа');else{$('login').hidden=true;$('app').hidden=false;setMsg(m,true)}}
function load(){
  $('dt').value=today();
  run('appPayMonths',[pin],function(ms){
    $('login').hidden=true;$('app').hidden=false;
    if(!ms.length){setMsg('В файле оплат нет листов месяцев.',true);return}
    var d=new Date(),k=('0'+(d.getMonth()+1)).slice(-2)+'.'+String(d.getFullYear()).slice(-2),old=$('mon').value;
    $('mon').innerHTML=ms.map(function(m){return'<option value="'+m+'">'+monLabel(m)+'</option>'}).join('');
    $('mon').value=ms.indexOf(old)>=0?old:(ms.indexOf(k)>=0?k:ms[ms.length-1]);
    loadMonth();
  },fail);
}
function loadMonth(){
  var n=++reqN;
  setMsg('Загрузка…');
  run('appPayMonth',[pin,$('mon').value],function(d){if(n==reqN){D=d;show()}},function(m){if(n==reqN)fail(m)});
}
function chip(r){return r.extra?'<span class="ok">доп. программа: в счёт '+esc(r.extra)+'</span>':r.st=='paid'?'<span class="ok">'+(r.disc?'скидка':'оплачено')+'</span>':r.st=='partial'?'<span class="err">частично, долг '+money(r.debt)+'</span>':'<span class="err">не платил</span>'}
function prow(r,gi,ri){
  var b='';
  if(r.st!='paid')b=r.id?'<button class="btn sec pb" data-g="'+gi+'" data-r="'+ri+'">Принять оплату</button>'
    +(r.st=='partial'?'<button class="btn sec dc" data-g="'+gi+'" data-r="'+ri+'">Считать оплаченным (скидка)</button>':'')
    :'<div class="sub err">Нет в реестре: сначала добавьте игрока в разделе «Игроки».</div>';
  return'<div class="pr"><div class="prh"><span>'+esc(r.name)+'</span>'+chip(r)+'</div><div class="sub">внесено '+money(r.paid)+(r.method?' · '+esc(r.method):'')+'</div>'+b+'<div class="pf" hidden></div></div>';
}
function show(){
  var q=nn($('q').value),only=$('fs').value=='debt',S=0,E=0,P=0,N=0,out='';
  D.groups.forEach(function(g,gi){
    var paidN=0,s=0,e=0;
    g.rows.forEach(function(r){if(r.extra)return;N++;e+=g.tariff;s+=r.paid;if(r.st=='paid'){paidN++;P++}});   // доп. программа считается в основной группе
    S+=s;E+=e;
    var rows=g.rows.map(function(r,ri){return{r:r,ri:ri}}).filter(function(x){return(!only||x.r.st!='paid')&&(!q||nn(x.r.name).indexOf(q)>=0)});
    if(!rows.length)return;
    out+='<details'+(only||q?' open':'')+'><summary><div class="top"><span>'+esc(g.name)+'</span><span>'+paidN+' из '+g.rows.length+'</span></div>'
      +'<div class="bar"><i style="width:'+(g.rows.length?Math.round(paidN*100/g.rows.length):0)+'%"></i></div><div class="sub">внесено '+money(s)+' из '+money(e)+', тариф '+money(g.tariff)+'</div></summary>'
      +rows.map(function(x){return prow(x.r,gi,x.ri)}).join('')+'</details>';
  });
  var t=function(a,b,c){return'<div class="tile"><b'+(c?' class="err"':'')+'>'+b+'</b><span>'+a+'</span></div>'};
  $('sum').innerHTML=t('внесено',money(S))+t('ожидается по тарифам',money(E))+t('оплатили',P+' из '+N)+t('должников',(N-P),N-P>0);
  setMsg(flash);flash='';$('list').innerHTML=out||'<p class="sub">Ничего не найдено.</p>';
}
// Форма строки: сумма и тип (если сумма меньше остатка). Способ, дата и комментарий — общие сверху.
function form(r){
  return'<label>Способ оплаты</label><div class="seg pmseg"><button class="pmb" data-m="Наличные" aria-pressed="false">Наличные</button><button class="pmb" data-m="Перевод" aria-pressed="false">Перевод</button></div>'
    +'<label>Сумма, ₾</label><input type="number" min="1" step="1" class="pa" value="'+r.debt+'" data-debt="'+r.debt+'">'
    +'<div class="pt" hidden><label>Сумма меньше остатка. Что это?</label><select class="ptype"><option value="">Выберите…</option><option value="Скидка">Скидка по договорённости (оплата принята)</option><option value="Частичный">Частичный платёж (останется долг)</option></select></div>'
    +'<button class="btn go2">Внести оплату</button><div class="msg err pm"></div>';
}
function done(r,msg){
  if(r&&r.dryRun){flash='Пробный режим: в таблицу ничего не записано. ';loadMonth();return}
  $('cm').value='';
  flash=msg+' ';loadMonth();
}
$('list').onclick=function(e){
  var b=e.target.closest('button');if(!b)return;
  if(b.classList.contains('pb')){
    var f=b.closest('.pr').querySelector('.pf');
    if(!f.innerHTML){
      f.innerHTML=form(D.groups[b.dataset.g].rows[b.dataset.r]);
      f.dataset.g=b.dataset.g;f.dataset.r=b.dataset.r;
    }
    f.hidden=!f.hidden;return;
  }
  if(b.classList.contains('dc')){
    var g2=D.groups[b.dataset.g],r2=g2.rows[b.dataset.r],M2=D.month,cm2=$('cm').value;
    // Скидка закрывает остаток без поступления денег
    ksConfirm({title:'Подтвердить скидку?',ok:'Подтвердить скидку',
      text:'Оплата будет отмечена как закрытая за счёт скидки. Денежное поступление не регистрируется.',
      rows:[['Игрок',r2.name],['За что','Абонемент, '+M2+', '+g2.name],['Внесено',ksMoney(r2.paid)+' из '+ksMoney(g2.tariff)],['Скидка',ksMoney(r2.debt)]],
      run:function(ok,bad){run('appSubDiscount',[pin,M2,g2.name,r2.id,cm2],function(x){ok();done(x,'Принято как скидка.')},bad)}});
    return;
  }
  if(b.classList.contains('go2')){
    var f2=b.closest('.pf'),g3=D.groups[f2.dataset.g],r3=g3.rows[f2.dataset.r];
    var amt=Number(f2.querySelector('.pa').value),type=f2.querySelector('.ptype').value,pm=f2.querySelector('.pm');
    var pmb=f2.querySelector('.pmb[aria-pressed=true]'),method=pmb?pmb.dataset.m:'';
    if(!method){pm.textContent='Выберите способ оплаты';return}
    if(!(amt>0)){pm.textContent='Введите сумму больше нуля';return}
    if(amt<r3.debt&&!type){pm.textContent='Выберите тип: скидка или частичный платёж';return}
    pm.textContent='';
    var M3=D.month,dt3=$('dt').value,cm3=$('cm').value,over=ksOverpay(amt,r3.debt);
    ksConfirm({title:'Подтвердить оплату?',ok:'Подтвердить оплату',
      warn:over?'Сумма больше остатка на '+ksMoney(over)+'. Вся сумма будет записана как оплата абонемента за '+M3+': внесено будет '+ksMoney(r3.paid+amt)+' из '+ksMoney(g3.tariff)+'.':'',
      rows:[['Игрок',r3.name],['Сумма',ksMoney(amt)],['За что','Абонемент, '+M3+', '+g3.name],
        ['Тип',amt>=r3.debt?'':type=='Частичный'?'Частичный платёж, останется долг '+ksMoney(r3.debt-amt):type=='Скидка'?'Скидка по договорённости, оплата принята':''],
        ['Способ',method],['Дата',ksDateIfNotToday(dt3)],['Комментарий',cm3.trim()]],
      run:function(ok,bad){run('appSubPay',[pin,M3,g3.name,r3.id,amt,type,dt3,cm3,method],function(x){ok();done(x,'Оплата внесена ('+x.kind+').')},bad)}});
  }
};
$('list').oninput=function(e){
  if(!e.target.classList.contains('pa'))return;
  var pt=e.target.closest('.pf').querySelector('.pt');
  pt.hidden=Number(e.target.value)>=Number(e.target.dataset.debt);
};
$('list').addEventListener('click',function(e){var b=e.target.closest('.pmb');if(!b)return;[].forEach.call(b.parentNode.children,function(x){x.setAttribute('aria-pressed',x==b)})});
$('mon').onchange=loadMonth;$('fs').onchange=show;$('q').oninput=show;
$('go').onclick=function(){pin=$('pin').value.trim();if(!pin)return;try{localStorage.setItem('kspin',pin)}catch(e){}load()};
try{pin=localStorage.getItem('kspin')||''}catch(e){}
if(pin)load();else showLogin('');
</script>
</body>
</html>
