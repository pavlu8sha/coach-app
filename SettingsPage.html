<!DOCTYPE html>
<html lang="ru">
<head>
<base target="_top">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Настройки</title>
<style>
:root{--bg:#F4F6F3;--card:#fff;--ink:#15211A;--mute:#5B6B61;--line:#DCE3DD;--g:#1E6B3C;--gi:#fff;--a:#B23A2B;--n:#D3DAD5}
@media(prefers-color-scheme:dark){:root{--bg:#0F1712;--card:#17221B;--ink:#E8F0EA;--mute:#93A69A;--line:#26362C;--g:#4FAE74;--gi:#0B1410;--a:#E8806F;--n:#33443A}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding-bottom:40px}
.wrap{max-width:560px;margin:0 auto;padding:0 16px}
h1{font-size:22px;margin:16px 0 10px}
h2{font-size:17px;margin:22px 0 8px}
input,select{font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px;min-height:44px;width:100%}
input:disabled{opacity:.6}
button{font:inherit;cursor:pointer}
button:disabled{opacity:.5;cursor:default}
.btn{width:100%;min-height:48px;border:0;border-radius:12px;background:var(--g);color:var(--gi);font-weight:800;font-size:16px;margin-top:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:8px}
.lbl{font-weight:700}
.sub{color:var(--mute);font-size:13px;margin-top:4px}
.row{display:flex;gap:8px;align-items:center;margin-top:8px}
.row input{flex:1}
.row .team{flex:1.4}
.sb{min-height:44px;border:0;border-radius:10px;background:var(--g);color:var(--gi);font-weight:700;padding:0 14px;white-space:nowrap}
.sec{min-height:44px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);padding:0 12px;white-space:nowrap}
.chip{display:inline-block;border:1px solid var(--line);border-radius:999px;padding:1px 9px;font-size:12px;color:var(--mute);margin-left:6px;font-weight:400}
.chip.bad{border-color:var(--a);color:var(--a)}
.err{color:var(--a)}.msg{color:var(--mute);font-size:14px;min-height:20px;margin-top:6px}
.ok{color:var(--g)}
.team-name{flex:1.4;font-weight:600}
.grp .card{margin-bottom:8px}
.seg3{display:flex;margin-top:10px;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.seg3 button{flex:1;min-height:44px;border:0;background:var(--card);color:var(--ink);font-weight:600}
.seg3 button[aria-pressed=true]{background:var(--g);color:var(--gi)}
/* Расписание: дни — раскрывающиеся блоки; на телефоне тренировка — краткая строка, поля по нажатию */
.sday{border-top:1px solid var(--line);padding:4px 0;border-radius:0!important;box-shadow:none!important}
.sday>summary{display:flex;gap:10px;align-items:baseline;padding:10px 0;cursor:pointer;list-style-position:outside}
.sday>summary .sub{margin:0}
.strn{border:1px solid var(--line);border-radius:10px;margin:6px 0;padding:0 10px}
.strn>summary{padding:10px 0;cursor:pointer;overflow-wrap:anywhere}
.srow{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px;padding:4px 0 10px}
.sf{display:block;min-width:0}.sf>span{display:block;font-size:12px;color:var(--mute);margin-bottom:2px}
.sf input,.sf select{padding:8px;min-height:40px;font-size:15px}
.sf-loc,.sf-group,.sf-trainers,.sf-att{grid-column:span 2}
.sf-del{display:flex;align-items:flex-end;justify-content:flex-end}
.sadd{width:100%;margin:6px 0 8px}
.shead{display:none}
/* Компьютер: шире колонка страницы, настройки в две колонки, тренировка — одна строка таблицы */
@media(min-width:840px){
  #app.wrap,#login.wrap{max-width:1040px}
  .grp{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;align-items:start}
  .grp .card{margin-bottom:0}
  #theme{max-width:520px}
  .shead,.sday .srow{display:grid;grid-template-columns:72px 72px 132px minmax(0,1fr) minmax(0,1fr) minmax(0,1fr) minmax(0,1fr) 72px 92px;gap:6px;align-items:center}
  .shead{font-size:12px;color:var(--mute);padding:0 0 2px}
  .sday .srow{padding:3px 0;border:0}
  .sday .srow .sf>span{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
  .sf-loc,.sf-group,.sf-trainers,.sf-att{grid-column:auto}
  .sf-del{align-items:center}
  .sadd{width:auto}
  .ssave{max-width:520px}
}
</style>
</head>
<body>
<div id="login" class="wrap" hidden>
  <h1>Вход</h1><p>Введите код администратора</p>
  <input id="pin" type="password" autocomplete="off"><p id="lerr" class="err"></p><button class="btn" id="go">Войти</button>
</div>
<div id="app" class="wrap" hidden>
  <h1>Настройки</h1>
  <div class="msg" id="msg" role="status"></div>
  <h2>Оформление</h2>
  <div class="card" id="theme"></div>
  <div id="list"></div>
  <h2>Цены</h2>
  <div class="card" id="prices"><div class="sub">Загрузка…</div></div>
  <h2>Расписание сезона</h2>
  <div class="card" id="sched"><div class="sub">Загрузка…</div></div>
</div>
<script>
var pin='',S=null,busy=false,notes={},SC=null,scBusy=false,PRC=null,prBusy=false;
function $(i){return document.getElementById(i)}
function run(fn,args,ok,fail){var r=google.script.run.withSuccessHandler(ok).withFailureHandler(function(e){fail(e&&e.message?e.message:String(e))});r[fn].apply(r,args)}
function esc(s){return String(s===null||s===undefined?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function setMsg(t,bad){$('msg').textContent=t||'';$('msg').className='msg'+(bad?' err':'')}
function showLogin(t){$('app').hidden=true;$('login').hidden=false;$('lerr').textContent=t||''}
function fail(m){if(m.indexOf('код администратора')>=0)showLogin('Неверный код администратора');else{$('login').hidden=true;$('app').hidden=false;setMsg(m,true)}}
var SRC={object:'значение команды',sheet:'из настроек',property:'из свойства скрипта',default:'по умолчанию',missing:'не задано',invalid:'неверное значение'};
function chip(it){var bad=it.source=='missing'||it.source=='invalid';return'<span class="chip'+(bad?' bad':'')+'">'+esc(SRC[it.source]||it.source)+'</span>'}
function norm(s){return String(s||'').replace(/\s+/g,' ').trim().toLowerCase()}
function inputVal(it){return it.source=='invalid'?(it.raw==null?'':it.raw):(it.value==null?'':it.value)} // null с сервера приходит как undefined
function field(k,id,val,dis){
  var num=k.type=='int'||k.type=='money';
  return'<input id="'+id+'" '+(num?'type="number" inputmode="decimal" step="'+(k.type=='int'?'1':'0.01')+'"'+(k.min!==undefined&&k.min!==null?' min="'+k.min+'"':'')+(k.max!==undefined&&k.max!==null?' max="'+k.max+'"':''):'type="text"')+' value="'+esc(val)+'"'+(dis?' disabled':'')+'>';
}
function note(key,obj){var n=notes[key+'|'+norm(obj)];return n?'<div class="msg '+(n.bad?'err':'ok')+'">'+esc(n.t)+'</div>':''}
function load(after){
  setMsg(S?'':'Загрузка…');
  run('appSettings',[pin],function(d){S=d;$('login').hidden=true;$('app').hidden=false;setMsg(d.dryRun?'Пробный режим: изменения не записываются.':'');render();if(after)after();if(!SC)loadSched();if(!PRC)loadPrices();renderTheme()},fail);
}
function render(keep){
  var typed={};
  if(keep)[].forEach.call(document.querySelectorAll('#list input'),function(i){typed[i.id]=i.value});
  var groups={},order=[];
  Object.keys(S.keys).forEach(function(key){var g=S.keys[key].group;if(!groups[g]){groups[g]=[];order.push(g)}groups[g].push(key)});
  $('list').innerHTML=order.map(function(g){return'<h2>'+esc(g)+'</h2><div class="grp">'+groups[g].map(card).join('')+'</div>'}).join('');
  [].forEach.call(document.querySelectorAll('#list button'),function(b){b.disabled=busy||b.hasAttribute('data-off')});
  if(keep)Object.keys(typed).forEach(function(id){if($(id))$(id).value=typed[id]});
}
function card(key){
  var k=S.keys[key],items=S.items.filter(function(x){return x.key==key}),gen=items.filter(function(x){return!x.obj})[0],objs=items.filter(function(x){return x.obj});
  var h='<div class="card"><div class="lbl">'+esc(k.perObject?k.label+' — общий':k.label)+chip(gen)+'</div>';
  if(k.locked)h+='<div class="sub err">'+esc(k.locked)+'</div>';
  if(gen.error)h+='<div class="sub err">'+esc(gen.error)+'</div>';
  if(k.perObject)h+='<div class="sub">Действует для всех команд без своего значения, в том числе для новых.</div>';
  h+='<div class="row">'+field(k,'v_'+key,inputVal(gen),!!k.locked)
    +'<button class="sb" data-a="save" data-k="'+esc(key)+'" data-o=""'+(k.locked?' data-off':'')+'>Сохранить</button>'
    +(k.hasDefault?'<button class="sec" data-a="reset" data-k="'+esc(key)+'" data-o=""'+(k.locked||gen.source=='default'?' data-off':'')+'>По умолчанию</button>'
      :'<button class="sec" data-a="reset" data-k="'+esc(key)+'" data-o=""'+(gen.source=='missing'?' data-off':'')+'>Очистить</button>')+'</div>';
  if(k.hasDefault)h+='<div class="sub">По умолчанию: '+esc(k.def)+'</div>';
  h+=note(key,'');
  if(k.perObject){
    h+='<div class="lbl" style="margin-top:14px">'+esc(k.objectsTitle||'Свои значения')+'</div>';
    if(!objs.length)h+='<div class="sub">Нет. Все используют общее значение.</div>';
    objs.forEach(function(it,i){
      h+='<div class="row"><span class="team-name">'+esc(it.obj)+chip(it)+'</span>'+field(k,'v_'+key+'_'+i,inputVal(it))
        +'<button class="sb" data-a="save" data-k="'+esc(key)+'" data-o="'+esc(it.obj)+'" data-i="'+i+'">Сохранить</button>'
        +'<button class="sec" data-a="reset" data-k="'+esc(key)+'" data-o="'+esc(it.obj)+'" title="Удалить своё значение">К общему</button></div>'
        +(it.error?'<div class="sub err">'+esc(it.error)+'</div>':'')+note(key,it.obj);
    });
    var used={};objs.forEach(function(it){used[norm(it.obj)]=1});
    var free=(k.choices||[]).filter(function(t){return!used[norm(t)]});
    h+='<div class="lbl" style="margin-top:14px">Добавить своё значение</div>'
      +'<datalist id="dl_'+esc(key)+'">'+free.map(function(t){return'<option value="'+esc(t)+'">'}).join('')+'</datalist>'
      +'<div class="row"><input class="team" id="nt_'+esc(key)+'" list="dl_'+esc(key)+'" placeholder="'+esc(k.perObject)+'">'+field(k,'nv_'+key,'')
      +'<button class="sb" data-a="add" data-k="'+esc(key)+'">Добавить</button></div>'+note(key,'__new');
  }
  return h+'</div>';
}
function save(key,obj,value,noteKey,prefix){
  busy=true;notes={};notes[key+'|'+norm(noteKey)]={t:'Сохраняю…'};render(true);
  run('appSettingsSave',[pin,key,obj,value],function(r){
    busy=false;
    var t=r.dryRun?'Пробный режим: не записано.':(r.unchanged?'Нечего очищать.':(prefix||'Сохранено: ')+(r.value===null||r.value===undefined?'не задано':(Array.isArray(r.value)?r.value.join(', '):r.value)));
    load(function(){notes={};notes[key+'|'+norm(noteKey)]={t:t};render()});
  },function(m){
    busy=false;
    if(m.indexOf('код администратора')>=0){showLogin('Неверный код администратора');return}
    notes={};notes[key+'|'+norm(noteKey)]={t:m,bad:true};render(true);
  });
}
$('list').onclick=function(e){
  var b=e.target.closest('button');if(!b||b.disabled)return;
  var key=b.dataset.k,obj=b.dataset.o||'',k=S.keys[key];
  if(b.dataset.a=='save'){
    var id=obj?'v_'+key+'_'+b.dataset.i:'v_'+key,v=$(id).value.trim();
    if(v===''){notes={};notes[key+'|'+norm(obj)]={t:'Введите значение или нажмите «'+(obj?'К общему':(k.hasDefault?'По умолчанию':'Очистить'))+'»',bad:true};render(true);return}
    save(key,obj,v,obj);
  }else if(b.dataset.a=='reset'){
    if(!obj&&k.required&&!confirm('Очистить общее значение «'+k.label+'»? Пока его нет, у команд без своего значения сумма подставляться не будет.'))return;
    // у команды строка исчезнет, поэтому подтверждение показываем у общего значения
    if(obj)save(key,obj,'','',obj+': своё значение удалено, действует общее — ');else save(key,'','','',k.hasDefault?'Возвращено значение по умолчанию: ':'Очищено. Сейчас: ');
  }else if(b.dataset.a=='add'){
    var t=$('nt_'+key).value.replace(/\s+/g,' ').trim(),nv=$('nv_'+key).value.trim();
    if(!t||nv===''){notes={};notes[key+'|__new']={t:'Укажите '+k.perObject.toLowerCase()+' и значение',bad:true};render(true);return}
    save(key,t,nv,'__new');
  }
};
// ---------- Цены с месяца (Prices.js: appPrices / appPriceAdd / appPriceDelete) ----------
function nextMonth(){var d=new Date();d.setDate(1);d.setMonth(d.getMonth()+1);return('0'+(d.getMonth()+1)).slice(-2)+'.'+String(d.getFullYear()).slice(2)}
function loadPrices(note,bad){run('appPrices',[pin],function(d){PRC=d;renderPrices(note,bad)},function(m){$('prices').innerHTML='<div class="sub err">'+esc(m)+'</div>'})}
function renderPrices(note,bad,keep){
  var typed={};if(keep)['pf','pk','pg','pp'].forEach(function(i){if($(i))typed[i]=$(i).value});
  var h='<div class="lbl">Абонемент и индивидуальные занятия</div><div class="sub">Новая цена действует с выбранного месяца. Прошлые месяцы остаются по своей цене. Своя цена группы важнее общей.</div>'
    +'<div class="sub">Сейчас: абонемент '+esc(PRC.now.sub)+' ₾, индивидуальное занятие '+esc(PRC.now.ind)+' ₾.</div>';
  if(PRC.bad.length)h+='<div class="sub err">В листе «ЦЕНЫ» пропущены строки: '+PRC.bad.map(function(b){return b.line+' ('+esc(b.error)+')'}).join('; ')+'</div>';
  h+='<div class="lbl" style="margin-top:12px">История</div>';
  if(!PRC.rows.length)h+='<div class="sub">Строк ещё нет, действуют цены по умолчанию: '+PRC.defaults.map(function(d){return esc(d.kind+(d.group?' ('+d.group+')':'')+' — '+d.price+' ₾')}).join(', ')+'.</div>';
  PRC.rows.forEach(function(r){
    h+='<div class="row"><span class="team-name">с '+esc(r.from)+' · '+esc(r.kind)+(r.group?' · '+esc(r.group):r.kind==PRC.kinds[0]?' · все группы':'')+'</span><b>'+esc(r.price)+' ₾</b>'
      +(r.future?'<button class="sec" data-pa="del" data-l="'+r.line+'">Удалить</button>':'')+'</div>';
  });
  h+='<div class="lbl" style="margin-top:14px">Новая цена</div><div class="sgrid">'
    +'<div><label>С месяца</label><input id="pf" placeholder="ММ.ГГ" value="'+esc(nextMonth())+'"></div>'
    +'<div class="w2"><label>Позиция</label><select id="pk">'+PRC.kinds.map(function(k){return'<option>'+esc(k)+'</option>'}).join('')+'</select></div>'
    +'<div><label>Цена, ₾</label><input id="pp" type="number" inputmode="decimal" min="0" step="1"></div>'
    +'<div class="w2"><label>Группа (для абонемента; пусто — все)</label><input id="pg" placeholder="например weekends"></div></div>'
    +'<div class="row"><button class="sb" data-pa="add" style="flex:1">Добавить цену</button></div>'
    +'<div class="msg'+(bad?' err':' ok')+'">'+esc(note||'')+'</div>';
  $('prices').innerHTML=h;
  Object.keys(typed).forEach(function(i){$(i).value=typed[i]});
  [].forEach.call(document.querySelectorAll('#prices button'),function(b){b.disabled=prBusy});
}
$('prices').addEventListener('click',function(e){
  var b=e.target.closest('button');if(!b||b.disabled||!PRC)return;
  var done=function(t){prBusy=false;loadPrices(t)},err=function(m){prBusy=false;if(m.indexOf('код администратора')>=0){showLogin('Неверный код администратора');return}renderPrices(m,true,true)};
  if(b.dataset.pa=='add'){
    var o={from:$('pf').value.trim(),kind:$('pk').value,group:$('pg').value.trim(),price:$('pp').value.trim()};
    if(o.kind!=PRC.kinds[0])o.group='';
    if(o.price===''){renderPrices('Введите цену',true,true);return}
    if(!confirm('Добавить цену: '+o.kind+(o.group?' ('+o.group+')':'')+' — '+o.price+' ₾ с '+o.from+'?'))return;
    prBusy=true;renderPrices('Сохраняю…',false,true);
    run('appPriceAdd',[pin,o],function(r){done(r.dryRun?'Пробный режим: не записано.':'Добавлено: '+o.kind+(o.group?' ('+o.group+')':'')+' — '+o.price+' ₾ с '+o.from+'.')},err);
  }else if(b.dataset.pa=='del'){
    if(!confirm('Удалить будущую цену?'))return;
    prBusy=true;renderPrices('Удаляю…');
    run('appPriceDelete',[pin,Number(b.dataset.l)],function(r){done(r.dryRun?'Пробный режим: не записано.':'Удалено.')},err);
  }
});
// ---------- Расписание сезона (Schedule.js: appSchedule / appScheduleSave) ----------
function loadSched(note,bad){
  run('appSchedule',[pin],function(d){SC=d;SC.rows=d.rows.map(function(r){return Object.assign({},r)});renderSched(note,bad)},function(m){$('sched').innerHTML='<div class="sub err">'+esc(m)+'</div>'});
}
var WIDE=window.matchMedia?window.matchMedia('(min-width:840px)'):{matches:false},scOpen={},scDirty=false;
var DAYN={пн:'Понедельник',вт:'Вторник',ср:'Среда',чт:'Четверг',пт:'Пятница',сб:'Суббота',вс:'Воскресенье'};
function schedInp(i,k,lbl,ph){return'<label class="sf sf-'+k+'"><span>'+lbl+'</span><input data-r="'+i+'" data-k="'+k+'" value="'+esc(SC.rows[i][k])+'"'+(ph?' placeholder="'+ph+'"':'')+(k=='start'||k=='end'?' inputmode="numeric"':'')+'></label>'}
function schedSel(i,k,lbl,opts){return'<label class="sf sf-'+k+'"><span>'+lbl+'</span><select data-r="'+i+'" data-k="'+k+'">'+opts.map(function(o){return'<option'+(o==SC.rows[i][k]?' selected':'')+'>'+esc(o)+'</option>'}).join('')+'</select></label>'}
function schedDays(){return SC.days.slice(1).concat(SC.days[0])}
function schedFields(i){
  return schedInp(i,'start','Начало','16:00')+schedInp(i,'end','Конец','17:00')+schedSel(i,'type','Тип',SC.types)
    +schedInp(i,'loc','Локация')+schedInp(i,'group','Группа','как в «Тренировках»')+schedInp(i,'trainers','Тренеры','через запятую')
    +schedInp(i,'att','Группы в отметках','группы реестра')+schedSel(i,'day','День',schedDays())
    +'<div class="sf sf-del"><button class="sec" data-sa="del" data-r="'+i+'" title="Удалить тренировку">Удалить</button></div>';
}
function schedSum(r){return'<b>'+esc(r.start||'—')+'–'+esc(r.end||'—')+'</b> · '+esc(r.group||'группа не указана')+'<span class="sub"> · '+esc(r.loc||'')+(r.trainers?' · '+esc(r.trainers):'')+'</span>'}
function renderSched(note,bad){
  var wide=WIDE.matches,h='<div class="lbl">Тренировки по дням<span class="chip">'+(SC.source=='sheet'?'из листа «РАСПИСАНИЕ»':'по умолчанию, лист ещё не создан')+'</span></div>'
    +'<div class="sub">«Группа» — как в листе «Тренировки». «Группы в отметках» — группы реестра через запятую: в этот день они показываются в «Отметках» как группы дня.</div>';
  if(SC.bad&&SC.bad.length)h+='<div class="sub err">В листе пропущены строки: '+SC.bad.map(function(b){return b.line+' ('+esc(b.error)+')'}).join('; ')+'</div>';
  schedDays().forEach(function(d){
    var idx=[];SC.rows.forEach(function(r,i){if(r.day==d)idx.push(i)});
    idx.sort(function(a,b){return String(SC.rows[a].start).localeCompare(String(SC.rows[b].start))});
    h+='<details class="sday" data-day="'+d+'"'+(scOpen[d]?' open':'')+'><summary><b>'+DAYN[d]+'</b><span class="sub">'+(idx.length?idx.length+' трен.':'нет тренировок')+'</span></summary>';
    if(wide&&idx.length)h+='<div class="shead"><span>Начало</span><span>Конец</span><span>Тип</span><span>Локация</span><span>Группа</span><span>Тренеры</span><span>Группы в отметках</span><span>День</span><span></span></div>';
    idx.forEach(function(i){
      h+=wide?'<div class="srow">'+schedFields(i)+'</div>'
        :'<details class="strn"'+(SC.rows[i]._open?' open':'')+' data-r="'+i+'"><summary>'+schedSum(SC.rows[i])+'</summary><div class="srow">'+schedFields(i)+'</div></details>';
    });
    h+='<button class="sec sadd" data-sa="add" data-day="'+d+'">+ Тренировка: '+DAYN[d].toLowerCase()+'</button></details>';
  });
  h+='<div class="row ssave"><button class="sb" data-sa="save" style="flex:1">Сохранить расписание</button></div>'
    +'<div class="msg'+(bad?' err':scDirty?'':' ok')+'" id="scmsg">'+esc(note||(scDirty?'Есть несохранённые изменения.':''))+'</div>';
  $('sched').innerHTML=h;
  [].forEach.call(document.querySelectorAll('#sched button'),function(b){b.disabled=scBusy});
}
if(WIDE.addEventListener)WIDE.addEventListener('change',function(){if(SC)renderSched()});
$('sched').addEventListener('toggle',function(e){var t=e.target;if(t.classList.contains('sday'))scOpen[t.dataset.day]=t.open;else if(t.classList.contains('strn'))SC.rows[t.dataset.r]._open=t.open},true);
function scEdit(e){var t=e.target;if(t.dataset.r===undefined||!t.dataset.k)return;SC.rows[t.dataset.r][t.dataset.k]=t.value;
  if(!scDirty){scDirty=true;var m=$('scmsg');if(m){m.textContent='Есть несохранённые изменения.';m.className='msg'}}
  if(t.dataset.k=='day'){scOpen[t.value]=true;renderSched()}}
$('sched').addEventListener('input',scEdit);
$('sched').addEventListener('change',scEdit);
$('sched').addEventListener('click',function(e){
  var b=e.target.closest('button');if(!b||b.disabled||!SC)return;
  if(b.dataset.sa=='del'){var r=SC.rows[b.dataset.r];if(!confirm('Удалить тренировку '+(r.start||'')+' '+(r.group||'')+'?'))return;SC.rows.splice(Number(b.dataset.r),1);scDirty=true;renderSched('Тренировка удалена. Чтобы изменения вступили в силу, нажмите «Сохранить расписание».');return}
  if(b.dataset.sa=='add'){var d=b.dataset.day||'пн';SC.rows.push({day:d,start:'',end:'',type:'Групповая',loc:'',group:'',trainers:'',att:'',_open:true});scOpen[d]=true;scDirty=true;renderSched();return}
  if(b.dataset.sa=='save'){
    scBusy=true;renderSched('Сохраняю…');
    var rows=SC.rows.map(function(r){return{day:r.day,start:r.start,end:r.end,type:r.type,loc:r.loc,group:r.group,trainers:r.trainers,att:r.att}});
    run('appScheduleSave',[pin,rows],function(r){scBusy=false;scDirty=false;loadSched(r.dryRun?'Пробный режим: не записано.':'Сохранено: тренировок '+r.count+'.')},
      function(m){scBusy=false;if(m.indexOf('код администратора')>=0){showLogin('Неверный код администратора');return}renderSched(m,true)});
  }
});
window.addEventListener('beforeunload',function(e){if(scDirty){e.preventDefault();e.returnValue=''}});
// ---------- Оформление: тема (Nav.html: ksSetTheme, хранится в браузере) ----------
function renderTheme(){
  var t=window.ksTheme?window.ksTheme():'';
  $('theme').innerHTML='<div class="lbl">Тема</div><div class="sub">Только для этого браузера. «Авто» — как в настройках телефона или компьютера.</div>'
    +'<div class="seg3">'+[['','Авто'],['light','Светлая'],['dark','Тёмная']].map(function(x){return'<button data-t="'+x[0]+'" aria-pressed="'+(t==x[0])+'">'+x[1]+'</button>'}).join('')+'</div>';
}
$('theme').addEventListener('click',function(e){var b=e.target.closest('button');if(!b||!window.ksSetTheme)return;window.ksSetTheme(b.dataset.t);renderTheme()});
document.addEventListener('kstheme',function(){if($('theme').innerHTML)renderTheme()});
$('go').onclick=function(){pin=$('pin').value.trim();if(!pin)return;try{localStorage.setItem('kspin',pin)}catch(e){}load()};
try{pin=localStorage.getItem('kspin')||''}catch(e){}
if(pin)load();else showLogin('');
</script>
</body>
</html>
