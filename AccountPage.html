<!DOCTYPE html>
<html lang="ru">
<head>
<base target="_top">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Посещаемость тренеров</title>
<style>
:root{--bg:#F4F6F3;--card:#fff;--ink:#15211A;--mute:#5B6B61;--line:#DCE3DD;--g:#1E6B3C;--gi:#fff;--a:#B23A2B;--n:#D3DAD5}
@media(prefers-color-scheme:dark){:root{--bg:#0F1712;--card:#17221B;--ink:#E8F0EA;--mute:#93A69A;--line:#26362C;--g:#4FAE74;--gi:#0B1410;--a:#E8806F;--n:#33443A}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding-bottom:40px}
.wrap{max-width:560px;margin:0 auto;padding:0 16px}
h1{font-size:22px;margin:16px 0 10px}
input,select{font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px;min-height:44px;width:100%;min-width:0}
button{font:inherit;cursor:pointer}
.btn{width:100%;min-height:48px;border:0;border-radius:12px;background:var(--g);color:var(--gi);font-weight:800;font-size:16px;margin-top:12px}
.tabs{display:flex;gap:6px;margin:8px 0}
.tabs button{flex:1;min-height:40px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink)}
.tabs button.on{background:var(--g);color:var(--gi);border-color:var(--g)}
/* DS-017: на 360 px четыре вкладки не помещались в ряд (документ шире экрана на 48 px) — на экране до 400 px — 2 × 2 */
@media (max-width:400px){.tabs{flex-wrap:wrap}.tabs button{flex:1 1 calc(50% - 3px)}}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px;min-width:0}
.grid2>*{min-width:0}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px}
.pair>*{min-width:0;width:100%}
input[type=date],input[type=time]{-webkit-appearance:none;appearance:none;display:block;width:100%;min-width:0;box-sizing:border-box}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 14px;margin-top:8px}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:left;padding:6px 4px;border-top:1px solid var(--line);vertical-align:top}
th{color:var(--mute);font-weight:600}
.scroll{overflow-x:auto}
/* UI-004: таблица в отдельной карточке; если колонки не помещаются — прокручивается только таблица, не страница */
.tbl{background:var(--card);border:1px solid var(--line);border-radius:12px;margin-top:10px;overflow-x:auto;-webkit-overflow-scrolling:touch;overscroll-behavior-x:contain}
.tbl th,.tbl td{padding:8px 10px;white-space:nowrap}
.tbl tr:first-child th{border-top:0}
.tbl td.w,.tbl td[colspan]{white-space:normal}.tbl td.w{min-width:160px}
.ask{font-weight:600;margin:10px 0 0}
/* UI-004: выбор месяца стрелками; нажатие на название открывает полный список (настоящий select поверх надписи) */
.mbar{display:flex;align-items:center;gap:6px;background:var(--card);border:1px solid var(--color-border-strong);border-radius:12px;padding:3px;margin:0 0 8px}
.mstep{flex:none;width:44px;height:44px;border:0;border-radius:10px;background:var(--bg);color:var(--ink);font-size:24px;font-weight:700;line-height:1}
.mstep:disabled{opacity:.35;cursor:default}
.mcur{position:relative;flex:1;min-width:0;height:44px;margin:0;display:flex;align-items:center;justify-content:center;gap:8px;font-size:16px;font-weight:700;color:var(--ink);border-radius:10px}
.mcur svg{width:18px;height:18px;flex:none}
.mcur select{position:absolute;top:0;left:0;width:100%;height:100%;min-height:0;opacity:0;cursor:pointer;margin:0}
.mcur:focus-within{outline:3px solid var(--g);outline-offset:1px}
/* по макету UI-004: «Проведено» — плашка, дата коротко (год виден в выборе месяца) */
.yn{display:inline-block;min-width:44px;text-align:center;font-size:12px;font-weight:700;border-radius:999px;padding:2px 10px}
.yn.y{background:var(--color-success-subtle);color:var(--color-success)}.yn.n{background:var(--color-danger-subtle);color:var(--color-danger-strong)}
.msg{color:var(--mute);font-size:14px;min-height:20px;margin-top:8px}
.err{color:var(--a)}
label{font-size:13px;color:var(--mute);display:flex;gap:8px;align-items:center;margin-top:8px}
label:has(> input[type=checkbox]){min-height:44px}label > input[type=checkbox]{width:22px;height:22px;min-height:0;flex:none} /* DS-015: цель касания ≥ 44 px */
label input{width:auto;min-height:0}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.chips button{min-height:36px;border:1px solid var(--line);border-radius:999px;background:var(--card);color:var(--ink);padding:4px 12px}
.chips button.on{background:var(--g);color:var(--gi);border-color:var(--g)}
/* DS-016: статус тренировки в таблице — плашка (DESIGN_SYSTEM_V1 §6.3): «записана» — success, «не проводилась» — нейтральная */
span.chip{display:inline-block;font-size:12px;font-weight:600;line-height:1.5;border-radius:999px;padding:1px 10px;white-space:nowrap;background:var(--color-neutral-fill,#D2D8E6);color:var(--ink)}
span.chip.on{background:var(--color-success-subtle,#DFF2E7);color:var(--color-success,#1E7A4C)}
.top{display:flex;justify-content:space-between;gap:8px;font-weight:700}
.bar{height:6px;border-radius:3px;background:var(--n);margin-top:8px;overflow:hidden}.bar i{display:block;height:100%;background:var(--g)}
.sub{color:var(--mute);font-size:13px;margin-top:8px}
details{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 14px;margin-top:8px}
summary{cursor:pointer;list-style:none}
summary::-webkit-details-marker{display:none}
ul{list-style:none;margin:6px 0 0;padding:0}
li{display:flex;justify-content:space-between;gap:8px;padding:6px 0;border-top:1px solid var(--line);font-size:14px}
li small{color:var(--mute)}
</style>
</head>
<body>
<div id="login" class="wrap" hidden>
  <h1>Вход</h1><p>Введите код доступа</p>
  <input id="pin" type="password" autocomplete="off"><p id="lerr" class="err"></p><button class="btn" id="go">Войти</button>
</div>
<div id="app" class="wrap" hidden>
  <h1>Посещаемость тренеров</h1>
  <div class="mbar">
    <button type="button" class="mstep" id="mprev" aria-label="Предыдущий месяц">‹</button>
    <label class="mcur"><svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg><span id="mlab"></span><select id="mon" aria-label="Месяц"></select></label>
    <button type="button" class="mstep" id="mnext" aria-label="Следующий месяц">›</button>
  </div>
  <div class="tabs">
    <button data-t="tr" class="on">Тренировки</button>
    <button data-t="gm">Игры</button>
    <button data-t="st">Статистика</button>
    <button data-t="dy">Расписание</button>
  </div>
  <div class="msg" id="msg" role="status"></div>

  <div id="pane-tr">
    <div class="card" id="add-box">
      <div class="pair">
        <input id="a-date" type="date" aria-label="Дата">
        <select id="a-trainer" aria-label="Тренер"></select>
      </div>
      <div id="a-tr-extra"></div>
      <div class="grid2" style="margin:10px 0 12px">
        <button class="btn" type="button" id="a-tr-add" style="margin-top:0;min-height:40px;font-size:14px;background:var(--card);color:var(--ink);border:1px solid var(--line)">+ тренер</button>
        <button class="btn" type="button" id="a-tr-rm" style="margin-top:0;min-height:40px;font-size:14px;background:var(--card);color:var(--ink);border:1px solid var(--line)">− тренер</button>
      </div>
      <div class="pair">
        <select id="a-group" aria-label="Группа"></select>
        <select id="a-loc" aria-label="Локация"></select>
      </div>
      <div class="pair">
        <select id="a-type" aria-label="Тип"></select>
        <div class="pair">
          <input id="a-start" type="time" aria-label="Начало">
          <input id="a-end" type="time" aria-label="Конец">
        </div>
      </div>
      <label><input type="checkbox" id="a-held" checked> Проведено</label>
      <button class="btn" id="a-save">Добавить тренировку</button>
    </div>
    <div class="tbl ks-wide"><table id="tr-table"></table></div>
  </div>

  <div id="pane-dy" hidden>
    <input id="dy-date" type="date" aria-label="Дата">
    <div id="dy-list"></div>
  </div>

  <div id="pane-gm" hidden><div class="tbl ks-wide"><table id="gm-table"></table></div></div>
  <div id="pane-st" hidden>
    <div class="grid2" style="margin-bottom:8px;align-items:stretch"><input id="newtr" placeholder="Имя нового тренера" style="height:48px;margin:0"><button class="btn sec" id="addtr" style="height:48px;margin:0">Добавить тренера</button></div>
    <div class="msg" id="trmsg" role="status"></div>
    <div class="chips" id="chips"></div>
  <div id="st-table"></div></div>
</div>
<script>
var pin='',reqN=0,MN=['Январь','Февраль','Март','Апрель','Май','Июнь','Июль','Август','Сентябрь','Октябрь','Ноябрь','Декабрь'];
var tab='tr',trFilter='',cache={months:[],trainings:[],games:[],stats:[],trainers:[]};
function $(i){return document.getElementById(i)}
function run(fn,args,ok,fail){var r=google.script.run.withSuccessHandler(ok).withFailureHandler(function(e){fail(e&&e.message?e.message:String(e))});r[fn].apply(r,args)}
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function monLabel(m){var a=m.split('.');var y=a[1]&&a[1].length===2?'20'+a[1]:(a[1]||'');return(MN[Number(a[0])-1]||m)+' '+y}
function fmtH(n){return String(Math.round(Number(n||0)*100)/100).replace('.',',')}
function setMsg(t,bad){$('msg').textContent=t||'';$('msg').className='msg'+(bad?' err':'')}
function showLogin(t){$('app').hidden=true;$('login').hidden=false;$('lerr').textContent=t||''}
function fail(m){if(String(m).indexOf('код доступа')>=0)showLogin('Неверный код доступа');else{$('login').hidden=true;$('app').hidden=false;setMsg(m,true)}}

function fillOpts(id,list,empty){
  $(id).innerHTML=(empty?'<option value="">'+empty+'</option>':'')+list.map(function(v){return'<option value="'+esc(v)+'">'+esc(v)+'</option>'}).join('');
}
function loadOptions(){
  run('appTrainingOptions',[pin],function(o){
    fillOpts('a-trainer',o.trainers,'Тренер');
    fillOpts('a-loc',o.locations,'Локация');
    fillOpts('a-group',o.groups,'Группа');
    fillOpts('a-type',o.types,'Тип тренировки');
    cache.trainers=o.trainers;
    drawChips();
  },function(){});
}
function init(){
  loadOptions();
  run('appAccountMonths',[pin],function(ms){
    $('login').hidden=true;$('app').hidden=false;
    cache.months=ms;
    if(!ms.length){setMsg('Нет игр и тренировок.');return}
    var d=new Date(),k=('0'+(d.getMonth()+1)).slice(-2)+'.'+String(d.getFullYear());
    $('mon').innerHTML=ms.map(function(m){return'<option value="'+m+'">'+monLabel(m)+'</option>'}).join('');
    $('mon').value=ms.indexOf(k)>=0?k:ms[ms.length-1];monSync();
    load();
  },fail);
}
function load(){
  var n=++reqN,m=$('mon').value;
  gmEdit=null;
  setMsg('Загружаю…');
  run('appTrainingsList',[pin,m],function(t){if(n!=reqN)return;cache.trainings=t;drawTr();setMsg('')},function(e){if(n==reqN)setMsg(e,true)});
  run('appGamesData',[pin,m],function(d){if(n!=reqN)return;cache.games=d.games;cache.stats=d.stats;drawGm();drawSt();setMsg('')},function(e){if(n==reqN)setMsg(e,true)});
}
function dShort(d){var m=/^(\d{2}\.\d{2})\.\d{4}$/.exec(String(d||''));return m?'<span title="'+esc(d)+'">'+m[1]+'</span>':esc(d)}
function drawTr(){
  var rows=cache.trainings.map(function(t){
    return'<tr><td>'+dShort(t.date)+'</td><td>'+esc(t.trainer)+'</td><td>'+esc(t.group)+'</td><td>'+(t.held?'<span class="yn y">Да</span>':'<span class="yn n">Нет</span>')+'</td><td>'+fmtH(t.hours)+'</td></tr>';
  }).join('');
  $('tr-table').innerHTML='<tr><th>Дата</th><th>Тренер</th><th>Группа</th><th>Проведено</th><th>Часы</th></tr>'+(rows||'<tr><td colspan="5">Нет тренировок</td></tr>');
}
var GM_ROLES=['Тренер','Оператор'],gmEdit=null;
var GM_BTN='margin-top:0;min-height:40px;font-size:14px;background:var(--card);color:var(--ink);border:1px solid var(--line)';
function gmRead(){
  // Переносим значения формы в gmEdit, чтобы не потерять ввод при добавлении/удалении строки
  if(!gmEdit)return;
  gmEdit.list=gmEdit.list.map(function(s,j){
    var n=document.querySelector('[data-gmn="'+j+'"]'),r=document.querySelector('[data-gmr="'+j+'"]'),c=document.querySelector('[data-gmg="'+j+'"]');
    return{name:n?n.value:s.name,role:r?r.value:s.role,reg:c?c.checked:s.reg};
  });
}
function gmForm(){
  var body=gmEdit.list.map(function(s,j){
    var names=cache.trainers.slice();if(s.name&&names.indexOf(s.name)<0)names.push(s.name);
    return'<div class="pair" style="margin-bottom:4px"><select data-gmn="'+j+'" aria-label="Сотрудник">'+names.map(function(t){return'<option'+(t===s.name?' selected':'')+'>'+esc(t)+'</option>'}).join('')+'</select>'+
      '<select data-gmr="'+j+'" aria-label="Роль">'+GM_ROLES.map(function(r){return'<option'+(r===s.role?' selected':'')+'>'+r+'</option>'}).join('')+'</select></div>'+
      '<div class="grid2" style="align-items:center"><label style="margin:0"><input type="checkbox" data-gmg="'+j+'"'+(s.reg?' checked':'')+'> Регламент выполнен</label>'+
      '<button class="btn" type="button" data-gmdel="'+j+'" style="'+GM_BTN+'">Удалить</button></div>';
  }).join('');
  return'<div class="card">'+(body||'<div class="sub">Состав пуст</div>')+
    '<div class="grid2" style="margin-top:10px"><button class="btn" type="button" data-gmadd="1" style="'+GM_BTN+'">+ сотрудник</button>'+
    '<button class="btn" type="button" data-gmsave="1" style="margin-top:0;min-height:40px;font-size:14px">Сохранить</button></div>'+
    '<button class="btn" type="button" data-gmcancel="1" style="'+GM_BTN+'">Отмена</button></div>';
}
function gmSave(){
  gmRead();
  var g=cache.games[gmEdit.i];
  var staff=gmEdit.list.filter(function(s){return s.name});
  setMsg('Сохраняю…');
  run('appGameStaffSet',[pin,g.date,g.team,g.opp,staff],function(){gmEdit=null;load();setMsg('Состав сохранён')},function(e){setMsg(e,true)});
}
function drawGm(){
  var rows=cache.games.map(function(g,i){
    var editing=gmEdit&&gmEdit.i===i;
    var staff=g.staff.map(function(s){return esc(s.name)+' ('+esc(s.role)+(s.reg?'':', регламент не выполнен')+')'}).join('<br>');
    if(!editing)staff+=(staff?'<br>':'')+'<button class="btn" type="button" data-gmedit="'+i+'" style="'+GM_BTN+';margin-top:6px">Изменить</button>';
    var score=g.tech?'техническая победа':(typeof g.gf==='number'&&typeof g.ga==='number'?g.gf+':'+g.ga:'нет счёта');
    var goals=g.goals.map(function(x){return esc(x.name)+(x.n>1?' ×'+x.n:'')}).join(', ')||'—';
    var tr='<tr><td>'+dShort(g.date)+'</td><td>'+esc(g.team)+'<br>'+esc(g.opp)+'</td><td>'+score+'</td><td class="w">'+goals+'</td><td class="w">'+staff+'</td></tr>';
    return tr+(editing?'<tr><td colspan="5">'+gmForm()+'</td></tr>':'');
  }).join('');
  $('gm-table').innerHTML='<tr><th>Дата</th><th>Команда</th><th>Счёт</th><th>Голы</th><th>Сотрудники</th></tr>'+(rows||'<tr><td colspan="5">Нет игр</td></tr>');
}
$('gm-table').onclick=function(e){
  var t=e.target;
  if(!t||!t.hasAttribute)return;
  if(t.hasAttribute('data-gmedit')){var i=+t.getAttribute('data-gmedit');gmEdit={i:i,list:cache.games[i].staff.map(function(s){return{name:s.name,role:s.role,reg:s.reg}})};drawGm();return}
  if(t.hasAttribute('data-gmcancel')){gmEdit=null;drawGm();return}
  if(t.hasAttribute('data-gmadd')){gmRead();gmEdit.list.push({name:cache.trainers[0]||'',role:'Тренер',reg:true});drawGm();return}
  if(t.hasAttribute('data-gmdel')){gmRead();gmEdit.list.splice(+t.getAttribute('data-gmdel'),1);drawGm();return}
  if(t.hasAttribute('data-gmsave'))gmSave();
};
$('addtr').onclick=function(){
  var n=$('newtr').value.trim(),b=this;
  if(!n){$('trmsg').textContent='Введите имя тренера';return}
  b.disabled=true;$('trmsg').textContent='Добавляю…';
  run('appAddTrainer',[pin,n],function(){
    b.disabled=false;$('newtr').value='';$('trmsg').textContent='Тренер «'+n+'» добавлен. Теперь его можно выбрать в тренировках и играх.';
    loadOptions();
  },function(m){b.disabled=false;$('trmsg').textContent=m});
};
function drawChips(){
  $('chips').innerHTML=cache.trainers.map(function(t){
    return'<button class="chip'+(trFilter===t?' on':'')+'" data-tr="'+esc(t)+'">'+esc(t)+'</button>';
  }).join('');
  document.querySelectorAll('#chips button').forEach(function(b){
    b.onclick=function(){var t=b.getAttribute('data-tr');trFilter=trFilter===t?'':t;drawChips();drawSt()};
  });
}
function drawSt(){
  var box=$('st-table');
  var list=cache.stats.filter(function(s){return !trFilter||s.trainer===trFilter});
  if(!list.length){box.innerHTML='<div class="sub">Нет данных за месяц</div>';return}
  box.innerHTML=list.map(function(s){
    var pct=s.pct===null?'—':s.pct+'%';
    var bar=s.pct===null?0:s.pct;
    var tr=s.tr.map(function(t){return'<li><span>'+esc(t.date)+' · '+esc(t.group||'—')+'</span><b>'+fmtH(t.hours)+' ч</b></li>'}).join('')||'<li><span>Нет тренировок</span></li>';
    var gm=s.gm.map(function(g){
      var score=g.tech?'техническая победа':(typeof g.gf==='number'&&typeof g.ga==='number'?g.gf+':'+g.ga:'нет счёта');
      return'<li><span>'+esc(g.date)+' · '+esc(g.team)+' — '+esc(g.opp)+'<br><small>'+esc(g.role)+(g.reg?'':', регламент не выполнен')+'</small></span><b>'+score+'</b></li>';
    }).join('')||'<li><span>Нет игр</span></li>';
    return'<details><summary><div class="top"><span>'+esc(s.trainer)+'</span><span>'+pct+'</span></div>'
      +'<div class="bar"><i style="width:'+bar+'%"></i></div>'
      +'<div class="sub">Тренировок: '+s.trainings+' ('+fmtH(s.hours)+' ч) · игр как тренер: '+s.asTrainer+' · как оператор: '+s.asOperator+' · участий: '+s.parts+'</div></summary>'
      +'<div class="sub"><b>Тренировки</b></div><ul>'+tr+'</ul>'
      +'<div class="sub"><b>Игры</b></div><ul>'+gm+'</ul></details>';
  }).join('');
}
function showTab(t){
  tab=t;
  document.querySelectorAll('.tabs button').forEach(function(b){b.className=b.getAttribute('data-t')===t?'on':''});
  $('pane-tr').hidden=t!=='tr';$('pane-gm').hidden=t!=='gm';$('pane-st').hidden=t!=='st';$('pane-dy').hidden=t!=='dy';
  if(t==='dy')loadDay();
}
var dayHeld={};
function todayIso(){var d=new Date();return d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2)}
function toDmy(v){var m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(String(v||''));return m?m[3]+'.'+m[2]+'.'+m[1]:String(v||'')}
var dyItems=[],dyTr={},dyDate='',dyAddOpen={};
// Сохраняем выбор тренеров из выпадающих списков перед перерисовкой
function dySync(){
  dyItems.forEach(function(x,i){
    var els=document.querySelectorAll('select[data-s="'+i+'"]');
    if(els.length) dyTr[i]=[].map.call(els,function(el){return el.value});
  });
}
function dyPaint(){
  $('dy-list').innerHTML=dyItems.map(function(x,i){
    var key=dyDate+'|'+x.group+'|'+x.start;
    var mark=x.status==='done'?'<span class="chip on">записана</span>':(dayHeld[key]===false?'<span class="chip">не проводилась</span>':'');
    var trs=dyTr[i]||x.trainers;
    var isDone=x.status==='done';
    var rec=x.recorded||[];
    var sel=(isDone?rec:trs).map(function(tr,j){
      return'<select data-s="'+i+'" data-j="'+j+'" aria-label="Тренер">'+cache.trainers.map(function(t){return'<option'+(t===tr?' selected':'')+'>'+esc(t)+'</option>'}).join('')+'</select>';
    }).join('');
    var can=x.status==='open'&&dayHeld[key]===undefined;
    var tb=can?'<div class="grid2" style="margin-top:6px">'
      +(trs.length<3?'<button class="btn" style="background:var(--card);color:var(--ink);border:1px solid var(--line)" data-add="'+i+'">+ тренер</button>':'')
      +(trs.length>1?'<button class="btn" style="background:var(--card);color:var(--ink);border:1px solid var(--line)" data-rm="'+i+'">− тренер</button>':'')
      +'</div>':'';
    var recLine='';
    var saveBlock=isDone?'<div style="margin-top:6px"><button class="btn" data-save="'+i+'" style="width:auto;min-height:36px;margin-top:0;padding:0 16px;font-size:14px">Сохранить тренеров</button></div>':'';
    var addBlock='';
    if(isDone&&rec.length<3){
      addBlock=dyAddOpen[i]
        ?'<select data-addsel="'+i+'" aria-label="Тренер">'+cache.trainers.filter(function(t){return rec.indexOf(t)<0}).map(function(t){return'<option>'+esc(t)+'</option>'}).join('')+'</select><div class="grid2" style="margin-top:6px"><button class="btn" data-addok="'+i+'">Добавить</button><button class="btn" data-addno="'+i+'" style="background:var(--card);color:var(--ink);border:1px solid var(--line)">Отмена</button></div>'
        :'<div style="margin-top:6px"><button class="btn" data-addopen="'+i+'" style="background:var(--card);color:var(--ink);border:1px solid var(--line)">+ тренер</button></div>';
    }
    var btns=can
      ?'<p class="ask" id="ask'+i+'">Тренировка проводилась?</p><div class="grid2" role="group" aria-labelledby="ask'+i+'"><button class="btn" data-y="'+i+'">Да, проводилась</button><button class="btn" data-n="'+i+'" style="background:var(--card);color:var(--ink);border:1px solid var(--line)">Нет</button></div>'
      :'';
    return'<div class="card"><div class="top"><span>'+esc(x.start)+'–'+esc(x.end)+' · '+esc(x.group)+'</span>'+mark+'</div>'
      +'<div class="sub">'+esc(x.loc)+' · '+esc(x.type)+'</div>'+sel+recLine+tb+btns+saveBlock+addBlock+'</div>';
  }).join('');
  dyItems.forEach(function(x,i){
    var key=dyDate+'|'+x.group+'|'+x.start;
    var y=document.querySelector('[data-y="'+i+'"]'),n=document.querySelector('[data-n="'+i+'"]');
    var add=document.querySelector('[data-add="'+i+'"]'),rm=document.querySelector('[data-rm="'+i+'"]');
    if(add)add.onclick=function(){
      dySync();
      var cur=dyTr[i]||x.trainers.slice();
      var pick=cache.trainers.filter(function(t){return cur.indexOf(t)<0})[0]||cache.trainers[0]||'';
      dyTr[i]=cur.concat([pick]);
      dyPaint();
    };
    if(rm)rm.onclick=function(){
      dySync();
      dyTr[i]=(dyTr[i]||x.trainers).slice(0,-1);
      dyPaint();
    };
    if(y)y.onclick=function(){
      var trs=[].map.call(document.querySelectorAll('select[data-s="'+i+'"]'),function(el){return el.value});
      setMsg('Сохраняю…');ksBusy(y,true);if(n)n.disabled=true;
      run('appConfirmDaily',[pin,{date:dyDate,loc:x.loc,group:x.group,type:x.type,start:x.start,end:x.end,trainers:trs}],
        function(){dayHeld[key]=true;setMsg('Записано');loadDay()},function(e){ksBusy(y,false);if(n)n.disabled=false;setMsg(e,true)});
    };
    if(n)n.onclick=function(){dayHeld[key]=false;loadDay()};
    var sv=document.querySelector('[data-save="'+i+'"]');
    if(sv)sv.onclick=function(){
      var trs2=[].map.call(document.querySelectorAll('select[data-s="'+i+'"]'),function(el){return el.value});
      setMsg('Сохраняю…');ksBusy(sv,true);
      run('appTrainingReplaceTrainers',[pin,{date:dyDate,group:x.group,start:x.start,trainers:trs2}],
        function(){setMsg('Сохранено');loadDay()},function(e){ksBusy(sv,false);setMsg(e,true)});
    };
    var ao=document.querySelector('[data-addopen="'+i+'"]'),an=document.querySelector('[data-addno="'+i+'"]'),aok=document.querySelector('[data-addok="'+i+'"]');
    if(ao)ao.onclick=function(){dyAddOpen[i]=true;dyPaint()};
    if(an)an.onclick=function(){dyAddOpen[i]=false;dyPaint()};
    if(aok)aok.onclick=function(){
      var s=document.querySelector('select[data-addsel="'+i+'"]');
      setMsg('Сохраняю…');ksBusy(aok,true);
      run('appAddTrainerDaily',[pin,{date:dyDate,loc:x.loc,group:x.group,type:x.type,start:x.start,end:x.end,trainer:s?s.value:''}],
        function(){dyAddOpen[i]=false;setMsg('Записано');loadDay()},function(e){ksBusy(aok,false);setMsg(e,true)});
    };
  });
}
function loadDay(){
  if(!$('dy-date').value)$('dy-date').value=todayIso();
  var iso=$('dy-date').value,date=toDmy(iso);
  $('dy-list').innerHTML='<div class="sub">Загружаю…</div>';
  run('appDailySchedule',[pin,date],function(items){
    if(!items.length){$('dy-list').innerHTML='<div class="sub">На этот день тренировок по расписанию нет</div>';return}
    dyItems=items;dyDate=date;dyTr={};dyAddOpen={};
    items.forEach(function(x,i){dyTr[i]=x.trainers.slice()});
    dyPaint();
    setMsg('');
  },function(e){setMsg(e,true)});
}
$('dy-date').onchange=loadDay;
// Дополнительные тренеры формы: до трёх в сумме, каждый — отдельной строкой тренировки
function trExtraAdd(){
  var n=document.querySelectorAll('.a-tr-x').length;
  if(n>=2)return;
  var s=document.createElement('select');s.className='a-tr-x';s.setAttribute('aria-label','Тренер');
  s.innerHTML=$('a-trainer').innerHTML;s.value='';s.style.cssText='display:block;width:100%;margin-bottom:8px';
  $('a-tr-extra').appendChild(s);
}
function trExtraRm(){
  var all=document.querySelectorAll('.a-tr-x');
  if(all.length)all[all.length-1].remove();
}
$('a-tr-add').onclick=trExtraAdd;
$('a-tr-rm').onclick=trExtraRm;
function addTraining(){
  var base={date:toDmy($('a-date').value.trim()),group:$('a-group').value.trim(),
    location:$('a-loc').value.trim(),type:$('a-type').value.trim(),start:$('a-start').value.trim(),end:$('a-end').value.trim(),held:$('a-held').checked};
  var trs=[$('a-trainer').value.trim()].concat(Array.prototype.map.call(document.querySelectorAll('.a-tr-x'),function(s){return s.value.trim()}));
  trs=trs.filter(function(t,i){return t&&trs.indexOf(t)===i});
  if(!trs.length){setMsg('Укажите тренера',true);return}
  // Кнопка заблокирована, пока не записаны все тренеры (по одному вызову на тренера)
  var btn=$('a-save');if(btn.disabled)return;
  setMsg('Сохраняю…');ksBusy(btn,true,'Сохраняю…');
  var k=0,done=[];
  (function next(){
    if(k>=trs.length){
      ksBusy(btn,false);
      setMsg('Тренировка добавлена');$('a-trainer').value='';$('a-group').value='';
      Array.prototype.forEach.call(document.querySelectorAll('.a-tr-x'),function(s){s.remove()});
      load();return;
    }
    var t=trs[k],o=Object.assign({},base,{trainer:t});k++;
    run('appTrainingAdd',[pin,o],function(){done.push(t);next()},function(e){
      ksBusy(btn,false);
      // Частичная запись: говорим, кто уже записан, а кто нет
      setMsg((done.length?'Записано: '+done.join(', ')+'. ':'')+'Не записано: '+trs.slice(k-1).join(', ')+'. '+friendly_(e),true);
      // Уже записанных тренеров убираем из формы, чтобы повторное нажатие их не задвоило
      if(done.indexOf($('a-trainer').value.trim())>=0)$('a-trainer').value='';
      Array.prototype.forEach.call(document.querySelectorAll('.a-tr-x'),function(s){if(done.indexOf(s.value.trim())>=0)s.remove()});
      // Обновляем только таблицу: полная загрузка стёрла бы сообщение о частичной записи
      if(done.length)run('appTrainingsList',[pin,$('mon').value],function(t){cache.trainings=t;drawTr()},function(){});
    });
  })();
}
document.querySelectorAll('.tabs button').forEach(function(b){b.onclick=function(){showTab(b.getAttribute('data-t'))}});
function monSync(){var s=$('mon'),o=s.options[s.selectedIndex];$('mlab').textContent=o?o.text:'';$('mprev').disabled=s.selectedIndex<=0;$('mnext').disabled=s.selectedIndex<0||s.selectedIndex>=s.options.length-1}
function monStep(d){var s=$('mon'),i=s.selectedIndex+d;if(i<0||i>=s.options.length)return;s.selectedIndex=i;monSync();load()}
$('mon').onchange=function(){monSync();load()};
$('mprev').onclick=function(){monStep(-1)};$('mnext').onclick=function(){monStep(1)};
$('a-save').onclick=addTraining;
$('go').onclick=function(){pin=$('pin').value.trim();if(!pin)return;try{localStorage.setItem('kspin',pin)}catch(e){}init()};
try{pin=localStorage.getItem('kspin')||''}catch(e){}
if(pin)init();else showLogin('');
</script>
</body>
</html>
