<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="../../../../web/src/ui/tokens.css">
<style>body{margin:0;background:var(--ks-bg);color:var(--ks-text);font-family:system-ui,sans-serif}.page{padding:16px}
.old i{border-radius:50%;width:5px;height:5px}
.grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.cell{min-width:0;min-height:48px;padding:5px 2px;border-radius:10px;border:1px solid var(--ks-border);background:var(--ks-surface);color:var(--ks-text);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font:inherit}
.cell.sel{border:2px solid var(--ks-primary);background:var(--ks-primary-subtle)}
.mk{display:flex;gap:4px;height:8px}.mk i{display:block;flex-shrink:0;width:8px;height:8px}
.m{background:var(--ks-primary);border-radius:1px;transform:rotate(45deg)}.t{background:var(--ks-success);border-radius:50%}
.o{display:flex;gap:3px;height:5px}.o i{display:block;width:5px;height:5px;border-radius:50%}
.om{background:#2d6cdf}.ot{background:#23845a}
h3{margin:12px 0 6px;font-size:14px}.leg{display:flex;gap:12px;font-size:12px;color:var(--ks-text-muted);margin:8px 0}.leg span{display:inline-flex;align-items:center;gap:6px}
</style></head><body><div class="page" id="p"></div>
<script>
const q=new URLSearchParams(location.search),theme=q.get('theme')||'light';document.documentElement.dataset.theme=theme;
const set=[[],['m'],['t'],['m','t'],['m'],['t'],['m','t']];
const cells=(old,selIdx)=>set.map((s,i)=>`<div class="cell${i===selIdx?' sel':''}"><span>${10+i}</span><span class="${old?'o':'mk'}">${s.map(x=>old?`<i class="o${x}"></i>`:`<i class="${x}"></i>`).join('')}</span></div>`).join('');
document.getElementById('p').innerHTML=`<h3>Было (5 px)</h3><div class="grid">${cells(true,3)}</div><h3>Стало (8 px, ромб и круг)</h3><div class="grid">${cells(false,3)}</div><div class="leg"><span><span class="mk"><i class="m"></i></span>Матчи</span><span><span class="mk"><i class="t"></i></span>Тренировки</span></div>`;
</script></body></html>
