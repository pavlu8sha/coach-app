<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="920" viewBox="0 0 1320 920">
<defs><style>
.h{font:bold 22px Arial}.h2{font:bold 15px Arial}.b{font:13px Arial}.s{font:11px Arial}.xs{font:9px Arial}.muted{fill:#728096;font-family:Arial}.ink{fill:#1b293b;font-family:Arial}.blue{fill:#2458d3;font-family:Arial}.line{stroke:#e4e9f0}.white{fill:#fff}.light{fill:#f4f6fa}
</style></defs>
<rect width="1320" height="920" fill="#eef1f5"/>
<text x="32" y="42" class="muted xs">COACH APP · ISSUE #266 · UX PROPOSAL</text>
<text x="32" y="78" class="ink h">Профиль игрока — адаптивность и состояния</text>
<text x="32" y="104" class="muted s">Проверка узких экранов 320–430 px · светлая/тёмная темы · пустое состояние · ошибка · загрузка</text>
<!-- 320 -->
<rect x="32" y="132" width="320" height="740" rx="14" fill="#fff" stroke="#d5dce6"/>
<text x="48" y="160" class="blue s">320 PX · LIGHT · EMPTY</text>
<text x="48" y="198" class="ink h2">Профиль игрока</text><text x="48" y="220" class="muted s">Игрок · Группа</text>
<rect x="48" y="238" width="288" height="100" rx="10" fill="#142b49"/>
<circle cx="86" cy="288" r="27" fill="#e1e9f5"/><text x="86" y="293" text-anchor="middle" class="blue b">АБ</text>
<text x="124" y="276" fill="#fff" font-family="Arial" font-size="14" font-weight="700">Игрок</text><text x="124" y="296" fill="#fff" font-family="Arial" font-size="14" font-weight="700"></text><text x="124" y="317" fill="#dce6f4" font-family="Arial" font-size="10">Группа · № —</text>
<rect x="48" y="352" width="288" height="60" rx="9" fill="#f7f9fc" stroke="#e4e9f0"/>
<text x="62" y="375" class="muted xs">БАЛЛЫ</text><text x="62" y="398" class="ink h2">—</text><text x="320" y="391" text-anchor="end" class="blue s">Журнал ›</text>
<text x="48" y="448" class="ink h2">Прогресс</text>
<rect x="48" y="462" width="288" height="146" rx="9" fill="#fff" stroke="#e4e9f0"/>
<text x="64" y="492" class="ink b">Пока нет опубликованных тестов</text>
<text x="64" y="518" class="muted s">Когда тренер опубликует результаты,</text><text x="64" y="536" class="muted s">здесь появятся личная динамика</text><text x="64" y="554" class="muted s">и сравнение с группой.</text>
<text x="64" y="584" class="blue s">Как работает прогресс ›</text>
<rect x="32" y="812" width="320" height="60" fill="#fff" stroke="#d5dce6"/>
<text x="64" y="838" class="muted xs" text-anchor="middle">РЕБЁНОК</text><text x="128" y="838" class="muted xs" text-anchor="middle">РАСПИС.</text><text x="192" y="838" class="muted xs" text-anchor="middle">МАТЧИ</text><text x="256" y="838" class="muted xs" text-anchor="middle">ОПЛАТА</text><text x="320" y="838" class="muted xs" text-anchor="middle">ПРОФ.</text>
<!-- 390 -->
<rect x="376" y="132" width="390" height="740" rx="14" fill="#fff" stroke="#d5dce6"/>
<text x="392" y="160" class="blue s">390 PX · LIGHT · ERROR</text>
<text x="392" y="198" class="ink h2">Профиль игрока</text><text x="392" y="220" class="muted s">Игрок · Группа</text>
<rect x="392" y="238" width="358" height="100" rx="10" fill="#142b49"/>
<circle cx="432" cy="288" r="27" fill="#e1e9f5"/><text x="432" y="293" text-anchor="middle" class="blue b">АБ</text>
<text x="472" y="276" fill="#fff" font-family="Arial" font-size="14" font-weight="700">Игрок</text><text x="472" y="301" fill="#dce6f4" font-family="Arial" font-size="10">Группа · № — · Позиция —</text>
<rect x="392" y="358" width="358" height="186" rx="10" fill="#fff" stroke="#e4e9f0"/>
<text x="410" y="390" class="ink h2">Не удалось загрузить прогресс</text>
<text x="410" y="418" class="muted s">Проверьте подключение и попробуйте</text><text x="410" y="436" class="muted s">ещё раз. Остальные разделы профиля</text><text x="410" y="454" class="muted s">остаются доступны.</text>
<rect x="410" y="476" width="112" height="38" rx="7" fill="#2458d3"/><text x="466" y="500" text-anchor="middle" fill="#fff" font-family="Arial" font-size="12" font-weight="700">Повторить</text>
<text x="392" y="584" class="ink h2">Разделы</text>
<rect x="392" y="600" width="358" height="42" rx="8" fill="#eef3ff"/><text x="408" y="626" class="blue b">Обзор</text>
<rect x="392" y="650" width="358" height="42" rx="8" fill="#fff" stroke="#e4e9f0"/><text x="408" y="676" class="ink b">Матчи</text>
<rect x="392" y="700" width="358" height="42" rx="8" fill="#fff" stroke="#e4e9f0"/><text x="408" y="726" class="ink b">Тренировки</text>
<rect x="392" y="750" width="358" height="42" rx="8" fill="#fff" stroke="#e4e9f0"/><text x="408" y="776" class="ink b">Прогресс</text>
<!-- 430 dark -->
<rect x="790" y="132" width="430" height="740" rx="14" fill="#111d30" stroke="#2c3d56"/>
<text x="806" y="160" fill="#9eb4d1" class="s">430 PX · DARK · LOADING</text>
<text x="806" y="198" fill="#f2f5fa" class="h2">Профиль игрока</text><text x="806" y="220" fill="#a9b7ca" class="s">Игрок · Группа</text>
<rect x="806" y="238" width="398" height="100" rx="10" fill="#1a3558"/>
<circle cx="848" cy="288" r="27" fill="#dbe5f2"/><text x="848" y="293" text-anchor="middle" class="blue b">АБ</text>
<text x="890" y="276" fill="#fff" font-family="Arial" font-size="14" font-weight="700">Игрок</text><text x="890" y="301" fill="#c5d3e5" font-family="Arial" font-size="10">Группа · № — · Позиция —</text>
<rect x="806" y="358" width="398" height="92" rx="10" fill="#1a293e"/>
<rect x="824" y="378" width="160" height="12" rx="6" fill="#34475f"/><rect x="824" y="402" width="290" height="10" rx="5" fill="#293d56"/><rect x="824" y="422" width="240" height="10" rx="5" fill="#293d56"/>
<rect x="806" y="466" width="398" height="160" rx="10" fill="#1a293e"/>
<rect x="824" y="486" width="132" height="12" rx="6" fill="#34475f"/><rect x="824" y="516" width="360" height="10" rx="5" fill="#293d56"/><rect x="824" y="538" width="328" height="10" rx="5" fill="#293d56"/><rect x="824" y="560" width="344" height="10" rx="5" fill="#293d56"/><rect x="824" y="590" width="120" height="10" rx="5" fill="#293d56"/>
<text x="806" y="674" fill="#c0cde0" class="s">Загрузка не должна менять ширину контента</text>
<text x="806" y="696" fill="#c0cde0" class="s">или сдвигать нижнюю навигацию.</text>
<rect x="790" y="812" width="430" height="60" fill="#18283d" stroke="#2c3d56"/>
<text x="834" y="838" fill="#a9b7ca" class="xs" text-anchor="middle">РЕБЁНОК</text><text x="920" y="838" fill="#a9b7ca" class="xs" text-anchor="middle">РАСПИСАНИЕ</text><text x="1006" y="838" fill="#a9b7ca" class="xs" text-anchor="middle">МАТЧИ</text><text x="1092" y="838" fill="#a9b7ca" class="xs" text-anchor="middle">ОПЛАТА</text><text x="1178" y="838" fill="#a9b7ca" class="xs" text-anchor="middle">ПРОФИЛЬ</text>
<text x="32" y="902" class="muted xs">ПРИМЕЧАНИЕ: это проверка структуры/состояний, не готовый интерактивный компонент. Реальные значения и токены сверяются с UI-kit до разработки.</text>
</svg>