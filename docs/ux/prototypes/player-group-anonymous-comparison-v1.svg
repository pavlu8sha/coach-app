<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="820" viewBox="0 0 1000 820">
<defs><style>.bg{fill:#f4f6fa}.panel{fill:#fff;stroke:#dce2eb;stroke-width:1.3}.ink{fill:#182334;font-family:Inter,Arial,sans-serif}.muted{fill:#6c7889;font-family:Inter,Arial,sans-serif}.h1{font-size:25px;font-weight:700}.h2{font-size:18px;font-weight:700}.body{font-size:14px}.small{font-size:12px}.label{font-size:11px;font-weight:700;letter-spacing:.5px}.line{stroke:#e6eaf0;stroke-width:1}.blue{fill:#2458d3}.bt{fill:#2458d3;font-family:Arial,sans-serif}.green{fill:#e7f5ed}.gt{fill:#23744b;font-family:Arial,sans-serif}.amber{fill:#fff4df}.at{fill:#95600c;font-family:Arial,sans-serif}</style></defs>
<rect width="1000" height="820" class="bg"/><text x="40" y="42" class="muted label">COACH APP · UX PROPOSAL · ISSUE #266</text><text x="40" y="82" class="ink h1">Анонимное сравнение в группе</text><text x="40" y="108" class="muted body">Только объективный тест · выбранная сессия · без раскрытия других игроков</text>
