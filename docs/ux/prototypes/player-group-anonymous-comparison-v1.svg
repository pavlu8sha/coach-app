<text x="96" y="625" class="at body" font-weight="700">Приватность других игроков сохранена</text>
<text x="96" y="652" class="ink small">Вы не увидите имена, фотографии, профили или индивидуальные результаты других детей.</text>
<text x="96" y="676" class="ink small">Сравнение доступно только для сопоставимого объективного теста в этой сессии.</text>
<text x="72" y="742" class="muted small">Демонстрационные значения. При одном валидном результате место, лучший и средний совпадают с ним.</text>
