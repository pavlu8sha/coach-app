<text x="72" y="184" class="ink h2">Спринт 20 метров</text><text x="72" y="208" class="muted small">Физическая подготовка · U13-A · 12 ноября 2026</text>
<rect x="72" y="240" width="856" height="116" rx="10" fill="#edf2ff"/>
<text x="100" y="273" class="muted label">ВАШ РЕЗУЛЬТАТ</text><text x="100" y="326" class="ink" font-family="Arial" font-size="38" font-weight="700">3,42 сек</text><rect x="722" y="267" width="170" height="48" rx="9" class="green"/><text x="807" y="297" text-anchor="middle" class="gt body" font-weight="700">2 место в группе</text>
<text x="72" y="402" class="ink h2">Сравнение с группой</text>
<rect x="72" y="424" width="268" height="142" rx="9" fill="#f7f9fc"/><text x="96" y="454" class="muted label">ЛУЧШИЙ РЕЗУЛЬТАТ</text><text x="96" y="505" class="ink" font-family="Arial" font-size="30" font-weight="700">3,38 сек</text><text x="96" y="538" class="muted small">Без имени игрока</text>
<rect x="364" y="424" width="268" height="142" rx="9" fill="#f7f9fc"/><text x="388" y="454" class="muted label">СРЕДНИЙ РЕЗУЛЬТАТ</text><text x="388" y="505" class="ink" font-family="Arial" font-size="30" font-weight="700">3,56 сек</text><text x="388" y="538" class="muted small">По валидным результатам</text>
<rect x="656" y="424" width="272" height="142" rx="9" fill="#f7f9fc"/><text x="680" y="454" class="muted label">ВАША ПОЗИЦИЯ</text><text x="680" y="505" class="ink" font-family="Arial" font-size="30" font-weight="700">2 из 14</text><text x="680" y="538" class="muted small">Только место, без списка</text>
