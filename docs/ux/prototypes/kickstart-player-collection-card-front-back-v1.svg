<!-- notes -->
<rect x="70" y="880" width="1480" height="230" rx="18" fill="#fff" stroke="#d9e0e9" stroke-width="2"/>
<text x="104" y="926" class="ink h2">Принципы карточки</text>
<text x="104" y="966" class="ink body">• Фото необязательно: вариант без фото выглядит завершённым и фирменным.</text>
<text x="104" y="998" class="ink body">• Никаких уровней редкости, рейтинговых рамок или автоматически созданных наград.</text>
<text x="104" y="1030" class="ink body">• Пустые/неподтверждённые показатели не показываются как нули; в концепте обозначены тире.</text>
<text x="820" y="966" class="ink body">• QR — только место под реальный маршрут после согласования публичного доступа.</text>
<text x="820" y="998" class="ink body">• Публичный экспорт/фото требуют отдельного добровольного согласия.</text>
<text x="820" y="1030" class="ink body">• Имя, год рождения, группа и позиция — поля карточки; их публичность требует проверки согласий.</text>
<text x="104" y="1076" class="muted small">Все имена и значения в макете — placeholders. Статистика и QR не являются рабочими данными.</text>
</svg>