<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1180" viewBox="0 0 1600 1180">
<defs>
 <linearGradient id="navy" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#14294e"/><stop offset="1" stop-color="#07152e"/></linearGradient>
 <linearGradient id="shine" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#d5b66e"/><stop offset="1" stop-color="#8d713d"/></linearGradient>
 <pattern id="pitch" width="300" height="300" patternUnits="userSpaceOnUse"><path d="M0 150H300 M150 0V300" stroke="#fff" stroke-opacity=".06" stroke-width="2" fill="none"/><circle cx="150" cy="150" r="72" stroke="#fff" stroke-opacity=".06" fill="none" stroke-width="2"/></pattern>
 <style>
 .bg{fill:#eef1f6}.ink{fill:#14213a;font-family:Arial,sans-serif}.muted{fill:#748198;font-family:Arial,sans-serif}.white{fill:#fff;font-family:Arial,sans-serif}.gold{fill:#d5b66e;font-family:Arial,sans-serif}
 .h1{font:700 30px Arial}.h2{font:700 20px Arial}.body{font:15px Arial}.small{font:12px Arial}.tiny{font:10px Arial}.caps{font:700 11px Arial;letter-spacing:2px}
 </style>
</defs>
<rect width="1600" height="1180" class="bg"/>
<text x="48" y="55" class="ink h1">A26 · Коллекционная карточка FC Kickstart</text>
<text x="48" y="84" class="muted body">Лицевая сторона · оборот · мобильный экспорт · PROPOSAL / данные-заглушки</text>
