<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1540" viewBox="0 0 1500 1540">
<defs><linearGradient id="navy" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#172f55"/><stop offset="1" stop-color="#09172f"/></linearGradient><linearGradient id="gold"><stop stop-color="#e2c77f"/><stop offset="1" stop-color="#a78645"/></linearGradient><pattern id="pitch" width="120" height="120" patternUnits="userSpaceOnUse"><path d="M0 60H120M60 0V120" stroke="#fff" stroke-opacity=".055" fill="none"/><circle cx="60" cy="60" r="28" stroke="#fff" stroke-opacity=".055" fill="none"/></pattern><style>.bg{fill:#edf1f6}.panel{fill:#fff;stroke:#d9e1eb;stroke-width:2}.ink{fill:#18263a;font-family:Arial,sans-serif}.muted{fill:#758196;font-family:Arial,sans-serif}.white{fill:#fff;font-family:Arial,sans-serif}.goldtxt{fill:#dfc27a;font-family:Arial,sans-serif}.h1{font:700 30px Arial}.h2{font:700 19px Arial}.body{font:15px Arial}.small{font:12px Arial}.tiny{font:10px Arial}.label{font:700 11px Arial;letter-spacing:1px}.line{stroke:#e5eaf0;stroke-width:1.5}.blue{fill:#2458d3}.blueText{fill:#2458d3;font-family:Arial,sans-serif}.amber{fill:#fff4df}.amberText{fill:#8d5d12;font-family:Arial,sans-serif}</style></defs>
<rect width="1500" height="1540" class="bg"/><text x="52" y="52" class="muted label">COACH APP · ISSUE #266 · A27 · UX PROPOSAL</text><text x="52" y="96" class="ink h1">Карточка игрока: путь родителя на мобильном</text><text x="52" y="126" class="muted body">Точка входа в профиле → предпросмотр двух сторон → сохранение / системное «Поделиться»</text>
<g transform="translate(52 175)"><rect width="320" height="770" rx="30" fill="#172235"/><rect x="9" y="9" width="302" height="752" rx="24" fill="#fff"/><text x="28" y="43" class="ink h2">Мой ребёнок</text><circle cx="280" cy="35" r="13" fill="#f0f3f8"/><text x="280" y="39" text-anchor="middle" class="muted small">•••</text><line x1="9" y1="64" x2="311" y2="64" class="line"/><circle cx="55" cy="113" r="29" fill="#e7edf5"/><circle cx="55" cy="105" r="10" fill="#b9c5d5"/><path d="M35 137Q38 116 55 116Q72 116 75 137" fill="#b9c5d5"/><text x="96" y="108" class="ink h2">Имя игрока</text><text x="96" y="132" class="muted small">Группа · U-XX</text><rect x="25" y="164" width="270" height="100" rx="13" fill="#f7f9fc" stroke="#e4e9f0"/><text x="43" y="193" class="muted label">ПРОФИЛЬ ИГРОКА</text><text x="43" y="220" class="ink body">Баллы и краткая сводка</text><text x="43" y="244" class="blueText small">Открыть профиль →</text><text x="25" y="310" class="ink h2">Профиль</text><rect x="25" y="330" width="270" height="82" rx="12" fill="#fff" stroke="#e0e6ee"/><rect x="41" y="347" width="44" height="48" rx="7" fill="url(#navy)"/><path d="M47 382Q52 365 63 365Q74 365 79 382" fill="#30496e"/><circle cx="63" cy="360" r="8" fill="#30496e"/><text x="99" y="362" class="ink body" font-weight="700">Карточка игрока</text><text x="99" y="385" class="muted small">Сохранить фирменную карточку</text><text x="273" y="375" text-anchor="end" class="blueText body">›</text><text x="25" y="453" class="muted small">Другие разделы профиля остаются ниже</text><rect x="9" y="690" width="302" height="71" fill="#fff"/><line x1="9" y1="690" x2="311" y2="690" class="line"/><g class="muted tiny" text-anchor="middle"><text x="42" y="720">Ребёнок</text><text x="102" y="720">Расписание</text><text x="164" y="720">Матчи</text><text x="223" y="720">Оплата</text><text x="280" y="720">Профиль</text></g><text x="160" y="810" text-anchor="middle" class="ink h2">01 · Точка входа</text><text x="160" y="836" text-anchor="middle" class="muted small">Переход из существующего профиля</text><text x="160" y="855" text-anchor="middle" class="muted small">не меняет нижнюю навигацию</text></g>
<g transform="translate(410 175)"><rect width="320" height="770" rx="30" fill="#172235"/><rect x="9" y="9" width="302" height="752" rx="24" fill="#fff"/><text x="28" y="43" class="ink h2">Карточка игрока</text><text x="286" y="43" text-anchor="end" class="blueText small">Назад</text><line x1="9" y1="64" x2="311" y2="64" class="line"/><text x="28" y="95" class="muted small">Предпросмотр · лицевая сторона</text><rect x="51" y="117" width="218" height="390" rx="17" fill="url(#navy)"/><rect x="51" y="117" width="218" height="390" rx="17" fill="url(#pitch)"/><rect x="62" y="128" width="196" height="368" rx="12" fill="none" stroke="url(#gold)" stroke-width="1.5"/><text x="76" y="157" class="goldtxt label">FC KICKSTART</text><rect x="75" y="174" width="170" height="195" rx="9" fill="#20395f" stroke="#516987"/><circle cx="160" cy="245" r="40" fill="#344d72"/><path d="M105 353Q113 292 160 292Q207 292 215 353" fill="#344d72"/><text x="160" y="351" text-anchor="middle" class="white tiny">ФОТО / ФИРМЕННАЯ ГРАФИКА</text><text x="76" y="398" class="goldtxt tiny">ИМЯ И ФАМИЛИЯ</text><text x="76" y="428" class="white" font-size="22" font-weight="700">Имя игрока</text><text x="76" y="456" class="white small">Позиция · Группа</text><text x="76" y="480" class="white tiny">Год рождения · №</text><rect x="28" y="529" width="264" height="38" rx="9" fill="#f0f3f8"/><rect x="30" y="531" width="130" height="34" rx="7" fill="#fff"/><text x="95" y="553" text-anchor="middle" class="ink small" font-weight="700">Лицевая</text><text x="225" y="553" text-anchor="middle" class="muted small">Оборот</text><text x="28" y="602" class="ink small">Карточка — отдельное изображение.</text><text x="28" y="622" class="muted small">Тап по карточке в приложении ведёт</text><text x="28" y="642" class="muted small">в полноценный профиль игрока.</text><rect x="28" y="666" width="264" height="44" rx="9" fill="#2458d3"/><text x="160" y="694" text-anchor="middle" class="white body" font-weight="700">Сохранить карточку</text><text x="160" y="810" text-anchor="middle" class="ink h2">02 · Предпросмотр</text><text x="160" y="836" text-anchor="middle" class="muted small">Лицевая сторона, без изменения</text><text x="160" y="855" text-anchor="middle" class="muted small">данных профиля</text></g>
<g transform="translate(768 175)"><rect width="320" height="770" rx="30" fill="#172235"/><rect x="9" y="9" width="302" height="752" rx="24" fill="#fff"/><text x="28" y="43" class="ink h2">Карточка игрока</text><text x="286" y="43" text-anchor="end" class="blueText small">Назад</text><line x1="9" y1="64" x2="311" y2="64" class="line"/><text x="28" y="95" class="muted small">Предпросмотр · оборотная сторона</text><rect x="51" y="117" width="218" height="390" rx="17" fill="url(#navy)"/><rect x="51" y="117" width="218" height="390" rx="17" fill="url(#pitch)"/><rect x="62" y="128" width="196" height="368" rx="12" fill="none" stroke="url(#gold)" stroke-width="1.5"/><text x="76" y="157" class="goldtxt label">FC KICKSTART</text><text x="76" y="194" class="white h2">Сезон игрока</text><rect x="76" y="210" width="168" height="105" rx="8" fill="#1d355b" stroke="#536987"/><text x="89" y="235" class="goldtxt tiny">ПОДТВЕРЖДЁННЫЕ ДАННЫЕ</text><text x="89" y="263" class="white small">Матчи</text><text x="230" y="263" text-anchor="end" class="white body">—</text><line x1="89" y1="275" x2="230" y2="275" stroke="#5c6e89"/><text x="89" y="299" class="white small">Голы</text><text x="230" y="299" text-anchor="end" class="white body">—</text><rect x="76" y="331" width="76" height="76" rx="7" fill="#20395f" stroke="#d5b66e" stroke-dasharray="4 3"/><text x="114" y="371" text-anchor="middle" class="goldtxt small">QR*</text><text x="166" y="352" class="white small">Профиль</text><text x="166" y="372" class="muted tiny">только после</text><text x="166" y="388" class="muted tiny">согласования</text><text x="76" y="461" class="goldtxt tiny">SEASON CARD</text><rect x="28" y="529" width="264" height="38" rx="9" fill="#f0f3f8"/><text x="95" y="553" text-anchor="middle" class="muted small">Лицевая</text><rect x="162" y="531" width="128" height="34" rx="7" fill="#fff"/><text x="226" y="553" text-anchor="middle" class="ink small" font-weight="700">Оборот</text><text x="28" y="602" class="ink small">Пустые показатели не превращаются</text><text x="28" y="622" class="muted small">в нули. QR не создаётся до решения</text><text x="28" y="642" class="muted small">о маршруте и публичном доступе.</text><rect x="28" y="666" width="264" height="44" rx="9" fill="#2458d3"/><text x="160" y="694" text-anchor="middle" class="white body" font-weight="700">Сохранить карточку</text><text x="160" y="810" text-anchor="middle" class="ink h2">03 · Оборот</text><text x="160" y="836" text-anchor="middle" class="muted small">Только существующие подтверждённые</text><text x="160" y="855" text-anchor="middle" class="muted small">данные, без фиктивных значений</text></g>
<g transform="translate(1126 175)"><rect width="320" height="770" rx="30" fill="#172235"/><rect x="9" y="9" width="302" height="752" rx="24" fill="#fff"/><text x="28" y="43" class="ink h2">Сохранение</text><text x="286" y="43" text-anchor="end" class="blueText small">Назад</text><line x1="9" y1="64" x2="311" y2="64" class="line"/><text x="28" y="96" class="ink h2">Готово к сохранению</text><rect x="28" y="119" width="264" height="150" rx="12" fill="#f4f6fa" stroke="#e2e7ef"/><rect x="117" y="131" width="86" height="124" rx="7" fill="url(#navy)"/><rect x="122" y="136" width="76" height="114" rx="5" fill="none" stroke="#d5b66e"/><circle cx="160" cy="178" r="18" fill="#314a70"/><path d="M140 218Q145 194 160 194Q175 194 180 218" fill="#314a70"/><text x="160" y="237" text-anchor="middle" class="white tiny">ИМЯ</text><rect x="28" y="292" width="264" height="46" rx="9" fill="#2458d3"/><text x="160" y="321" text-anchor="middle" class="white body" font-weight="700">Сохранить изображение</text><rect x="28" y="350" width="264" height="46" rx="9" fill="#eef2f8"/><text x="160" y="379" text-anchor="middle" class="ink body" font-weight="700">Поделиться…</text><text x="28" y="436" class="ink small" font-weight="700">Публичный доступ к фото</text><rect x="28" y="451" width="264" height="124" rx="10" class="amber"/><text x="44" y="477" class="amberText small" font-weight="700">Согласие не предоставлено</text><text x="44" y="501" class="ink small">Публичная публикация не предлагается.</text><text x="44" y="522" class="ink small">Сохранение личной копии — отдельно</text><text x="44" y="543" class="ink small">от публикации клубом в интернете.</text><text x="28" y="615" class="muted tiny">Системное меню открывается только после</text><text x="28" y="632" class="muted tiny">действия пользователя. Приложение не</text><text x="28" y="649" class="muted tiny">отправляет изображение автоматически.</text><text x="160" y="810" text-anchor="middle" class="ink h2">04 · Сохранить / поделиться</text><text x="160" y="836" text-anchor="middle" class="muted small">Без скрытой публикации и отправки</text><text x="160" y="855" text-anchor="middle" class="muted small">от имени клуба</text></g>
<rect x="52" y="1000" width="1394" height="470" rx="18" class="panel"/><text x="84" y="1048" class="ink h2">Общие правила потока</text>
<g class="ink body"><text x="84" y="1092">1. Карточка открывается из профиля конкретного ребёнка; если детей несколько, контекст игрока сохраняется.</text><text x="84" y="1130">2. Предпросмотр доступен с фото и без фото. Отсутствие фото не блокирует карточку или экспорт.</text><text x="84" y="1168">3. Переключение «Лицевая / Оборот» меняет только сторону предпросмотра; данные профиля не редактируются.</text><text x="84" y="1206">4. «Сохранить» формирует отдельное изображение. «Поделиться» вызывает системный share sheet, если он поддерживается.</text><text x="84" y="1244">5. Отсутствующие или неподтверждённые показатели не показываются как 0. Не добавлять assists, рейтинги и вымышленные награды.</text><text x="84" y="1282">6. QR остаётся выключенным/заглушкой, пока не утверждены маршрут, доступность профиля и набор публичных полей.</text><text x="84" y="1320">7. Публичное использование фото и материалов клуба требует отдельного согласия. Личная копия и публикация клубом — разные действия.</text><text x="84" y="1358">8. После сохранения пользователь возвращается в карточку/профиль без сброса текущей вкладки и контекста ребёнка.</text></g>
<text x="84" y="1412" class="muted small">Адаптивность: 320 / 360 / 390 / 430 px · light/dark · safe areas · без горизонтального переполнения.</text><text x="84" y="1440" class="muted small">Все имена, изображения, статистика и QR в этом wireframe — демонстрационные заглушки. Это не финальный UI и не спецификация реализации.</text></svg>