<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1200" viewBox="0 0 900 1200"><rect width="900" height="1200" fill="#eef1f5"/><text x="48" y="58" font-family="Arial,sans-serif" font-size="25" fill="#14233b" font-weight="700">A11 — Несопоставимые результаты</text><text x="48" y="88" font-family="Arial,sans-serif" font-size="15" fill="#66758a" font-weight="400">Состояние: динамика не строится, если тесты/методики/условия различаются</text><rect x="48" y="112" width="804" height="1028" rx="26" fill="#fff" stroke="#d9e0e9"/><rect x="300" y="145" width="300" height="970" rx="28" fill="#f7f9fc" stroke="#cbd5e1" stroke-width="2"/><text x="326" y="190" font-family="Arial,sans-serif" font-size="19" fill="#17263d" font-weight="700">‹  Результат теста</text><text x="326" y="222" font-family="Arial,sans-serif" font-size="12" fill="#718096" font-weight="400">Спринт 10 м · 12 ноября</text><rect x="326" y="245" width="248" height="140" rx="16" fill="#17345b" stroke="none"/><text x="342" y="280" font-family="Arial,sans-serif" font-size="11" fill="#c6d3e4" font-weight="700">ТВОЙ РЕЗУЛЬТАТ</text><text x="342" y="340" font-family="Arial,sans-serif" font-size="32" fill="#fff" font-weight="700">2,14 сек</text><text x="342" y="370" font-family="Arial,sans-serif" font-size="11" fill="#c6d3e4" font-weight="400">Опубликовано</text><text x="326" y="440" font-family="Arial,sans-serif" font-size="16" fill="#17263d" font-weight="700">Личная динамика</text><rect x="326" y="458" width="248" height="110" rx="12" fill="#fff" stroke="#e1e7ef"/><text x="342" y="495" font-family="Arial,sans-serif" font-size="12" fill="#44546a" font-weight="700">Нет сопоставимой пары</text><text x="342" y="524" font-family="Arial,sans-serif" font-size="10" fill="#718096" font-weight="400">Методика или условия отличаются.</text><text x="342" y="546" font-family="Arial,sans-serif" font-size="10" fill="#718096" font-weight="400">Сравнение не рассчитывается.</text><text x="326" y="605" font-family="Arial,sans-serif" font-size="16" fill="#17263d" font-weight="700">Групповое сравнение</text><rect x="326" y="623" width="248" height="155" rx="12" fill="#fff" stroke="#e1e7ef"/><text x="342" y="660" font-family="Arial,sans-serif" font-size="11" fill="#44546a" font-weight="400">Для выбранной сессии</text><text x="342" y="683" font-family="Arial,sans-serif" font-size="11" fill="#44546a" font-weight="400">сравнение доступно только</text><text x="342" y="706" font-family="Arial,sans-serif" font-size="11" fill="#44546a" font-weight="400">по сопоставимым результатам.</text><text x="342" y="747" font-family="Arial,sans-serif" font-size="9" fill="#718096" font-weight="400">Несопоставимые тесты не смешиваются</text><text x="326" y="835" font-family="Arial,sans-serif" font-size="16" fill="#17263d" font-weight="700">История</text><rect x="326" y="853" width="248" height="90" rx="12" fill="#fff" stroke="#e1e7ef"/><text x="342" y="890" font-family="Arial,sans-serif" font-size="12" fill="#17263d" font-weight="700">Все результаты сохранены</text><text x="342" y="918" font-family="Arial,sans-serif" font-size="10" fill="#718096" font-weight="400">в хронологическом порядке</text><text x="48" y="1178" font-family="Arial,sans-serif" font-size="13" fill="#718096" font-weight="400">COACH APP • UX PROPOSAL • NOT APPROVED FOR DEVELOPMENT</text></svg>