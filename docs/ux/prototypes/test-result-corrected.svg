rif" font-size="11" fill="#44546a">учитывают актуальный результат.</text><text x="342" y="710" font-family="Arial,sans-serif" font-size="10" fill="#718096">Чужие результаты не раскрываются.</text><text x="326" y="820" font-family="Arial,sans-serif" font-size="15" fill="#17263d" font-weight="700">История тестирований</text><rect x="326" y="838" width="248" height="100" rx="12" fill="#fff" stroke="#e1e7ef"/><text x="342" y="875" font-family="Arial,sans-serif" font-size="12" fill="#17263d" font-weight="700">12 ноября · 2,14 сек</text><text x="342" y="903" font-family="Arial,sans-serif" font-size="10" fill="#718096">Актуальный опубликованный результат</text><text x="326" y="1000" font-family="Arial,sans-serif" font-size="10" fill="#718096">Техническая история исправления доступна</text><text x="326" y="1018" font-family="Arial,sans-serif" font-size="10" fill="#718096">уполномоченным сотрудникам.</text><text x="48" y="1178" font-family="Arial,sans-serif" font-size="13" fill="#718096">COACH APP • UX PROPOSAL • NOT APPROVED FOR DEVELOPMENT</text></svg>