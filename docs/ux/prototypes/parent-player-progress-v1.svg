<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1180" viewBox="0 0 1800 1180">
<defs>
 <linearGradient id="navy" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#102b49"/><stop offset="1" stop-color="#07182d"/></linearGradient>
 <linearGradient id="lime" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#b8ed70"/><stop offset="1" stop-color="#8dd85b"/></linearGradient>
 <filter id="shadow" x="-30%" y="-20%" width="160%" height="160%"><feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#12243a" flood-opacity=".18"/></filter>
 <style>
 .h{font-family:Inter,Arial,sans-serif;font-weight:700}.m{font-family:Inter,Arial,sans-serif;font-weight:500}.d{fill:#142b45}.muted{fill:#8190a3}.w{fill:#f8fafc}.g{fill:#b8ed70}.sm{font-size:12px}
 </style>
</defs>
<rect width="1800" height="1180" fill="#edf1f5"/>
