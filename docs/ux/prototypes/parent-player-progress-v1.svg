 <rect x="28" y="145" width="384" height="166" rx="17" fill="#fff"/>
 <rect x="48" y="164" width="98" height="25" rx="12" fill="#edf6e4"/><text x="97" y="181" text-anchor="middle" class="h" fill="#4e7f31" font-size="10">В работе</text>
 <text x="48" y="220" class="h d" font-size="16">Первое касание под давлением</text>
 <text x="48" y="249" class="m muted" font-size="12">Техника · контроль мяча</text>
 <text x="48" y="278" class="m d" font-size="12">Тренер рекомендует отрабатывать</text><text x="48" y="297" class="m d" font-size="12">приём мяча в ограниченном пространстве.</text>
 <rect x="28" y="328" width="384" height="150" rx="17" fill="#fff"/>
 <rect x="48" y="347" width="120" height="25" rx="12" fill="#eef1f5"/><text x="108" y="364" text-anchor="middle" class="h muted" font-size="10">Запланирована</text>
