 <g class="m muted" font-size="10" text-anchor="middle"><text x="65" y="710">Май</text><text x="170" y="710">Июн</text><text x="275" y="710">Авг</text><text x="374" y="710">Окт</text></g>
 <text x="48" y="596" class="m muted" font-size="10">Время, секунды · меньше — лучше</text>
 <rect x="28" y="748" width="384" height="58" rx="13" fill="#fff4df" stroke="#ecd7a9"/>
 <text x="48" y="773" class="h d" font-size="12">Сравнение анонимное</text><text x="48" y="792" class="m d" font-size="10">Имена и результаты других игроков не показываются.</text>
 <rect x="12" y="828" width="416" height="60" fill="#fff"/><path d="M12 828H428" stroke="#e3e8ee"/>
 <g class="m" font-size="10" fill="#738196" text-anchor="middle"><text x="57" y="861">Ребёнок</text><text x="139" y="861">Расписание</text><text x="220" y="861">Матчи</text><text x="301" y="861">Оплата</text><text x="382" y="861">Профиль</text></g><circle cx="57" cy="846" r="4" fill="#76b83f"/>
</g>
