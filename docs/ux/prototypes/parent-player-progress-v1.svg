 <rect x="28" y="145" width="384" height="110" rx="17" fill="url(#navy)"/>
 <text x="50" y="179" class="m" fill="#c4d1df" font-size="12">Последнее тестирование</text>
 <text x="50" y="211" class="h w" font-size="20">18 октября 2026</text>
 <rect x="287" y="174" width="102" height="34" rx="17" fill="#254765"/><text x="338" y="196" text-anchor="middle" class="h g" font-size="11">3 теста</text>
