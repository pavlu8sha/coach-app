 <circle cx="57" cy="578" r="6" fill="#79b94b"/><text x="76" y="582" class="h d" font-size="13">Комментарий тренера</text>
 <text x="48" y="609" class="m d" font-size="11">«Стало лучше получаться принимать мяч</text><text x="48" y="627" class="m d" font-size="11">в движении. Продолжаем работать».</text>
 <text x="48" y="641" class="m muted" font-size="9">28 октября 2026</text>
 <rect x="28" y="667" width="384" height="105" rx="15" fill="#fff"/>
 <circle cx="57" cy="699" r="6" fill="#a7b2c0"/><text x="76" y="703" class="h d" font-size="13">Цель выполнена</text>
 <text x="48" y="730" class="m d" font-size="11">Уверенно выполнять передачи внутренней</text><text x="48" y="748" class="m d" font-size="11">стороной стопы.</text>
 <text x="48" y="764" class="m muted" font-size="9">12 сентября 2026</text>
 <text x="36" y="803" class="m muted" font-size="10">Цели и комментарии сохраняются в истории.</text>
 <rect x="12" y="828" width="416" height="60" fill="#fff"/><path d="M12 828H428" stroke="#e3e8ee"/>
