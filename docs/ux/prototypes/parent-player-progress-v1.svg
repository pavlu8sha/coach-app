 <g class="m" font-size="10" fill="#738196" text-anchor="middle"><text x="57" y="861">Ребёнок</text><text x="139" y="861">Расписание</text><text x="220" y="861">Матчи</text><text x="301" y="861">Оплата</text><text x="382" y="861">Профиль</text></g><circle cx="57" cy="846" r="4" fill="#76b83f"/>
</g>
