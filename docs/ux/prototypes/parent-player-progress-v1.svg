 <text x="50" y="180" class="m" fill="#c4d1df" font-size="12">Ваш лучший результат</text><text x="50" y="235" class="h w" font-size="42">3,82 <tspan font-size="17">сек</tspan></text>
 <rect x="278" y="191" width="111" height="37" rx="18" fill="#284c68"/><text x="333" y="215" text-anchor="middle" class="h g" font-size="12">4-е место</text>
