 <text x="36" y="552" class="h d" font-size="17">Личная динамика</text>
 <rect x="28" y="571" width="384" height="160" rx="15" fill="#fff"/>
 <path d="M65 685 L170 652 L275 630 L374 608" fill="none" stroke="#78b84b" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
