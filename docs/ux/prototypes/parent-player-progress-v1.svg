 <rect x="28" y="314" width="384" height="92" rx="15" fill="#fff"/>
 <text x="48" y="344" class="h d" font-size="14">Скорость · 20 м</text><text x="48" y="378" class="h d" font-size="23">3,82 сек</text>
 <text x="388" y="378" text-anchor="end" class="h" fill="#4e8a31" font-size="12">−0,14 сек</text>
 <text x="48" y="396" class="m muted" font-size="10">Предыдущее сопоставимое: 3,96 сек</text>
 <rect x="28" y="418" width="384" height="92" rx="15" fill="#fff"/>
 <text x="48" y="448" class="h d" font-size="14">Ловкость · челночный бег</text><text x="48" y="482" class="h d" font-size="23">11,4 сек</text>
 <text x="388" y="482" text-anchor="end" class="m muted" font-size="11">Нет прошлых данных</text>
 <text x="36" y="550" class="h d" font-size="17">Технические качества</text>
 <rect x="28" y="569" width="384" height="92" rx="15" fill="#fff"/>
 <text x="48" y="599" class="h d" font-size="14">Точность передач</text><text x="48" y="633" class="h d" font-size="23">8 из 10</text>
 <text x="388" y="633" text-anchor="end" class="m muted" font-size="11">Предыдущих данных нет</text>
 <text x="36" y="703" class="h d" font-size="17">Оценка тренера</text>
 <rect x="28" y="722" width="384" height="76" rx="15" fill="#fff"/>
 <text x="48" y="751" class="h d" font-size="13">Игровое мышление</text><rect x="258" y="735" width="132" height="26" rx="13" fill="#edf6e4"/><text x="324" y="753" text-anchor="middle" class="h" fill="#4e7f31" font-size="10">Развивается</text>
