<g transform="translate(1240 185)" filter="url(#shadow)">
 <rect width="440" height="900" rx="42" fill="#0b1728"/><rect x="12" y="12" width="416" height="876" rx="32" fill="#f5f7fa"/>
 <text x="34" y="37" class="h d" font-size="14">9:41</text><text x="375" y="37" class="m d" font-size="12">●●●</text>
