<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1100" viewBox="0 0 1440 1100">
<defs><style>
.bg{fill:#f4f6fa}.panel{fill:#fff;stroke:#dce2eb;stroke-width:1.3}.ink{fill:#182334;font-family:Inter,Arial,sans-serif}.muted{fill:#6c7889;font-family:Inter,Arial,sans-serif}.h1{font-size:26px;font-weight:700}.h2{font-size:18px;font-weight:700}.body{font-size:14px}.small{font-size:12px}.label{font-size:11px;font-weight:700;letter-spacing:.5px}.line{stroke:#e6eaf0;stroke-width:1}.blue{fill:#2458d3}.blueText{fill:#2458d3;font-family:Arial,sans-serif}.green{fill:#e7f5ed}.gt{fill:#23744b;font-family:Arial,sans-serif}.amber{fill:#fff4df}.at{fill:#95600c;font-family:Arial,sans-serif}
</style></defs>
<rect width="1440" height="1100" class="bg"/>
<text x="44" y="42" class="muted label">COACH APP · UX PROPOSAL · ISSUE #266</text>
<text x="44" y="82" class="ink h1">Индивидуальные цели игрока</text>
<text x="44" y="108" class="muted body">Служебный сценарий тренера и просмотр цели родителем / ребёнком</text>

<!-- coach desktop -->
<rect x="44" y="140" width="840" height="900" rx="14" class="panel"/>
<text x="72" y="180" class="ink h2">Игрок · индивидуальные цели</text>
<text x="72" y="204" class="muted small">Георгий Метревели · U13-A</text>
<rect x="72" y="228" width="784" height="62" rx="8" fill="#f7f9fc"/>
<text x="92" y="253" class="muted label">АКТИВНЫЕ ЦЕЛИ</text><text x="92" y="277" class="ink h2">2</text>
<text x="252" y="253" class="muted label">ВЫПОЛНЕНЫ</text><text x="252" y="277" class="ink h2">4</text>
<text x="418" y="253" class="muted label">ПРИОСТАНОВЛЕНЫ</text><text x="418" y="277" class="ink h2">1</text>
<rect x="690" y="241" width="146" height="36" rx="7" class="blue"/><text x="763" y="264" text-anchor="middle" fill="#fff" font-family="Arial" font-size="13" font-weight="700">+ Новая цель</text>
<text x="72" y="334" class="ink h2">Текущие цели</text>
<rect x="72" y="354" width="784" height="154" rx="9" fill="#fff" stroke="#dce2eb"/>
<rect x="92" y="374" width="104" height="24" rx="12" class="green"/><text x="144" y="391" text-anchor="middle" class="gt small">В работе</text>
<text x="92" y="427" class="ink h2">Улучшить точность передач</text>
<text x="92" y="452" class="muted body">Техническое качество · назначена тренером</text>
<text x="92" y="482" class="muted small">Фокус: передачи внутренней стороной стопы под давлением</text>
<text x="770" y="392" class="blueText small">Открыть →</text>
<line x1="72" y1="526" x2="856" y2="526" class="line"/>
<rect x="72" y="544" width="784" height="138" rx="9" fill="#fff" stroke="#dce2eb"/>
<rect x="92" y="564" width="104" height="24" rx="12" class="amber"/><text x="144" y="581" text-anchor="middle" class="at small">Запланирована</text>
<text x="92" y="617" class="ink h2">Работа над первым касанием</text>
<text x="92" y="642" class="muted body">Техническое качество · старт после согласования тренировки</text>
<text x="770" y="582" class="blueText small">Открыть →</text>
<text x="72" y="724" class="ink h2">История целей</text>
<rect x="72" y="744" width="784" height="58" rx="8" fill="#f7f9fc"/>
<text x="92" y="768" class="ink body" font-weight="700">Улучшить контроль мяча</text><text x="92" y="788" class="muted small">Выполнена · 18 октября 2026</text><text x="770" y="779" class="blueText small">История →</text>
<rect x="72" y="812" width="784" height="58" rx="8" fill="#f7f9fc"/>
<text x="92" y="836" class="ink body" font-weight="700">Работа над координацией</text><text x="92" y="856" class="muted small">Приостановлена · 02 сентября 2026</text><text x="770" y="847" class="blueText small">История →</text>
<rect x="72" y="900" width="784" height="94" rx="8" fill="#f7f9fc"/>
<text x="92" y="928" class="muted label">ПРАВА И РОЛИ</text>
<text x="92" y="953" class="ink small">Тренер создаёт и ведёт цели своих игроков. Администратор — в пределах клубных прав.</text>
<text x="92" y="976" class="ink small">Родитель может предложить цель; активную цель назначает только тренер.</text>

<!-- parent mobile detail -->
<rect x="910" y="140" width="486" height="900" rx="14" class="panel"/>
<text x="942" y="180" class="muted label">РОДИТЕЛЬ / РЕБЁНОК · MOBILE</text>
<text x="942" y="220" class="ink h2">Цель игрока</text>
<text x="942" y="246" class="muted small">Георгий Метревели · U13-A</text>
<rect x="942" y="272" width="422" height="180" rx="10" fill="#f7f9fc"/>
<rect x="964" y="294" width="104" height="24" rx="12" class="green"/><text x="1016" y="311" text-anchor="middle" class="gt small">В работе</text>
<text x="964" y="354" class="ink h2">Улучшить точность</text><text x="964" y="378" class="ink h2">передач</text>
<text x="964" y="414" class="muted body">Техническое качество</text>
<text x="942" y="496" class="ink h2">Комментарий тренера</text>
<text x="942" y="526" class="ink body">«Старайся заранее оценивать положение</text>
<text x="942" y="548" class="ink body">партнёра и выбирать точную передачу.</text>
<text x="942" y="570" class="ink body">На тренировках будем закреплять это</text>
<text x="942" y="592" class="ink body">в игровых упражнениях».</text>
<text x="942" y="646" class="ink h2">История</text>
<circle cx="953" cy="680" r="5" fill="#2458d3"/><text x="972" y="684" class="ink body">Цель назначена тренером</text><text x="972" y="704" class="muted small">05 ноября 2026</text>
<circle cx="953" cy="738" r="5" fill="#2458d3"/><text x="972" y="742" class="ink body">Добавлен комментарий</text><text x="972" y="762" class="muted small">08 ноября 2026</text>
<rect x="942" y="804" width="422" height="78" rx="9" class="amber"/>
<text x="962" y="831" class="at small" font-weight="700">ВАЖНО</text>
<text x="962" y="854" class="ink small">Родитель и ребёнок видят одинаковую</text><text x="962" y="872" class="ink small">информацию. Редактирование — у тренера.</text>
<rect x="942" y="902" width="422" height="52" rx="8" fill="#fff" stroke="#dce2eb"/><text x="1153" y="934" text-anchor="middle" class="blueText body" font-weight="700">Предложить цель</text>
<text x="942" y="980" class="muted small">Предложение не создаёт активную цель автоматически.</text>
<text x="44" y="1074" class="muted small">WIREFRAME · демонстрационные данные · все статусы и тексты сверяются с утверждёнными правилами</text>
</svg>