name: Тесты

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: node --test (приложение, импорт, вход через Telegram)
        run: node --test tests/preflight-coverage.test.mjs tests/consent-legacy-guard.test.mjs tests/import/*.test.mjs tests/edge/*.test.mjs tests/ops/backup-scripts.test.mjs

  edge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Deno Edge Functions (HTTP -> Supabase/Telegram stubs)
        run: deno test --allow-env --allow-net --allow-read --allow-run tests/deno/

  db:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: PostgreSQL и pgTAP
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql postgresql-contrib postgresql-*-pgtap
          sudo systemctl start postgresql
          sudo -u postgres psql -c "create role runner superuser login"
      - name: Миграции и pgTAP-тесты доступа (RLS)
        run: PSQL="psql -h /var/run/postgresql -U runner" scripts/run-db-tests.sh
      - name: Резервные копии (REL-01) на локальном PostgreSQL
        run: |
          sudo apt-get install -y age
          sudo -u postgres psql -c "alter role runner password 'ci-only'"
          BACKUP_IT_PG_URL=postgresql://runner@localhost:5432 PGPASSWORD=ci-only node --test tests/ops/backup-integration.test.mjs

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Установка и сборка приложения для родителей
        run: npm install && npm run build
        env:
          VITE_SUPABASE_URL: https://example.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_placeholder
      - name: Тесты экранов (Vitest, заглушка вместо Supabase)
        run: npm test
