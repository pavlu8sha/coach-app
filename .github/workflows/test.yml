name: Тесты

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: node --test (приложение, импорт, вход через Telegram)
        run: node --test tests/*.mjs tests/import/*.test.mjs tests/edge/*.test.mjs
