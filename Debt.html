<!DOCTYPE html>
<html lang="ru">
<head>
<base target="_top">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Должники</title>
<style>
:root{--bg:#F4F6F3;--card:#fff;--ink:#15211A;--mute:#5B6B61;--line:#DCE3DD;--g:#1E6B3C;--gi:#fff;--a:#B23A2B}
@media(prefers-color-scheme:dark){:root{--bg:#0F1712;--card:#17221B;--ink:#E8F0EA;--mute:#93A69A;--line:#26362C;--g:#4FAE74;--gi:#0B1410;--a:#E8806F}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding-bottom:40px}
.wrap{max-width:560px;margin:0 auto;padding:0 16px}
h1{font-size:22px;margin:16px 0 6px}
input,select,textarea{font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px;min-height:44px;width:100%}
textarea{min-height:84px;resize:vertical}
label{display:block;margin:10px 0 4px;color:var(--mute);font-size:14px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
button{font:inherit;cursor:pointer}
.btn{width:100%;min-height:46px;border:0;border-radius:12px;background:var(--g);color:var(--gi);font-weight:800;font-size:15px;margin-top:10px}
.btn:disabled{opacity:.5}
.cp{border:1px solid var(--line);background:var(--card);color:var(--g);border-radius:10px;min-height:38px;padding:0 12px;font-weight:700;font-size:14px;white-space:nowrap}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.seg button{min-height:42px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--mute);font-weight:700}
.seg button[aria-pressed=true]{background:var(--g);border-color:var(--g);color:var(--gi)}
.tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin:12px 0}
.tile{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px}
.tile b{display:block;font-size:18px}.tile span{color:var(--mute);font-size:12px}
details{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 14px;margin-bottom:8px}
summary{cursor:pointer;list-style:none}summary::-webkit-details-marker{display:none}
.top{display:flex;justify-content:space-between;gap:8px;font-weight:700}
.sub{color:var(--mute);font-size:13px}
.it{padding:8px 0;border-top:1px solid var(--line)}
.itr{display:flex;justify-content:space-between;align-items:center;gap:8px}
.itr .nm{min-width:0}.itr .nm b{display:block;font-weight:600}
.ac{display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.pf{margin-top:6px}
.wr{display:flex;gap:6px;align-items:center;color:var(--mute);font-size:13px;margin:0;white-space:nowrap}.wr input{width:20px;min-height:0;height:20px}
.err{color:var(--a)}.msg{color:var(--mute);font-size:14px;min-height:20px;margin-top:8px}
[hidden]{display:none!important}
</style>
</head>
<body>
<div id="login" class="wrap" hidden>
  <h1>Должники</h1><p>Введите код администратора</p>
  <input id="pin" type="password" autocomplete="off"><p id="lerr" class="err"></p><button class="btn" id="go">Войти</button>
</div>
<div id="app" class="wrap" hidden>
  <h1>Должники</h1>
  <div class="row2">
    <div><label>Месяц абонемента</label><select id="mon"></select></div>
    <div><label>Группа</label><select id="grp"></select></div>
  </div>
  <label>Текст сообщения ({месяц} подставится сам)</label>
  <textarea id="tpl"></textarea>
  <button class="btn" id="cpall">Скопировать текст</button>
  <div class="msg" id="msg" role="status"></div>
  <div class="tiles" id="sum"></div>
  <div id="list"></div>
  <div id="ind"></div>
  <div id="ext"></div>
</div>
<script>
var pin='',R=null,done={},method='';
try{done=JSON.parse(localStorage.getItem('debtDone')||'{}')}catch(e){}
var MN=['январь','февраль','март','апрель','май','июнь','июль','август','сентябрь','октябрь','ноябрь','декабрь'];
var DEF='Добрый день\nУ вас не оплачен абонемент за {месяц}';
function $(i){return document.getElementById(i)}
function run(fn,args,ok,fail){var r=google.script.run.withSuccessHandler(ok).withFailureHandler(function(e){fail(e&&e.message?e.message:String(e))});r[fn].apply(r,args)}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function money(n){return String(Math.round(n*100)/100).replace('.',',')+' ₾'}
function today(){var d=new Date(),z=function(n){return(n<10?'0':'')+n};return d.getFullYear()+'-'+z(d.getMonth()+1)+'-'+z(d.getDate())}
function setMsg(t,bad){$('msg').textContent=t||'';$('msg').className='msg'+(bad?' err':'')}
function showLogin(t){$('app').hidden=true;$('login').hidden=false;$('lerr').textContent=t||''}
function fail(m){if(m.indexOf('код администратора')>=0)showLogin('Неверный код администратора');else{$('login').hidden=true;$('app').hidden=false;setMsg(m,true)}}
function monName(m){var a=m.split('.');return MN[Number(a[0])-1]||m}
function future(m){var a=m.split('.'),d=new Date(),cur=d.getFullYear()%100*12+d.getMonth();return Number(a[1])*12+Number(a[0])-1>cur}
function msgFor(name){
  return $('tpl').value.replace(/\{месяц\}/g,monName($('mon').value)).replace(/\{имя\}/g,name);
}
function load(keepMon){
  setMsg('Загрузка…');
  run('appDebtors',[pin,keepMon?$('mon').value:''],function(r){
    R=r;$('login').hidden=true;$('app').hidden=false;
    if(!keepMon){
      $('mon').innerHTML=r.months.map(function(m){return'<option>'+m+'</option>'}).join('');
      $('mon').value=r.month;
    }
    var g=$('grp').value;
    $('grp').innerHTML='<option value="">Все группы</option>'+r.groups.map(function(x){return'<option>'+esc(x.name)+'</option>'}).join('');
    $('grp').value=g;
    show();
  },fail);
}
function show(keepMsg){
  if(!R)return;renderInd();renderExt();
  if(!R.found){setMsg('В файле оплат нет листа '+R.month+'.',true);$('sum').innerHTML='';$('list').innerHTML='';return}
  var g=$('grp').value,gs=R.groups.filter(function(x){return!g||x.name==g});
  var n=0,s=0;gs.forEach(function(x){x.items.forEach(function(i){n++;s+=i.debt})});
  if(!keepMsg)setMsg(future($('mon').value)?'Месяц ещё не начался: должниками игроки станут с 1 числа.':'');
  $('sum').innerHTML='<div class="tile"><b>'+n+'</b><span>не оплатили</span></div><div class="tile"><b>'+money(s)+'</b><span>сумма долга</span></div>';
  $('list').innerHTML=gs.map(function(x){
    var sm=0;x.items.forEach(function(i){sm+=i.debt});
    return'<details open><summary><div class="top"><span>'+esc(x.name)+'</span><span>'+x.items.length+' · '+money(sm)+'</span></div></summary>'
      +x.items.map(function(i){
        var k=R.month+'|'+i.id;
        return'<div class="it" data-g="'+esc(x.name)+'" data-id="'+esc(i.id)+'" data-debt="'+i.debt+'" data-n="'+esc(i.name)+'">'
          +'<div class="itr"><div class="nm"><b>'+esc(i.name)+'</b><span class="sub">'+(i.partial?'внесено '+money(i.paid)+', долг '+money(i.debt):'долг '+money(i.debt))+'</span></div>'
          +'<div class="ac"><button class="cp pb">Оплата</button><label class="wr"><input type="checkbox" data-k="'+esc(k)+'"'+(done[k]?' checked':'')+'> написал(а)</label></div></div>'
          +'<div class="pf" hidden><label>Сумма, ₾</label><input type="number" min="0" step="1" class="pa" value="'+i.debt+'">'
          +'<div class="pt" hidden><label>Сумма меньше долга. Что это?</label><select class="ptype"><option value="">Выберите…</option><option value="Скидка">Скидка по договорённости (оплата принята)</option><option value="Частичный">Частичный платёж (останется долг)</option></select></div>'
          +'<label>Способ оплаты</label><div class="seg"><button class="mt" data-m="Наличные" aria-pressed="'+(method=='Наличные')+'">Наличные</button><button class="mt" data-m="Перевод" aria-pressed="'+(method=='Перевод')+'">Перевод</button></div>'
          +'<button class="btn go">Внести оплату</button></div></div>';
      }).join('')+'</details>';
  }).join('')||'<p class="sub">Должников нет.</p>';
}
function fallbackCopy(t){
  var a=document.createElement('textarea');a.value=t;a.style.position='fixed';a.style.opacity='0';document.body.appendChild(a);a.select();
  var ok=false;try{ok=document.execCommand('copy')}catch(e){}
  document.body.removeChild(a);return ok;
}
function copyText(t,b){
  var done2=function(ok){
    if(!ok){setMsg('Не удалось скопировать. Выделите текст в поле выше вручную.',true);return}
    var old=b.textContent;b.textContent='Скопировано';
    setTimeout(function(){b.textContent=old},1800);
  };
  if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(t).then(function(){done2(true)},function(){done2(fallbackCopy(t))});
  else done2(fallbackCopy(t));
}
$('cpall').onclick=function(){copyText(msgFor(''),this)};
$('list').onchange=function(e){var c=e.target;if(c.dataset&&c.dataset.k){if(c.checked)done[c.dataset.k]=1;else delete done[c.dataset.k];try{localStorage.setItem('debtDone',JSON.stringify(done))}catch(x){}}};
$('list').oninput=function(e){
  if(!e.target.classList.contains('pa'))return;
  var it=e.target.closest('.it');
  it.querySelector('.pt').hidden=Number(e.target.value)>=Number(it.dataset.debt);
};
$('list').onclick=function(e){
  var b=e.target.closest('button');if(!b)return;
  var it=b.closest('.it');if(!it)return;
  if(b.classList.contains('pb')){var f=it.querySelector('.pf');f.hidden=!f.hidden;return}
  if(b.classList.contains('mt')){
    method=b.dataset.m;
    [].forEach.call($('list').querySelectorAll('.mt'),function(x){x.setAttribute('aria-pressed',x.dataset.m==method)});
    return;
  }
  if(b.classList.contains('go')){
    var amt=Number(it.querySelector('.pa').value),type=it.querySelector('.ptype').value,debt=Number(it.dataset.debt),name=it.dataset.n;
    if(!method){setMsg('Выберите способ оплаты: наличные или перевод.',true);return}
    if(!(amt>0)){setMsg('Введите сумму больше нуля.',true);return}
    if(amt<debt&&!type){setMsg('Сумма меньше долга: выберите скидка или частичный платёж.',true);return}
    b.disabled=true;setMsg('Сохраняю…');
    run('appSubPay',[pin,$('mon').value,it.dataset.g,it.dataset.id,amt,type,today(),'',method],function(r){
      b.disabled=false;
      if(r.dryRun){setMsg('Пробный режим: в таблицу ничего не записано.');return}
      run('appDebtors',[pin,$('mon').value],function(d){R=d;show(true);setMsg('Внесено: '+name+', '+money(amt)+' ('+method+').')},fail);
    },function(m){b.disabled=false;setMsg(m,true)});
  }
};
var indOpen=false;
function idl(e){var p=e.date.split('-');return p[2]+'.'+p[1]+' '+e.time+' · '+(e.gk?'вратари':'индив.')}
function renderInd(){
  var a=R.ind||[],g=$('grp').value;
  if(g||!a.length){$('ind').innerHTML='';return}
  var tot=0;a.forEach(function(d){tot+=d.total});
  var h='<details'+(indOpen?' open':'')+'><summary><div class="top"><span>Индивидуальные и вратарские</span><span>'+a.length+' · '+money(tot)+'</span></div></summary>';
  a.forEach(function(d,i){
    h+='<div class="it"><div class="nm"><b>'+esc(d.name)+'</b><span class="sub">'+esc(d.group)+' · долг '+money(d.total)+'</span></div>';
    d.events.forEach(function(e,j){
      h+='<div class="itr" style="margin-top:6px"><span class="sub">'+idl(e)+'</span><div class="ac" style="flex-direction:row"><button class="cp ipb" data-i="'+i+'" data-j="'+j+'" data-m="Наличные">Наличные</button><button class="cp ipb" data-i="'+i+'" data-j="'+j+'" data-m="Перевод">Перевод</button></div></div>';
    });
    h+='</div>';
  });
  $('ind').innerHTML=h+'</details>';
}
$('ind').addEventListener('toggle',function(e){indOpen=e.target.open},true);
$('ind').onclick=function(e){
  var b=e.target.closest('.ipb');if(!b)return;
  var d=R.ind[b.dataset.i],ev=d.events[b.dataset.j];
  b.disabled=true;setMsg('Сохраняю…');
  run('appIndPay',[pin,ev.id,d.name,b.dataset.m],function(){
    run('appDebtors',[pin,$('mon').value],function(r){R=r;show(true);setMsg('Внесено: '+d.name+', '+money(d.total/d.events.length)+' ('+b.dataset.m+').')},fail);
  },function(m){b.disabled=false;setMsg(m,true)});
};
var extOpen=false;
function renderExt(){
  var a=R.extra||[],g=$('grp').value;
  if(g||!a.length){$('ext').innerHTML='';return}
  var tot=0;a.forEach(function(d){tot+=d.total});
  var h='<details'+(extOpen?' open':'')+'><summary><div class="top"><span>Дополнительные тренировки</span><span>'+a.length+' · '+money(tot)+'</span></div></summary>';
  a.forEach(function(d,i){
    h+='<div class="it"><div class="nm"><b>'+esc(d.name)+'</b><span class="sub">'+esc(d.group)+' · долг '+money(d.total)+'</span></div>';
    d.events.forEach(function(e,j){
      var dt='Дополнительная '+String(e.id).split('|')[0];
      if(e.price>0) h+='<div class="itr" style="margin-top:6px"><span class="sub">'+esc(dt)+' · '+money(e.price)+'</span><div class="ac" style="flex-direction:row"><button class="cp xpb" data-i="'+i+'" data-j="'+j+'" data-m="Наличные">Наличные</button><button class="cp xpb" data-i="'+i+'" data-j="'+j+'" data-m="Перевод">Перевод</button></div></div>';
      else h+='<div class="itr" style="margin-top:6px"><span class="sub">'+esc(dt)+' · сумма не задана (укажите в «Дополнительные» → «Изменить»)</span></div>';
    });
    h+='</div>';
  });
  $('ext').innerHTML=h+'</details>';
}
$('ext').addEventListener('toggle',function(e){extOpen=e.target.open},true);
$('ext').onclick=function(e){
  var b=e.target.closest('.xpb');if(!b)return;
  var d=R.extra[b.dataset.i],ev=d.events[b.dataset.j];
  b.disabled=true;setMsg('Сохраняю…');
  run('appExtraPay',[pin,ev.id,d.name,b.dataset.m,''],function(){
    run('appDebtors',[pin,$('mon').value],function(r){R=r;show(true);setMsg('Внесено: '+d.name+', '+money(ev.price)+' ('+b.dataset.m+').')},fail);
  },function(m){b.disabled=false;setMsg(m,true)});
};
$('mon').onchange=function(){load(true)};
$('grp').onchange=function(){show()};
$('tpl').oninput=function(){try{localStorage.setItem('debtTpl',this.value)}catch(e){}};
$('go').onclick=function(){pin=$('pin').value.trim();if(!pin)return;try{localStorage.setItem('kspin',pin)}catch(e){}load()};
try{pin=localStorage.getItem('kspin')||''}catch(e){}
try{$('tpl').value=localStorage.getItem('debtTpl')||DEF}catch(e){$('tpl').value=DEF}
if(pin)load();else showLogin('');
</script>
</body>
</html>
