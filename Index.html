<!DOCTYPE html>
<html lang="ru">
<head>
<base target="_top">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Отметки</title>
<style>
:root{--bg:#F4F6F3;--card:#fff;--ink:#15211A;--mute:#5B6B61;--line:#DCE3DD;--g:#1E6B3C;--gi:#fff;--pb:#DDF0E3;--a:#B23A2B;--n:#D3DAD5}
@media(prefers-color-scheme:dark){:root{--bg:#0F1712;--card:#17221B;--ink:#E8F0EA;--mute:#93A69A;--line:#26362C;--g:#4FAE74;--gi:#0B1410;--pb:#1B3A28;--a:#E8806F;--n:#33443A}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding-bottom:110px}
.wrap{max-width:560px;margin:0 auto;padding:0 16px}
h1{font-size:22px;margin:16px 0 10px}
input,select{font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px;min-height:44px;width:100%}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}.row2>*{min-width:0;max-width:100%}#dt{-webkit-appearance:none;appearance:none;display:block;width:100%;box-sizing:border-box;min-width:0}input:-webkit-autofill,input:-webkit-autofill:hover,input:-webkit-autofill:focus{-webkit-box-shadow:0 0 0 1000px var(--card) inset;-webkit-text-fill-color:var(--ink);transition:background-color 9999s}
.chk{display:flex;gap:8px;align-items:center;margin-top:8px;color:var(--mute);font-size:14px;min-height:44px}.chk input{width:22px;height:22px;min-height:0;flex:none} /* DS-015: цель касания ≥ 44 px */
.meter{display:flex;gap:3px;margin:12px 0 6px}.meter i{flex:1;height:8px;border-radius:2px;background:var(--n)}.meter .p{background:var(--color-success)}.meter .a{background:var(--a)}
.st{display:flex;gap:16px;color:var(--mute);font-size:14px}.st b{color:var(--ink);font-size:16px}
button{font:inherit;cursor:pointer}
.ghost{font-weight:600;color:var(--g);background:none;border:1px solid var(--line);border-radius:10px;padding:8px 14px;min-height:44px}
ul{list-style:none;margin:8px 0;padding:0}
li{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px 8px 8px 14px;margin-bottom:8px}
.nm{flex:1;font-weight:600}
.seg{display:flex;gap:6px}.seg button{min-width:68px;min-height:44px;border-radius:10px;border:1px solid var(--line);background:none;color:var(--mute);font-weight:600;font-size:14px}
.seg .p[aria-pressed=true]{background:var(--color-success-subtle);border-color:var(--color-success);color:var(--color-success)} /* по макету UI-001: «Был» — зелёный */
.seg .a[aria-pressed=true]{background:var(--ab);border-color:var(--a);color:var(--color-danger-strong,#9E2B1F)}
footer{position:fixed;left:0;right:0;bottom:0;background:var(--bg);border-top:1px solid var(--line);padding:10px 16px}
#save,#go{width:100%;min-height:50px;border:0;border-radius:12px;background:var(--g);color:var(--gi);font-weight:800;font-size:17px}
#save:disabled{background:var(--n);color:var(--mute)}
.err{color:var(--a)}.msg{color:var(--mute);font-size:14px;min-height:20px;margin-top:8px}
.res{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 14px;margin:8px 0;font-size:14px}
/* UI-001: отступ снизу = фактическая высота закреплённой кнопки (+ нижнее меню и безопасная зона на телефоне),
   чтобы последнего ребёнка было видно и можно было отметить */
html[data-page="att"]:root body{padding-bottom:calc(var(--foot-h,72px) + 16px)!important}
@media(max-width:839px){html[data-page="att"]:root body{padding-bottom:calc(var(--foot-h,72px) + var(--navh,64px) + env(safe-area-inset-bottom) + 16px)!important}}
@media(min-width:840px){footer{padding-bottom:calc(10px + env(safe-area-inset-bottom))}}
/* всплывающее сообщение — над закреплённой кнопкой, а не поверх неё */
html[data-page="att"]:root #kstoast{bottom:calc(var(--foot-h,72px) + 12px)}
@media(max-width:839px){html[data-page="att"]:root #kstoast{bottom:calc(var(--foot-h,72px) + var(--navh,64px) + env(safe-area-inset-bottom) + 12px)}}
#ferr{margin:0 0 8px;font-size:14px;font-weight:600}
li.empty{display:block;color:var(--mute);font-weight:400;padding:14px}
#cnt{margin:0 0 8px;font-size:14px;color:var(--mute)}#cnt b{color:var(--ink)}
.gc{margin:6px 0 0;font-size:13px;color:var(--mute)}
/* UI-016: переключатель «Группы / Индивидуальные» над выбором группы */
.chk[hidden]{display:none}
.ktab{display:grid;grid-template-columns:1fr 1fr;gap:4px;margin:0 0 10px;padding:4px;border:1px solid var(--line);border-radius:14px;background:var(--card)}
.ktab button{min-height:44px;border:0;border-radius:10px;background:none;color:var(--mute);font-weight:700;font-size:15px}
.ktab button.on{background:var(--g);color:var(--gi)}
.lerr{display:block;background:var(--color-danger-subtle);border-color:var(--a);color:var(--color-danger-strong);font-weight:600;padding:12px 14px}
.lerr button{display:block;margin-top:10px;min-height:44px;padding:8px 18px;border-radius:10px;border:1px solid currentColor;background:none;color:inherit;font-weight:700}
</style>
</head>
<body>
<div id="login" class="wrap" hidden>
  <h1>Вход</h1><label for="pin" class="ks-pinl">Введите код доступа</label>
  <input id="pin" type="password" autocomplete="off"><p id="lerr" class="err" role="alert"></p><button id="go">Войти</button>
</div>
<div id="app" class="wrap ks-wide-w" hidden>
  <h1>Отметки</h1>
  <div class="ktab" id="ktab" role="tablist" aria-label="Тип занятий"><button type="button" role="tab" aria-selected="true" class="on" data-k="grp">Группы</button><button type="button" role="tab" aria-selected="false" tabindex="-1" data-k="ind">Индивидуальные</button></div>
  <div class="row2"><select id="grp" aria-label="Группа"></select><input type="date" id="dt" aria-label="Дата" autocomplete="off"></div>
  <p class="gc" id="gcnt" hidden></p>
  <label class="chk"><input type="checkbox" id="allg"> Показать все группы (доп. или перенесённая тренировка)</label>
  <div class="meter" id="meter"></div><div class="st" id="st"></div>
  <div style="display:flex;gap:8px;margin-top:10px"><button class="ghost" id="all">Все были</button><button class="ghost" id="clr">Сбросить</button></div>
  <div class="msg" id="msg" role="status"></div>
  <ul id="list"></ul><div id="res"></div>
</div>
<footer id="foot" hidden><p id="ferr" class="err" role="alert" hidden></p><p id="cnt" hidden></p><button id="save"></button></footer>
<script>
var pin='',roster=[],marks={},busy=false,allGroups=[],reqN=0,rosterFor='',tab='grp',emptyTab=false,loadErr='';
// UI-016: вкладка группы — «Индивидуальные» для индивидуальных, вратарей и дополнительных (как IND_GROUP_RE и EXTRA_GROUP на сервере)
function kindOf(name){return/^(Индивидуальные|Вратари|Дополнительные)$/.test(String(name||''))?'ind':'grp'}
function setTab(t){tab=t;[].forEach.call($('ktab').children,function(b){var on=b.dataset.k==t;b.classList.toggle('on',on);b.setAttribute('aria-selected',String(on));b.tabIndex=on?0:-1});$('allg').parentElement.hidden=(t=='ind')}
function key(){return $('grp').value+'|'+$('dt').value}
function $(i){return document.getElementById(i)}
function run(fn,args,ok,fail){var r=google.script.run.withSuccessHandler(ok).withFailureHandler(function(e){fail(e&&e.message?e.message:String(e))});r[fn].apply(r,args)}
function today(){var d=new Date(),z=function(n){return(n<10?'0':'')+n};return d.getFullYear()+'-'+z(d.getMonth()+1)+'-'+z(d.getDate())}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function msg(t,bad){$('msg').textContent=t||'';$('msg').className='msg'+(bad?' err':'')}
function showLogin(t){$('app').hidden=true;$('foot').hidden=true;$('login').hidden=false;$('lerr').textContent=t||''}
function showApp(){$('login').hidden=true;$('app').hidden=false;$('foot').hidden=false}
// Запоминаем дату и группу только в пределах текущего дня.
function saveState(){try{localStorage.setItem('st',JSON.stringify({d:$('dt').value,g:$('grp').value,all:$('allg').checked,t:tab,on:today()}))}catch(e){}}
function loadState(){try{var s=JSON.parse(localStorage.getItem('st')||'null');if(s&&s.on==today()){$('dt').value=s.d;$('allg').checked=!!s.all;setTab(s.t=='ind'?'ind':'grp');return s.g||''}}catch(e){}return''}
function fillGroups(want,pre){
  // сохранённая группа с другой вкладки — переключаем вкладку
  if(want&&allGroups.some(function(g){return g.name==want})&&kindOf(want)!=tab)setTab(kindOf(want));
  var vis=allGroups.filter(function(g){return $('allg').checked||g.sched||kindOf(g.name)=='ind'});
  var show=vis.filter(function(g){return kindOf(g.name)==tab});
  $('grp').innerHTML=show.map(function(g){return'<option value="'+esc(g.name)+'">'+esc(g.name)+(g.sched?'':' (не по расписанию)')+'</option>'}).join('')||'<option value="">'+(tab=='ind'?'Нет занятий':'Нет групп')+'</option>';
  $('grp').disabled=!show.length;emptyTab=false;loadErr='';
  if(!show.length){
    roster=[];marks={};rosterFor='';
    if(tab=='ind'){emptyTab=true;msg('');render();return}
    render();msg('В этот день по расписанию тренировок нет. Для дополнительной или перенесённой включите «Показать все группы».',true);return;
  }
  if(show.some(function(g){return g.name==want}))$('grp').value=want;
  if(pre&&pre.group===$('grp').value){setRoster(pre.roster);return}
  loadRoster();
}
function loadGroups(want){
  var n=++reqN;
  msg('Загрузка…');$('res').innerHTML='';
  run('appAttInit',[pin,$('dt').value,want||$('grp').value,$('allg').checked],function(r){
    if(n!=reqN)return;
    showApp();allGroups=r.groups;
    if(!r.groups.length){$('grp').innerHTML='';roster=[];marks={};render();msg('В листе месяца нет групп.',true);return}
    fillGroups(want&&r.groups.some(function(g){return g.name==want})?want:r.group,{group:r.group,roster:r.roster});
  },function(m){
    if(n!=reqN)return;
    if(m.indexOf('код доступа')>=0)showLogin('Неверный код доступа');
    else{showApp();allGroups=[];$('grp').innerHTML='';roster=[];marks={};loadErr=m;render();msg(m,true)}
  });
}
function setRoster(r){
  roster=r;marks={};var n=0;
  r.forEach(function(x){if(x.mark){marks[x.id]=x.mark;n++}});
  rosterFor=key();
  msg(n?'Отметки подтянуты из таблицы. Можно исправить и сохранить снова.':'');
  render();
}
function loadRoster(){
  var n=++reqN;
  msg('Загрузка списка…');render();
  loadErr='';
  run('appRoster',[pin,$('grp').value,$('dt').value],function(r){if(n==reqN)setRoster(r)},function(m){if(n==reqN){loadErr=m;roster=[];marks={};rosterFor='';msg('');render()}}); // ошибка — блоком в списке с «Повторить»
}
function kids(n){var d=n%10,h=n%100;return n+' '+(d==1&&h!=11?'ребёнок':(d>=2&&d<=4&&(h<12||h>14)?'ребёнка':'детей'))}
function render(){
  var p=0,a=0,li='',mt='';
  roster.forEach(function(x,i){
    var s=marks[x.id]||'';if(s=='p')p++;if(s=='a')a++;mt+='<i class="'+s+'"></i>';
    li+='<li><span class="nm">'+esc(x.name)+'</span><div class="seg"><button class="p" aria-pressed="'+(s=='p')+'" data-i="'+i+'" data-v="p">Был</button><button class="a" aria-pressed="'+(s=='a')+'" data-i="'+i+'" data-v="a">Не был</button></div></li>';
  });
  if(!roster.length&&rosterFor===key())li='<li class="empty">В группе пока нет детей. Добавьте их в реестр</li>';
  if(emptyTab)li=ksEmpty({tag:'li',icon:'users',title:'Индивидуальных занятий сегодня нет',text:'На выбранную дату нет индивидуальных, вратарских или дополнительных занятий.'});
  if(loadErr&&!roster.length)li='<li class="lerr" role="alert">Не удалось загрузить список. '+esc(loadErr)+'<button type="button" id="retry">Повторить</button></li>';
  var loaded=rosterFor===key()&&roster.length>0;
  $('cnt').hidden=!loaded;$('cnt').innerHTML='Отмечено: <b>'+(p+a)+'</b> из '+roster.length;
  $('gcnt').hidden=!loaded;$('gcnt').textContent=kids(roster.length);
  var r=roster.length-p-a;$('list').innerHTML=li;$('meter').innerHTML=mt;
  $('st').innerHTML='<span><b>'+p+'</b> были</span><span><b>'+a+'</b> не были</span><span><b>'+r+'</b> осталось</span>';
  var stale=roster.length>0&&rosterFor!==key();
  var b=$('save');b.disabled=busy||stale||!roster.length||r>0;
  b.textContent=busy?'Сохраняю…':(stale?'Загрузка списка…':(r>0?'Осталось отметить: '+r:'Сохранить отметки'));
}
$('list').onclick=function(e){
  if(e.target.id=='retry'){if(allGroups.length&&$('grp').value)loadRoster();else loadGroups();return}
  var t=e.target;if(!t.dataset||!t.dataset.v)return;
  var id=roster[t.dataset.i].id;
  if(marks[id]==t.dataset.v)delete marks[id];else marks[id]=t.dataset.v;
  $('res').innerHTML='';ferr('');render();
};
$('all').onclick=function(){roster.forEach(function(x){if(!marks[x.id])marks[x.id]='p'});render()};
$('clr').onclick=function(){marks={};$('res').innerHTML='';render()};
$('grp').onchange=function(){$('res').innerHTML='';saveState();loadRoster()};
$('dt').onchange=function(){if(this.value){saveState();loadGroups()}};
$('allg').onchange=function(){saveState();fillGroups($('grp').value)};
$('ktab').onclick=function(e){var b=e.target.closest('button');if(!b||b.dataset.k==tab)return;setTab(b.dataset.k);$('res').innerHTML='';ferr('');fillGroups('');saveState()};
function ferr(t){var e=$('ferr');e.textContent=t||'';e.hidden=!t}
// Высота закреплённой кнопки (с сообщением об ошибке) — для нижнего отступа списка
(function(){var f=$('foot');function up(){document.documentElement.style.setProperty('--foot-h',(f.offsetHeight||72)+'px')}
  if(window.ResizeObserver)new ResizeObserver(up).observe(f);window.addEventListener('resize',up);up()})();
$('save').onclick=function(){
  ferr('');busy=true;render();
  var out=roster.map(function(x){return{id:x.id,name:x.name,present:marks[x.id]=='p'}});
  run('appSave',[pin,$('grp').value,$('dt').value,out],
    function(rep){busy=false;render();showResult(rep)},
    function(m){busy=false;render();msg(m,true);ferr('Не сохранено: '+m)});
};
function showResult(rep){
  var bad=rep.results.filter(function(r){return r.result.indexOf('НЕ записано')==0}),ok=rep.results.length-bad.length;
  var h=(rep.dryRun?'<p><b>Пробный режим:</b> в таблицу ничего не записано.</p>':'')+'<p>Записано в лист: <b>'+ok+'</b> из '+rep.results.length+'</p>';
  if(bad.length)h+='<p class="err">Не удалось записать:</p><ul>'+bad.map(function(r){return'<li style="display:block;padding:6px 10px"><b>'+esc(r.name)+'</b><br>'+esc(r.result.replace('НЕ записано: ',''))+'</li>'}).join('')+'</ul>';
  $('res').innerHTML='<div class="res">'+h+'</div>';window.scrollTo(0,document.body.scrollHeight);
}
$('go').onclick=function(){pin=$('pin').value.trim();if(!pin)return;try{localStorage.setItem('kspin',pin)}catch(e){}loadGroups()};
$('dt').value=today();
var wantG=loadState();
try{pin=localStorage.getItem('kspin')||''}catch(e){}
if(pin)loadGroups(wantG);else showLogin('');
</script>
</body>
</html>
