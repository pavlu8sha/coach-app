<!DOCTYPE html>
<html lang="ru">
<head>
<base target="_top">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Посещаемость</title>
<style>
:root{--bg:#F4F6F3;--card:#fff;--ink:#15211A;--mute:#5B6B61;--line:#DCE3DD;--g:#1E6B3C;--gi:#fff;--pb:#DDF0E3;--a:#B23A2B;--ab:#F8E1DD;--n:#D3DAD5}
@media(prefers-color-scheme:dark){:root{--bg:#0F1712;--card:#17221B;--ink:#E8F0EA;--mute:#93A69A;--line:#26362C;--g:#4FAE74;--gi:#0B1410;--pb:#1B3A28;--a:#E8806F;--ab:#3C1F1B;--n:#33443A}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding-bottom:110px}
.wrap{max-width:560px;margin:0 auto;padding:0 16px}
h1{font-size:22px;margin:16px 0 10px}
input,select{font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px;min-height:44px;width:100%}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}.row2>*{min-width:0;max-width:100%}#dt{-webkit-appearance:none;appearance:none;display:block;width:100%;box-sizing:border-box;min-width:0}input:-webkit-autofill,input:-webkit-autofill:hover,input:-webkit-autofill:focus{-webkit-box-shadow:0 0 0 1000px var(--card) inset;-webkit-text-fill-color:var(--ink);transition:background-color 9999s}
.chk{display:flex;gap:8px;align-items:center;margin-top:8px;color:var(--mute);font-size:14px;min-height:44px}.chk input{width:22px;height:22px;min-height:0;flex:none} /* DS-015: цель касания ≥ 44 px */
.meter{display:flex;gap:3px;margin:12px 0 6px}.meter i{flex:1;height:8px;border-radius:2px;background:var(--n)}.meter .p{background:var(--g)}.meter .a{background:var(--a)}
.st{display:flex;gap:16px;color:var(--mute);font-size:14px}.st b{color:var(--ink);font-size:16px}
button{font:inherit;cursor:pointer}
.ghost{font-weight:600;color:var(--g);background:none;border:1px solid var(--line);border-radius:10px;padding:8px 14px;min-height:40px}
ul{list-style:none;margin:8px 0;padding:0}
li{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px 8px 8px 14px;margin-bottom:8px}
.nm{flex:1;font-weight:600}
.seg{display:flex;gap:6px}.seg button{min-width:68px;min-height:44px;border-radius:10px;border:1px solid var(--line);background:none;color:var(--mute);font-weight:600;font-size:14px}
.seg .p[aria-pressed=true]{background:var(--pb);border-color:var(--g);color:var(--g)}
.seg .a[aria-pressed=true]{background:var(--ab);border-color:var(--a);color:var(--color-danger-strong,#9E2B1F)}
footer{position:fixed;left:0;right:0;bottom:0;background:var(--bg);border-top:1px solid var(--line);padding:10px 16px}
#save,#go{width:100%;min-height:50px;border:0;border-radius:12px;background:var(--g);color:var(--gi);font-weight:800;font-size:17px}
#save:disabled{background:var(--n);color:var(--mute)}
.err{color:var(--a)}.msg{color:var(--mute);font-size:14px;min-height:20px;margin-top:8px}
.res{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 14px;margin:8px 0;font-size:14px}
</style>
</head>
<body>
<div id="login" class="wrap" hidden>
  <h1>Вход</h1><p>Введите код доступа</p>
  <input id="pin" type="password" autocomplete="off"><p id="lerr" class="err"></p><button id="go">Войти</button>
</div>
<div id="app" class="wrap" hidden>
  <h1>Отметка посещаемости</h1>
  <div class="row2"><select id="grp" aria-label="Группа"></select><input type="date" id="dt" aria-label="Дата" autocomplete="off"></div>
  <label class="chk"><input type="checkbox" id="allg"> Показать все группы (доп. или перенесённая тренировка)</label>
  <div class="meter" id="meter"></div><div class="st" id="st"></div>
  <div style="display:flex;gap:8px;margin-top:10px"><button class="ghost" id="all">Все были</button><button class="ghost" id="clr">Сбросить</button></div>
  <div class="msg" id="msg" role="status"></div>
  <ul id="list"></ul><div id="res"></div>
</div>
<footer id="foot" hidden><button id="save"></button></footer>
<script>
var pin='',roster=[],marks={},busy=false,allGroups=[],reqN=0,rosterFor='';
function key(){return $('grp').value+'|'+$('dt').value}
function $(i){return document.getElementById(i)}
function run(fn,args,ok,fail){var r=google.script.run.withSuccessHandler(ok).withFailureHandler(function(e){fail(e&&e.message?e.message:String(e))});r[fn].apply(r,args)}
function today(){var d=new Date(),z=function(n){return(n<10?'0':'')+n};return d.getFullYear()+'-'+z(d.getMonth()+1)+'-'+z(d.getDate())}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function msg(t,bad){$('msg').textContent=t||'';$('msg').className='msg'+(bad?' err':'')}
function showLogin(t){$('app').hidden=true;$('foot').hidden=true;$('login').hidden=false;$('lerr').textContent=t||''}
function showApp(){$('login').hidden=true;$('app').hidden=false;$('foot').hidden=false}
// Запоминаем дату и группу только в пределах текущего дня.
function saveState(){try{localStorage.setItem('st',JSON.stringify({d:$('dt').value,g:$('grp').value,all:$('allg').checked,on:today()}))}catch(e){}}
function loadState(){try{var s=JSON.parse(localStorage.getItem('st')||'null');if(s&&s.on==today()){$('dt').value=s.d;$('allg').checked=!!s.all;return s.g||''}}catch(e){}return''}
function fillGroups(want,pre){
  var show=allGroups.filter(function(g){return $('allg').checked||g.sched});
  $('grp').innerHTML=show.map(function(g){return'<option value="'+esc(g.name)+'">'+esc(g.name)+(g.sched?'':' (не по расписанию)')+'</option>'}).join('');
  if(!show.length){roster=[];marks={};render();msg('В этот день по расписанию тренировок нет. Для дополнительной или перенесённой включите «Показать все группы».',true);return}
  if(show.some(function(g){return g.name==want}))$('grp').value=want;
  if(pre){setRoster(pre);return}
  loadRoster();
}
function loadGroups(want){
  var n=++reqN;
  msg('Загрузка…');$('res').innerHTML='';
  run('appAttInit',[pin,$('dt').value,want||$('grp').value,$('allg').checked],function(r){
    if(n!=reqN)return;
    showApp();allGroups=r.groups;
    if(!r.groups.length){$('grp').innerHTML='';roster=[];marks={};render();msg('В листе месяца нет групп.',true);return}
    fillGroups(r.group||want,r.roster);
  },function(m){
    if(n!=reqN)return;
    if(m.indexOf('код доступа')>=0)showLogin('Неверный код доступа');
    else{showApp();allGroups=[];$('grp').innerHTML='';roster=[];marks={};render();msg(m,true)}
  });
}
function setRoster(r){
  roster=r;marks={};var n=0;
  r.forEach(function(x){if(x.mark){marks[x.id]=x.mark;n++}});
  rosterFor=key();
  msg(n?'Отметки подтянуты из таблицы. Можно исправить и сохранить снова.':'');
  render();
}
function loadRoster(){
  var n=++reqN;
  msg('Загрузка списка…');render();
  run('appRoster',[pin,$('grp').value,$('dt').value],function(r){if(n==reqN)setRoster(r)},function(m){if(n==reqN)msg(m,true)});
}
function render(){
  var p=0,a=0,li='',mt='';
  roster.forEach(function(x,i){
    var s=marks[x.id]||'';if(s=='p')p++;if(s=='a')a++;mt+='<i class="'+s+'"></i>';
    li+='<li><span class="nm">'+esc(x.name)+'</span><div class="seg"><button class="p" aria-pressed="'+(s=='p')+'" data-i="'+i+'" data-v="p">Был</button><button class="a" aria-pressed="'+(s=='a')+'" data-i="'+i+'" data-v="a">Не был</button></div></li>';
  });
  var r=roster.length-p-a;$('list').innerHTML=li;$('meter').innerHTML=mt;
  $('st').innerHTML='<span><b>'+p+'</b> были</span><span><b>'+a+'</b> не были</span><span><b>'+r+'</b> осталось</span>';
  var stale=roster.length>0&&rosterFor!==key();
  var b=$('save');b.disabled=busy||stale||!roster.length||r>0;
  b.textContent=busy?'Сохраняю…':(stale?'Загрузка списка…':(r>0?'Осталось отметить: '+r:'Сохранить отметки'));
}
$('list').onclick=function(e){
  var t=e.target;if(!t.dataset||!t.dataset.v)return;
  var id=roster[t.dataset.i].id;
  if(marks[id]==t.dataset.v)delete marks[id];else marks[id]=t.dataset.v;
  $('res').innerHTML='';render();
};
$('all').onclick=function(){roster.forEach(function(x){if(!marks[x.id])marks[x.id]='p'});render()};
$('clr').onclick=function(){marks={};$('res').innerHTML='';render()};
$('grp').onchange=function(){$('res').innerHTML='';saveState();loadRoster()};
$('dt').onchange=function(){if(this.value){saveState();loadGroups()}};
$('allg').onchange=function(){saveState();fillGroups($('grp').value)};
$('save').onclick=function(){
  busy=true;render();
  var out=roster.map(function(x){return{id:x.id,name:x.name,present:marks[x.id]=='p'}});
  run('appSave',[pin,$('grp').value,$('dt').value,out],
    function(rep){busy=false;render();showResult(rep)},
    function(m){busy=false;render();msg(m,true)});
};
function showResult(rep){
  var bad=rep.results.filter(function(r){return r.result.indexOf('НЕ записано')==0}),ok=rep.results.length-bad.length;
  var h=(rep.dryRun?'<p><b>Пробный режим:</b> в таблицу ничего не записано.</p>':'')+'<p>Записано в лист: <b>'+ok+'</b> из '+rep.results.length+'</p>';
  if(bad.length)h+='<p class="err">Не удалось записать:</p><ul>'+bad.map(function(r){return'<li style="display:block;padding:6px 10px"><b>'+esc(r.name)+'</b><br>'+esc(r.result.replace('НЕ записано: ',''))+'</li>'}).join('')+'</ul>';
  $('res').innerHTML='<div class="res">'+h+'</div>';window.scrollTo(0,document.body.scrollHeight);
}
$('go').onclick=function(){pin=$('pin').value.trim();if(!pin)return;try{localStorage.setItem('kspin',pin)}catch(e){}loadGroups()};
$('dt').value=today();
var wantG=loadState();
try{pin=localStorage.getItem('kspin')||''}catch(e){}
if(pin)loadGroups(wantG);else showLogin('');
</script>
</body>
</html>
