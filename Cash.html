<!DOCTYPE html>
<html lang="ru">
<head>
<base target="_top">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Приём оплат</title>
<style>
:root{--bg:#F4F6F3;--card:#fff;--ink:#15211A;--mute:#5B6B61;--line:#DCE3DD;--g:#1E6B3C;--gi:#fff;--a:#B23A2B}
@media(prefers-color-scheme:dark){:root{--bg:#0F1712;--card:#17221B;--ink:#E8F0EA;--mute:#93A69A;--line:#26362C;--g:#4FAE74;--gi:#0B1410;--a:#E8806F}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding-bottom:40px}
.wrap{max-width:560px;margin:0 auto;padding:0 16px}
h1{font-size:22px;margin:16px 0 6px}h2{font-size:17px;margin:20px 0 6px}
input,select{font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px;min-height:44px;width:100%}
label{display:block;margin:10px 0 4px;color:var(--mute);font-size:14px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.row2>div{min-width:0}.row2 input,.row2 select{min-width:0;max-width:100%}
.row2 input[type=date]{-webkit-appearance:none;appearance:none;width:0;min-width:100%;max-width:100%;display:block;box-sizing:border-box}
button{font:inherit;cursor:pointer}
.btn{width:100%;min-height:46px;border:0;border-radius:12px;background:var(--g);color:var(--gi);font-weight:800;font-size:15px;margin-top:10px}
.btn:disabled{opacity:.5}
.btn.sec{background:var(--card);color:var(--ink);border:1px solid var(--line)}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.seg button{min-height:46px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--mute);font-weight:700}
.seg button[aria-pressed=true]{background:var(--g);border-color:var(--g);color:var(--gi)}
.prog,.res{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 14px;margin:10px 0;font-size:14px}
.prh{display:flex;justify-content:space-between;gap:8px;font-size:16px}
.sub{color:var(--mute);font-size:13px}
.ok{color:var(--color-success)}.err{color:var(--a)}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:8px 0}
.tile{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px}
.tile b{display:block;font-size:16px}.tile span{color:var(--mute);font-size:12px}
.msg{color:var(--mute);font-size:14px;min-height:20px;margin-top:8px}
/* UI-003 */
.srch{position:relative}.srch svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--mute);pointer-events:none}
.srch input{padding-left:40px}
.pcard{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 14px;margin:10px 0 0}
.pcard .av{flex:none;width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:var(--color-primary-subtle,var(--pb));color:var(--g);font-weight:800}
.pcard b{display:block;overflow-wrap:anywhere}.pcard .sub{margin:0}
.kinds{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin:12px 0 4px}
.kinds button{display:flex;align-items:center;gap:8px;min-height:48px;padding:8px 12px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);font-weight:700;font-size:14px;text-align:left}
.kinds button svg{flex:none;color:var(--g)}.kinds button span{min-width:0;flex:1;overflow-wrap:anywhere}
@media(max-width:380px){.kinds button{font-size:13px;padding:8px 8px;gap:6px}}.kinds .cnt{flex:none;min-width:22px;height:22px;padding:0 6px;border-radius:999px;background:var(--color-danger-subtle);color:var(--color-danger-strong);font-size:12px;display:inline-flex;align-items:center;justify-content:center}
.hint{display:flex;gap:10px;align-items:flex-start;background:var(--color-primary-subtle,var(--pb));color:var(--ink);border-radius:12px;padding:12px 14px;margin:12px 0;font-size:14px}
.hint svg{flex:none;color:var(--g);margin-top:1px}
.fd{display:flex;align-items:flex-start;gap:12px}.fd .l{flex:1;min-width:0}.fd .l b{overflow-wrap:anywhere}
.fd .amt{flex:none;font-weight:800;font-size:15px;white-space:nowrap;color:var(--color-success)}
.fd .amt.neg{color:var(--color-danger-strong)}.fd .amt.rev{color:var(--mute);text-decoration:line-through}
.res .cnl{min-height:44px}
h2{scroll-margin-top:12px}
</style>
</head>
<body>
<div id="login" class="wrap" hidden>
  <h1>Приём оплат</h1><label for="pin" class="ks-pinl">Введите код администратора</label>
  <input id="pin" type="password" autocomplete="off"><p id="lerr" class="err" role="alert"></p><button class="btn" id="go">Войти</button>
</div>
<div id="app" class="wrap ks-wide-w" hidden>
  <h1>Приём оплат</h1>
  <label for="pl">Игрок (введите ФИ и выберите из списка)</label>
  <div class="srch"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg><input id="pl" list="plist" autocomplete="off" type="search" placeholder="Поиск игрока…"></div><datalist id="plist"></datalist>
  <div id="pcard"></div>
  <div class="row2">
    <div><label>Месяц абонемента</label><select id="mon"></select></div>
    <div><label>Дата оплаты</label><input type="date" id="dt"></div>
  </div>
  <label>Способ оплаты</label>
  <div class="seg" id="meth"><button data-m="Наличные" aria-pressed="false">Наличные</button><button data-m="Перевод" aria-pressed="false">Перевод</button></div>
  <label>Комментарий</label><input id="cm" placeholder="необязательно">
  <div class="msg" id="msg" role="status"></div>
  <div id="kinds"></div>
  <div id="progs"></div>
  <h2>Внесено сегодня</h2>
  <div class="tiles" id="tot"></div>
  <div id="feed"></div>
</div>
<script>
var pin='',P=[],O=[],SUB=null,cur='',method='',eqErr='',IND=[],EXT=[],FEED=[];
function $(i){return document.getElementById(i)}
function run(fn,args,ok,fail){var r=google.script.run.withSuccessHandler(ok).withFailureHandler(function(e){fail(e&&e.message?e.message:String(e))});r[fn].apply(r,args)}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function money(n){return String(Math.round(n*100)/100).replace('.',',')+' ₾'}
function nn(s){return String(s).trim().toLowerCase()}
function today(){var d=new Date(),z=function(n){return(n<10?'0':'')+n};return d.getFullYear()+'-'+z(d.getMonth()+1)+'-'+z(d.getDate())}
function setMsg(t,bad){$('msg').textContent=t||'';$('msg').className='msg'+(bad?' err':'')}
function showLogin(t){$('app').hidden=true;$('login').hidden=false;$('lerr').textContent=t||''}
function fail(m){m=friendly_(m);if(/уже оплачен/.test(m)&&cur){$('login').hidden=true;$('app').hidden=false;setMsg(m,true);loadPlayer(cur,true);return}if(/код (администратора|доступа)/.test(m))showLogin('Неверный код доступа');else{$('login').hidden=true;$('app').hidden=false;setMsg(m,true)}}
function pid(v){var m=/\((KS-\d+)\)\s*$/.exec(v.trim());return m?m[1]:''}
function defMonth(ms,day){
  var d=new Date(),t=new Date(d.getFullYear(),d.getMonth()+(d.getDate()>=(day||22)?1:0),1);   // day — настройка subs.nextMonthDay
  var k=('0'+(t.getMonth()+1)).slice(-2)+'.'+String(t.getFullYear()).slice(-2);
  return ms.indexOf(k)>=0?k:ms[0];
}
function orders(cb){
  run('appEquipOrders',[pin],function(r){O=r.orders;eqErr='';cb&&cb()},function(m){O=[];eqErr=m;cb&&cb()});
}
function load(){
  $('dt').value=today();
  run('appAdminInit',[pin],function(d){
    P=d.players;$('login').hidden=true;$('app').hidden=false;if(!cur)hint();
    $('plist').innerHTML=P.filter(function(p){return p.status=='Активен'}).map(function(p){return'<option value="'+esc(p.name+' ('+p.id+')')+'">'}).join('');
  },fail);
  feed();orders();
}
function feed(){
  run('appTodayPayments',[pin],function(r){
    var t=r.totals,sum=t['Наличные']+t['Перевод']+t.other;
    $('tot').innerHTML='<div class="tile"><b>'+money(t['Наличные'])+'</b><span>наличные</span></div><div class="tile"><b>'+money(t['Перевод'])+'</b><span>перевод</span></div><div class="tile"><b>'+money(sum)+'</b><span>всего</span></div>';
    FEED=r.items;
    $('feed').innerHTML=r.items.length?r.items.map(function(x,i){
      var tag=x.neg?' <span class="sub">(отмена)</span>':(x.reversed?' <span class="sub">(отменён)</span>':'');
      var btn=x.canCancel?'<button class="btn sec cnl" data-i="'+i+'" data-src="'+x.src+'" data-row="'+x.row+'">Отменить оплату</button>':'';
      var cls=x.neg?' neg':(x.reversed?' rev':'');
      return'<div class="res"><div class="fd"><div class="l"><b>'+esc(x.name)+'</b>'+tag+'<div class="sub">'+esc(x.what+(x.kind?', '+x.kind:'')+(x.method?', '+x.method:''))+'</div></div>'
        +'<span class="amt'+cls+'">'+(x.neg?'−':'+')+money(Math.abs(x.amount))+'</span></div>'+btn+'</div>';
    }).join(''):'<p class="sub">Сегодня платежей через приложение пока нет.</p>';
  },function(m){$('feed').innerHTML='<p class="err">'+esc(m)+'</p>'});
}
var reqN=0;
function loadPlayer(id,keep){
  var n=++reqN;
  if(!keep){setMsg('Загрузка…');IND=[];EXT=[]}
  run('appPlayerSubs',[pin,id],function(r){
    if(n!=reqN)return;
    SUB=r;cur=id;if(!keep)setMsg('');
    var old=$('mon').value;
    $('mon').innerHTML=r.months.map(function(m){return'<option>'+m+'</option>'}).join('');
    if(!r.months.length){setMsg('В файле оплат нет листов месяцев.',true);return}
    $('mon').value=r.months.indexOf(old)>=0?old:defMonth(r.months,r.nextDay);
    run('appIndOfPlayer',[pin,id],function(x){if(n==reqN&&cur==id){IND=x;paint(true)}},function(){});
    loadExt(n);
    paint();
  },function(m){if(n==reqN)fail(m)});
}
// UI-003: карточка выбранного игрока, быстрый переход к виду оплаты, подсказка до выбора игрока
var KICON={sub:'<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/>',eq:'<path d="M8 3l-5 4 3 3 2-1v12h8V9l2 1 3-3-5-4c-.5 1.5-2 2.5-4 2.5S8.5 4.5 8 3z"/>',
  ind:'<circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/>',ext:'<path d="M12 3l2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1-4.4-4.3 6.1-.9z"/>'};
function kicon(k){return'<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'+KICON[k]+'</svg>'}
function hint(){
  $('pcard').innerHTML='';$('kinds').innerHTML='';
  $('progs').innerHTML='<div class="hint"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 7.5v.5"/></svg><span>Выберите игрока — появятся абонемент, экипировка, индивидуальные и дополнительные тренировки, которые можно оплатить.</span></div>';
}
function pcard(){
  var p=P.filter(function(x){return x.id==cur})[0];
  if(!p){$('pcard').innerHTML='';return}
  var ini=String(p.name).split(/\s+/).map(function(w){return w.charAt(0)}).join('').slice(0,2).toUpperCase();
  $('pcard').innerHTML='<div class="pcard"><span class="av" aria-hidden="true">'+esc(ini)+'</span><div style="min-width:0"><b>'+esc(p.name)+'</b><div class="sub">'+esc(p.id+' · '+p.group+(p.birth?' · '+String(p.birth).slice(-4)+' г.':''))+'</div></div></div>';
}
function kinds(c){
  var K=[['sub','Абонемент',c.sub],['eq','Экипировка',c.eq],['ind','Индивидуальные',c.ind],['ext','Дополнительные',c.ext]];
  $('kinds').innerHTML='<div class="sub" style="margin-top:12px">Перейти к оплате</div><div class="kinds">'+K.map(function(k){
    return'<button type="button" data-go="ps-'+k[0]+'">'+kicon(k[0])+'<span>'+k[1]+'</span>'+(k[2]?'<span class="cnt" aria-label="к оплате: '+k[2]+'">'+k[2]+'</span>':'')+'</button>'}).join('')+'</div>';
}
function paint(keepInputs){
  var saved={};
  if(keepInputs)[].forEach.call($('progs').querySelectorAll('.prog[data-g]'),function(bx){
    var a=bx.querySelector('.pa'),t=bx.querySelector('.ptype');
    if(a&&a.value!==a.defaultValue)saved[bx.dataset.g]={a:a.value,t:t?t.value:''};
  });
  var M=$('mon').value,gs=Object.keys(SUB.tariffs),h='<h2 id="ps-sub">Абонемент, '+esc(M)+'</h2>';
  if(!gs.length)h+='<p class="sub err">У игрока нет групп для абонемента.</p>';
  h+=gs.map(function(g){
    var it=SUB.items.filter(function(i){return i.month==M&&nn(i.group)==nn(g)})[0],T=ksTariff(SUB,M,g);
    var paid=it?it.paid:0,st=it?it.st:'unpaid',debt=it?it.debt:T;
    var chip=st=='paid'?'<span class="ok">'+(it.disc?'скидка':'оплачено')+'</span>':st=='partial'?'<span class="err">частично, долг '+money(debt)+'</span>':'<span class="err">не платил</span>';
    var f='<label>Сумма, ₾</label><input type="number" min="1" step="1" class="pa" value="'+(st=='paid'?'':debt)+'" data-debt="'+(st=='paid'?0:debt)+'">'
      +'<div class="pt" hidden><label>Сумма меньше остатка. Что это?</label><select class="ptype"><option value="">Выберите…</option><option value="Скидка">Скидка по договорённости (оплата принята)</option><option value="Частичный">Частичный платёж (останется долг)</option></select></div>'
      +'<button class="btn pay">Принять оплату</button>';
    return'<div class="prog" data-g="'+esc(g)+'"><div class="prh"><b>'+esc(g)+'</b>'+chip+'</div><div class="sub">внесено '+money(paid)+' из '+money(T)+(it?'':'; в листе месяца пока нет, будет добавлен')+'</div>'+f+'</div>';
  }).join('');
  h+='<h2 id="ps-eq">Экипировка</h2>';
  var eo=O.filter(function(o){return o.id==cur&&(o.kit||o.sum)});
  if(eqErr)h+='<p class="sub err">'+esc(eqErr)+'</p>';
  else if(!eo.length)h+='<p class="sub">Заказов экипировки нет.</p>';
  h+=eo.map(function(o){
    var chip=o.debt>0?'<span class="err">долг '+money(o.debt)+'</span>':'<span class="ok">оплачено</span>';
    var f=o.debt>0?'<label>Сумма, ₾</label><input type="number" min="1" step="1" class="ea" value="'+o.debt+'">'
      +'<button class="btn epay" data-row="'+o.row+'">Принять оплату</button>':'';
    return'<div class="prog"><div class="prh"><b>'+esc(o.kit||'Комплект не указан')+'</b>'+chip+'</div><div class="sub">сумма '+money(o.sum)+', оплачено '+money(o.paid)+(o.size?', размер '+esc(o.size):'')+'</div>'+f+'</div>';
  }).join('');
  h+='<h2 id="ps-ind">Индивидуальные и вратари</h2>';
  if(!IND.length)h+='<p class="sub">Записей на индивидуальные нет.</p>';
  h+=IND.map(function(x,i){
    var chip=x.paid?'<span class="ok">оплачено</span>':'<span class="err">'+(x.past?'долг ':'')+money(x.price)+'</span>';
    var f=x.paid?'':'<button class="btn ipay" data-i="'+i+'">Принять оплату</button>';
    return'<div class="prog"><div class="prh"><b>'+esc(x.label)+'</b>'+chip+'</div>'+f+'</div>';
  }).join('');
  h+='<h2 id="ps-ext">Дополнительные тренировки</h2>';
  if(!EXT.length)h+='<p class="sub">Записей на дополнительные нет.</p>';
  h+=EXT.map(function(x,i){
    var chip=x.paid?'<span class="ok">оплачено</span>':'<span class="err">'+(x.price>0?money(x.price):'сумма не задана')+'</span>';
    var f=x.paid?'':(x.price>0?'':'<label>Сумма, ₾</label><input id="xa'+i+'" type="number" inputmode="numeric" min="1" step="1">')+'<button class="btn xpay" data-i="'+i+'">Принять оплату</button>';
    return'<div class="prog"><div class="prh"><b>'+esc(x.label)+'</b>'+chip+'</div>'+f+'</div>';
  }).join('');
  $('progs').innerHTML=h;
  pcard();
  kinds({sub:gs.filter(function(g){var it=SUB.items.filter(function(i){return i.month==M&&nn(i.group)==nn(g)})[0];return!it||it.st!='paid'}).length,
    eq:eqErr?0:eo.filter(function(o){return o.debt>0}).length,ind:IND.filter(function(x){return!x.paid}).length,ext:EXT.filter(function(x){return!x.paid}).length});
  [].forEach.call($('progs').querySelectorAll('.prog[data-g]'),function(bx){
    var k=saved[bx.dataset.g],a=bx.querySelector('.pa');
    if(k&&a){a.value=k.a;bx.querySelector('.ptype').value=k.t;bx.querySelector('.pt').hidden=Number(a.value)>=Number(a.dataset.debt)}
  });
}
// Способ оплаты не переносится на другого игрока: при смене игрока выбор сбрасывается
function resetMethod(){method='';[].forEach.call($('meth').children,function(x){x.setAttribute('aria-pressed','false')})}
$('pl').oninput=function(){var id=pid(this.value);if(id&&id!=cur){resetMethod();loadPlayer(id)}if(!this.value){reqN++;cur='';SUB=null;resetMethod();hint()}};
$('kinds').onclick=function(e){var b=e.target.closest('[data-go]');if(!b)return;var h=$(b.dataset.go);if(!h)return;
  var rm=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;h.scrollIntoView({behavior:rm?'auto':'smooth',block:'start'});
  var f=h.nextElementSibling&&h.nextElementSibling.querySelector?h.nextElementSibling.querySelector('input,button'):null;if(f)try{f.focus({preventScroll:true})}catch(x){}};
$('mon').onchange=function(){if(SUB)paint()};
$('meth').onclick=function(e){var b=e.target.closest('button');if(!b)return;method=b.dataset.m;[].forEach.call(this.children,function(x){x.setAttribute('aria-pressed',x==b)})};
// Сводка для диалога подтверждения: общие строки экрана (способ, дата, комментарий)
function payRows(who,amt,what,extra){
  return [['Игрок',who],['Сумма',ksMoney(amt)],['За что',what]].concat(extra||[]).concat([['Способ',method],['Дата',ksDateIfNotToday($('dt').value)],['Комментарий',$('cm').value.trim()]]);
}
function typeRow(type,left){
  if(!(left>0))return null; // сумма не меньше остатка: тип не используется, сервер пишет «Оплата»
  return type=='Частичный'?['Тип','Частичный платёж, останется долг '+ksMoney(left)]:type=='Скидка'?['Тип','Скидка по договорённости, оплата принята']:null;
}
$('progs').oninput=function(e){
  if(!e.target.classList.contains('pa'))return;
  e.target.closest('.prog').querySelector('.pt').hidden=Number(e.target.value)>=Number(e.target.dataset.debt);
};
function done(r,text){
  if(r.dryRun){setMsg('Пробный режим: в таблицу ничего не записано.');return}
  setMsg(text);$('cm').value='';orders(function(){if(SUB)paint()});loadPlayer(cur,true);feed();
}
$('progs').onclick=function(e){
  var b=e.target.closest('button');if(!b)return;
  var pl=P.filter(function(p){return p.id==cur})[0],who=pl?pl.name:'';
  if(b.classList.contains('pay')){
    var box=b.closest('.prog'),a=box.querySelector('.pa'),amt=Number(a.value),type=box.querySelector('.ptype').value,g=box.dataset.g,M=$('mon').value;
    var left=Number(a.dataset.debt)||0,id=cur;
    if(!(amt>0)){setMsg('Введите сумму больше нуля.',true);return}
    if(!method){setMsg('Выберите способ оплаты: наличные или перевод.',true);return}
    if(amt<left&&!type){setMsg('Выберите тип: скидка или частичный платёж.',true);return}
    // Переплата допускается сервером: предупреждаем, но не запрещаем
    var it=SUB.items.filter(function(i){return i.month==M&&nn(i.group)==nn(g)})[0],T=ksTariff(SUB,M,g),paidNow=it?it.paid:0,disc=!!(it&&it.disc),warn=[];
    // Переплата — когда итог превышает тариф (для месяца со скидкой остаток 0, но это ещё не переплата)
    var over=ksOverpay(paidNow+amt,T);
    // Месяц, закрытый скидкой: доплата разрешена сервером, скидка в журнале не меняется
    if(disc)warn.push({title:'Месяц закрыт скидкой',text:'Доплата за этот месяц будет записана как новый платёж. Скидка останется без изменений.'});
    if(over&&left>0)warn.push('Сумма больше остатка на '+ksMoney(over)+'. Вся сумма будет записана как оплата абонемента за '+M+': внесено будет '+ksMoney(paidNow+amt)+' из '+ksMoney(T)+'.');
    else if(over)warn.push((disc?'Сумма больше тарифа':'Абонемент за '+M+' уже оплачен')+'. Сумма '+ksMoney(amt)+' будет записана как дополнительная оплата: внесено будет '+ksMoney(paidNow+amt)+' из '+ksMoney(T)+'.');
    var mt=method,dt=$('dt').value,cm=$('cm').value;
    ksConfirm({title:'Подтвердить оплату?',ok:'Подтвердить оплату',warn:warn,
      rows:payRows(who,amt,'Абонемент, '+M+', '+g,[amt<left?typeRow(type,left-amt):null]),
      run:function(ok,bad){
        run('appSubPay',[pin,M,g,id,amt,type,dt,cm,mt],function(r){ok();done(r,'Внесено: '+who+', '+money(amt)+' (абонемент '+M+', '+g+', '+mt+').')},bad);
      }});
  }else if(b.classList.contains('epay')){
    var ord=O.filter(function(o){return o.id==cur&&String(o.row)==b.dataset.row})[0]||{};
    var amt2=Number(b.closest('.prog').querySelector('.ea').value),id2=cur,row=Number(b.dataset.row);
    if(!(amt2>0)){setMsg('Введите сумму больше нуля.',true);return}
    if(!method){setMsg('Выберите способ оплаты: наличные или перевод.',true);return}
    var over2=ksOverpay(amt2,ord.debt),mt2=method,dt2=$('dt').value,cm2=$('cm').value;
    ksConfirm({title:'Подтвердить оплату?',ok:'Подтвердить оплату',
      warn:over2?'Сумма больше остатка на '+ksMoney(over2)+'. Платёж будет записан полностью.':'',
      rows:payRows(who,amt2,'Экипировка: '+(ord.kit||'комплект не указан')),
      run:function(ok,bad){
        run('appAddPayment',[pin,id2,row,amt2,dt2,cm2,mt2],function(r){ok();done(r,'Внесено: '+who+', '+money(amt2)+' (экипировка, '+mt2+').')},bad);
      }});
  }
};
$('progs').addEventListener('click',function(e){
  var b=e.target.closest('.ipay');if(!b)return;
  var x=IND[b.dataset.i],pl=P.filter(function(p){return p.id==cur})[0],who=pl?pl.name:'',id=cur;
  if(!method){setMsg('Выберите способ оплаты: наличные или перевод.',true);return}
  var mt=method;
  ksConfirm({title:'Подтвердить оплату?',ok:'Подтвердить оплату',
    rows:[['Игрок',who],['Сумма',ksMoney(x.price)],['За что',x.label],['Способ',mt]],
    run:function(ok,bad){
      run('appIndPay',[pin,x.id,x.name,mt],function(){
        ok();setMsg('Внесено: '+who+', '+money(x.price)+' ('+x.label+', '+mt+').');feed();
        run('appIndOfPlayer',[pin,id],function(r){if(cur==id){IND=r;paint(true)}},function(){});
      },bad);
    }});
});
function loadExt(n){
  var id=cur;
  run('appExtraOfPlayer',[pin,id],function(r){if(cur==id&&(n===undefined||n==reqN)){EXT=r;paint(true)}},function(){});
}
$('progs').addEventListener('click',function(e){
  var b=e.target.closest('.xpay');if(!b)return;
  var i=b.getAttribute('data-i'),x=EXT[i],pl=P.filter(function(p){return p.id==cur})[0],who=pl?pl.name:'';
  if(!x)return;
  if(!method){setMsg('Выберите способ оплаты: наличные или перевод.',true);return}
  var am='';
  if(!(x.price>0)){
    var inp=document.getElementById('xa'+i);
    am=inp?inp.value:'';
    if(!(Number(am)>0)){setMsg('Введите сумму оплаты.',true);return}
  }
  var mt=method;
  ksConfirm({title:'Подтвердить оплату?',ok:'Подтвердить оплату',
    rows:[['Игрок',who],['Сумма',ksMoney(x.price>0?x.price:am)],['За что',x.label],['Способ',mt]],
    run:function(ok,bad){
      run('appExtraPay',[pin,x.id,x.name,mt,am],function(){
        ok();setMsg('Внесено: '+who+' ('+x.label+', '+mt+').');feed();loadExt();
      },bad);
    }});
});
$('feed').onclick=function(e){
  var b=e.target.closest('.cnl');if(!b)return;
  var x=FEED[b.dataset.i]||{};
  ksConfirm({title:'Отменить оплату?',ok:'Отменить оплату',danger:true,
    text:'В журнале появится запись об отмене, сумма платежа перестанет учитываться.',
    rows:[['Игрок',x.name],['Сумма',x.amount!=null?ksMoney(x.amount):''],['За что',x.what],['Способ',x.method]],
    run:function(ok,bad){
      run('appCancelPayment',[pin,b.dataset.src,Number(b.dataset.row)],function(r){
        ok();
        if(r.dryRun){setMsg('Пробный режим: в таблицу ничего не записано.');return}
        setMsg('Платёж отменён.');feed();orders(function(){if(SUB)paint()});if(cur)loadPlayer(cur,true);
      },bad);
    }});
};
$('go').onclick=function(){pin=$('pin').value.trim();if(!pin)return;try{localStorage.setItem('kspin',pin)}catch(e){}load()};
try{pin=localStorage.getItem('kspin')||''}catch(e){}
if(pin)load();else showLogin('');
</script>
