<!DOCTYPE html>
<html lang="ru">
<head>
<base target="_top">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Экипировка</title>
<style>
:root{--bg:#F4F6F3;--card:#fff;--ink:#15211A;--mute:#5B6B61;--line:#DCE3DD;--g:#1E6B3C;--gi:#fff;--a:#B23A2B}
@media(prefers-color-scheme:dark){:root{--bg:#0F1712;--card:#17221B;--ink:#E8F0EA;--mute:#93A69A;--line:#26362C;--g:#4FAE74;--gi:#0B1410;--a:#E8806F}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding-bottom:40px}
.wrap{max-width:560px;margin:0 auto;padding:0 16px}
h1{font-size:22px;margin:16px 0 10px}
input,select{font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px;min-height:44px;width:100%}
input[type=date]{-webkit-appearance:none;appearance:none;width:0;min-width:100%;max-width:100%;display:block;box-sizing:border-box}
label{display:block;margin:12px 0 4px;color:var(--mute);font-size:14px}
.chk{display:flex;gap:8px;align-items:center;min-height:44px}.chk input{width:22px;height:22px;min-height:0;flex:none}
.kits{display:flex;flex-direction:column;gap:4px;margin:4px 0 8px}.kit{display:flex;gap:8px;align-items:center;font-size:14px;color:var(--ink);min-height:44px}.kit input{width:22px;height:22px;min-height:0;margin:0;flex:none} /* DS-015: цель касания ≥ 44 px */
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
button{font:inherit;cursor:pointer}
.btn{width:100%;min-height:48px;border:0;border-radius:12px;background:var(--g);color:var(--gi);font-weight:800;font-size:16px;margin-top:12px}
.btn.sec{background:none;color:var(--g);border:1px solid var(--line)}
.btn:disabled{opacity:.5}
.acts{display:grid;grid-template-columns:1fr 1fr;gap:8px}.acts .btn{min-height:42px;font-size:14px;margin-top:8px}
.tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin:12px 0}
.tile{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px}
.tile b{display:block;font-size:18px}.tile span{color:var(--mute);font-size:12px}
details{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 14px;margin-bottom:8px}
summary{cursor:pointer;list-style:none;min-height:44px;display:flex;flex-direction:column;justify-content:center} /* цель нажатия ≥ 44 px */summary::-webkit-details-marker{display:none}
.top{display:flex;justify-content:space-between;gap:8px;font-weight:700}
.sub{color:var(--mute);font-size:13px}
.ok{color:var(--color-success)}.err{color:var(--a)}
.ord{border-top:1px solid var(--line);margin-top:8px;padding-top:8px;font-size:14px}
.msg{color:var(--mute);font-size:14px;min-height:20px;margin-top:8px}
</style>
</head>
<body>
<datalist id="plist"></datalist>
<div id="login" class="wrap" hidden>
  <h1>Экипировка</h1><label for="pin" class="ks-pinl">Введите код администратора</label>
  <input id="pin" type="password" autocomplete="off"><p id="lerr" class="err" role="alert"></p><button class="btn" id="go">Войти</button>
</div>
<div id="app" class="wrap ks-wide-w" hidden>
  <h1>Экипировка</h1>
  <form class="qform" onsubmit="event.preventDefault();this.querySelector('input').blur()" style="margin:0;display:block"><input id="q" enterkeyhint="done" onkeydown="if(event.key==='Enter')this.blur()" list="qlist" autocomplete="off" placeholder="Поиск: ФИ или ID"><datalist id="qlist"></datalist></form>
  <div class="row2">
    <select id="fs" aria-label="Показать">
      <option value="all">Все игроки</option><option value="ordered">Заказали форму</option><option value="not">Не заказывали</option>
      <option value="paid">Оплачено полностью</option><option value="debt">Есть долг</option><option value="zero">Ничего не оплачено</option>
      <option value="miss">Не заполнено или повтор номера</option>
      <option value="unl">Заказы без привязки</option>
    </select>
    <select id="fg" aria-label="Группа"></select>
  </div>
  <details id="fk" style="margin-top:8px"><summary>Товар: все</summary><div id="fkf" class="kits"></div></details>
  <select id="fl" aria-label="Локация" style="margin-top:8px">
    <option value="">Все локации: сначала красный парк</option><option value="red">Только красный парк</option>
    <option value="oth">Только ортачала и исани</option><option value="none">Без локации в реестре</option>
  </select>
  <button class="btn" id="new">+ Новый заказ</button>
  <div class="tiles" id="sum"></div>
  <p class="sub" id="fileSum"></p>
  <div class="msg" id="msg" role="status"></div>
  <div id="list"></div>
</div>
<div id="form" class="wrap" hidden>
  <h1>Новый заказ</h1>
  <label>Игрок (введите ФИ или ID и выберите из списка)</label>
  <input id="fpl" list="plist" autocomplete="off">
  <label>Позиции заказа</label><div id="fkits" class="kits"></div><div class="msg" id="fbundle"></div>
  <label>Сумма заказа, ₾</label><input id="fsum" type="number" min="0" step="1">
  <label>Размер</label><select id="fsizeSel" hidden></select><input id="fsize" placeholder="например, 140 или майка - 164, шорты - M">
  <label>Надпись</label><input id="finscr">
  <label>Номер (несколько вариантов через /)</label><input id="fnum">
  <label class="chk"><input type="checkbox" id="finst"> Рассрочка</label>
  <label>Оплачено сейчас, ₾</label><input id="fpaid" type="number" min="0" step="1" value="0">
  <div id="fmrow" hidden><label>Способ оплаты</label><select id="fmt"><option value="">Выберите…</option><option>Наличные</option><option>Перевод</option></select></div>
  <label>Дата заказа</label><input id="fdate" type="date">
  <div class="msg err" id="fmsg"></div>
  <button class="btn" id="fsave">Добавить заказ</button>
  <button class="btn sec" id="fcancel">Отмена</button>
</div>
<script>
var pin='',P=[],O=[],UNL=[],PR={},SZ={},DC=null,FL={},flash='';
function $(i){return document.getElementById(i)}
function run(fn,args,ok,fail){var r=google.script.run.withSuccessHandler(ok).withFailureHandler(function(e){fail(e&&e.message?e.message:String(e))});r[fn].apply(r,args)}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function money(n){return String(Math.round(n*100)/100).replace('.',',')+' ₾'}
function nn(s){return String(s).trim().toLowerCase()}
function today(){var d=new Date(),z=function(n){return(n<10?'0':'')+n};return d.getFullYear()+'-'+z(d.getMonth()+1)+'-'+z(d.getDate())}
function setMsg(t,bad){$('msg').textContent=t||'';$('msg').className='msg'+(bad?' err':'')}
function fmsg(t,bad){$('fmsg').textContent=t||'';$('fmsg').className='msg'+(bad?' err':'')}
function showLogin(t){$('app').hidden=true;$('form').hidden=true;$('login').hidden=false;$('lerr').textContent=t||''}
function fail(m){if(m.indexOf('код администратора')>=0)showLogin('Неверный код администратора');else{$('login').hidden=true;$('app').hidden=false;setMsg(m,true)}}
function load(){
  setMsg('Загрузка…');
  var got=0,pd=null,rd=null,failed=false;
  function bad(m){if(failed)return;failed=true;fail(m)}
  function done(){
    if(failed||++got<2)return;
    P=pd.players;
    $('plist').innerHTML=P.filter(function(p){return p.status=='Активен'}).map(function(p){return'<option value="'+esc(p.name+' ('+p.id+')')+'">'}).join('');
    $('qlist').innerHTML=P.filter(function(p){return p.status=='Активен'}).map(function(p){return'<option value="'+esc(p.name)+'">'+esc(p.id+' · '+p.group)+'</option>'}).join('');
    O=rd.orders;UNL=rd.unl;PR=rd.prices;SZ=rd.sizes||{};DC=rd.disc||null;FL=rd.flags||{};
    $('login').hidden=true;$('form').hidden=true;$('app').hidden=false;
    fillGroups();show();
  }
  run('appAdminInit',[pin],function(d){pd=d;done()},bad);
  run('appEquipOrders',[pin],function(r){rd=r;done()},bad);
}
function fillGroups(){
  var g=[],v=$('fg').value;
  P.forEach(function(p){[p.group].concat(p.extras).forEach(function(x){if(x&&g.indexOf(x)<0)g.push(x)})});
  $('fg').innerHTML='<option value="">Все группы</option>'+g.map(function(x){return'<option>'+esc(x)+'</option>'}).join('');
  $('fg').value=v;
}
// Локация из реестра: красный парк, ортачала + исани (одна категория), остальные
function locBucket(l){var s=nn(l||'');if(!s)return'none';if(/красн|krasn/.test(s))return'red';if(/ортач|исан|ortach|isan/.test(s))return'oth';return'rest'}
var LOC_ORD={red:0,oth:1,rest:2,none:3};
// Обязательные данные заказа (для любого комплекта): размер, номер, надпись. Номер уникален внутри точной группы (U13-A, U13-B и U13-C — отдельно).
// Надпись и номер нужны, если их требует хотя бы одна позиция заказа (флаги каталога «Надпись», «Номер»).
// Позиция не из каталога — нужны оба.
function missOf(o){
  var parts=String(o.kit||'').split(' + ').map(nn).filter(Boolean);
  var need=function(f){return parts.some(function(x){var c=FL[x];return!c||c[f]})};
  var socksOnly=!need('num'),trainOnly=!need('inscr');
  var m=[];
  if(!o.kit)m.push('комплект');
  if(!(o.sum>0))m.push('сумма');
  if(!String(o.size||'').trim())m.push('размер');
  if(!socksOnly&&!String(o.num||'').trim())m.push('номер');
  if(!trainOnly&&!String(o.inscr||'').trim())m.push('надпись');
  return m;
}
var DUP={};
// Номера через запятую или «/»: «9,19» даёт отдельные номера 9 и 19
function numToks(s){return String(s||'').split(/[\/,]/).map(function(x){return nn(x)}).filter(Boolean)}
// Где номер должен быть уникален: U10-A и U10-B играют вместе (весь U10), U13-A/B/C — отдельно
function catOf(g){g=String(g||'').trim();if(/^U13-[BC]$/i.test(g))return'U13-B/C';if(/^U13/i.test(g))return g;return g.replace(/-[A-Za-z0-9]+$/,'')}
// Какие именно номера заказа повторяются в категории игрока
function dupNums(o,p){if(!p)return[];return numToks(o.num).filter(function(x){return Object.keys(DUP[catOf(p.group)+'|'+x]||{}).length>1})}
function isDup(o,p){return dupNums(o,p).length>0}
function rows(){
  var by={};
  O.forEach(function(o){if(!o.id)return;(by[o.id]=by[o.id]||[]).push(o)});
  return P.filter(function(p){return p.status=='Активен'||by[p.id]}).map(function(p){
    var os=by[p.id]||[],s=0,pd=0;os.forEach(function(o){s+=o.sum;pd+=o.paid});
    return{p:p,os:os,sum:s,paid:pd,debt:Math.max(s-pd,0)};
  });
}
var F={all:function(){return true},ordered:function(r){return r.os.length>0},not:function(r){return!r.os.length},
  paid:function(r){return r.os.length>0&&r.sum>0&&r.debt==0},debt:function(r){return r.debt>0},zero:function(r){return r.sum>0&&r.paid==0},miss:function(r){return r.os.some(function(o){return missOf(o).length||isDup(o,r.p)})}};
function tile(t,v,bad){return'<div class="tile"><b'+(bad?' class="err"':'')+'>'+v+'</b><span>'+t+'</span></div>'}
function relForm(label,withUnlink,row){
  return'<div class="acts"><button class="btn sec rl">'+label+'</button>'+(withUnlink?'<button class="btn sec ul" data-row="'+row+'">Отвязать</button>':'<span></span>')+'</div>'
    +'<div class="rlf" hidden><input class="rpl" list="plist" placeholder="Игрок: ФИ или ID" autocomplete="off" style="margin-top:8px">'
    +'<label class="chk"><input type="checkbox" class="rfix" checked> Привести ФИ в заказе к написанию из реестра</label>'
    +'<button class="btn rok" data-row="'+row+'">Сохранить привязку</button><div class="msg err rm"></div></div>';
}
function payForm(o){
  return'<button class="btn pay" style="margin-top:8px">Принять оплату</button>'
    +'<div class="pf" hidden><label>Сумма, ₾ (долг '+money(o.debt)+')</label><input class="pam" type="number" min="0" step="1" value="'+o.debt+'">'
    +'<label>Способ оплаты</label><select class="pmt"><option value="">Выберите…</option><option>Наличные</option><option>Перевод</option></select>'
    +'<label>Дата</label><input class="pdt" type="date" value="'+today()+'">'
    +'<label>Комментарий</label><input class="pcm">'
    +'<button class="btn pok" data-row="'+o.row+'" data-id="'+esc(o.id)+'">Принять оплату</button><div class="msg err pm"></div></div>';
}
function payOrder(b,ord){
  var pm=ord.querySelector('.pm'),amt=Number(ord.querySelector('.pam').value),mt=ord.querySelector('.pmt').value;
  if(!(amt>0)){pm.textContent='Введите сумму больше нуля';return}
  if(!mt){pm.textContent='Выберите способ оплаты';return}
  pm.textContent='';
  var row=Number(b.dataset.row),id=b.dataset.id,dt=ord.querySelector('.pdt').value,cm=ord.querySelector('.pcm').value.trim();
  var o=orderByRow(row)||{},pl=P.filter(function(x){return x.id==id})[0],over=ksOverpay(amt,o.debt);
  ksConfirm({title:'Подтвердить оплату?',ok:'Подтвердить оплату',
    warn:over?'Сумма больше остатка на '+ksMoney(over)+'. Платёж будет записан полностью.':'',
    rows:[['Игрок',pl?pl.name:o.oname],['Сумма',ksMoney(amt)],['За что','Экипировка: '+(o.kit||'комплект не указан')],['Способ',mt],['Дата',ksDateIfNotToday(dt)],['Комментарий',cm]],
    run:function(ok,bad){
      run('appAddPayment',[pin,id,row,amt,dt,cm,mt],function(r){
        ok();flash=(r.dryRun?'Пробный режим: в таблицу ничего не записано. ':'')+'Оплата принята: '+money(amt)+' ('+mt+'). ';
        load();
      },bad);
    }});
}
function orderByRow(row){return O.concat(UNL).filter(function(o){return Number(o.row)===Number(row)})[0]}
function playerName(id){var p=P.filter(function(x){return x.id==id})[0];return p?p.name:''}
function kitsOf(k){return String(k||'').split(' + ').map(function(x){return x.trim()}).filter(Boolean)}
function orderHtml(o,p,linked){
  var prob=[];var mi=missOf(o);if(mi.length)prob.push('не заполнено: '+mi.join(', '));if(isDup(o,p))prob.push((dupNums(o,p).length>1?'номера ':'номер ')+dupNums(o,p).join(', ')+' повторяется в '+catOf(p.group));
  return'<div class="ord"><b>'+esc(o.kit||'Комплект не указан')+'</b>'+(o.inst?' (рассрочка)':'')+(o.no?'<span class="sub"> · заказ №'+o.no+'</span>':'')
    +(prob.length?'<div class="sub err">'+esc(prob.join('; '))+'</div>':'')
    +(p&&nn(o.oname)!=nn(p.name)?'<div class="sub err">В файле заказа записано: '+esc(o.oname)+'</div>':'')
    +'<div class="sub">Размер: '+esc(o.size||'не указан')+'; надпись: '+esc(o.inscr||'—')+'; номер: '+esc(o.num||'—')+'</div>'
    +'<div>Сумма '+money(o.sum)+', оплачено '+money(o.paid)+', долг '+money(o.debt)+'</div>'
    +(linked&&o.debt>0?payForm(o):'')
    +'<button class="btn sec ed" style="margin-top:8px">Изменить заказ</button>'
    +'<button class="btn sec delo" data-row="'+o.row+'" style="margin-top:8px">Удалить заказ</button><div class="msg err dm"></div>'
    +'<div class="edf" hidden><label>Комплект</label><div class="ekits">'+Object.keys(PR).map(function(k){return'<label class="kit"><input type="checkbox" class="ekit" value="'+esc(k)+'"'+(kitsOf(o.kit).indexOf(k)>=0?' checked':'')+'> '+esc(k)+'</label>'}).join('')+'</div><div class="sub esum" aria-live="polite"></div>'
    +'<label>Размер</label><input class="esize" value="'+esc(o.size||'')+'">'
    +'<label>Надпись</label><input class="einscr" value="'+esc(o.inscr||'')+'">'
    +'<label>Номер</label><input class="enum" value="'+esc(o.num||'')+'">'
    +'<label class="chk"><input type="checkbox" class="einst"'+(o.inst?' checked':'')+'> Рассрочка</label>'
    +'<button class="btn eok" data-row="'+o.row+'">Сохранить заказ</button><div class="msg err em"></div></div>'
    +relForm(linked?'Сменить игрока':'Привязать к игроку',linked,o.row)+'</div>';
}
function card(r){
  var b=!r.os.length?'<span class="sub">не заказывал</span>':(r.sum<=0?'<span class="err">сумма не указана</span>':(r.debt>0?'<span class="err">долг '+money(r.debt)+'</span>':'<span class="ok">оплачено</span>'));
  var kits=r.os.map(function(o){return o.kit||'без комплекта'}).join(', ');
  return'<details><summary><div class="top"><span>'+esc(r.p.name)+'</span>'+b+'</div><div class="sub">'+esc(r.p.group+(kits?' / '+kits:''))+'</div></summary>'
    +(r.os.map(function(o){return orderHtml(o,r.p,true)}).join('')||'<div class="ord sub">Заказов нет.</div>')+'</details>';
}
function ucard(o){
  return'<details open><summary><div class="top"><span>'+esc(o.oname)+'</span><span class="err">не привязан</span></div><div class="sub">строка '+o.row+', '+esc(o.kit||'без комплекта')+'</div></summary>'+orderHtml(o,null,false)+'</details>';
}
function show(){
  var q=nn($('q').value),g=$('fg').value,fv=$('fs').value;
  // Итог по всему файлу экипировки (все заказы, и с привязкой, и без): совпадает с итогами в таблице
  var PM={};P.forEach(function(p){PM[p.id]=p});
  DUP={};O.forEach(function(o){var p=PM[o.id];if(!p)return;numToks(o.num).forEach(function(x){var k=catOf(p.group)+'|'+x;(DUP[k]=DUP[k]||{})[o.id]=1})});
  var AS=0,AP=0,AD=0,AA=O.concat(UNL),NP=0;
  var UA=0,UP=0,UD=0;UNL.forEach(function(o){UA+=o.sum;UP+=o.paid;UD+=o.debt});
  AA.forEach(function(o){AS+=o.sum;AP+=o.paid;AD+=o.debt;if(missOf(o).length||isDup(o,PM[o.id]))NP++});
  $('fileSum').textContent='Весь файл: заказов '+AA.length+', заказано '+money(AS)+', оплачено '+money(AP)+', долг '+money(AD)+'. Из них без привязки к игроку ('+UNL.length+' заказ., '+money(UA)+') в списке игроков не показываются: плашки выше считают только игроков. Заказов с незаполненными данными или повтором номера: '+NP+'. Фильтры итог не меняют.';
  if(fv=='unl'){
    var u=UNL.filter(function(o){return!q||nn(o.oname).indexOf(q)>=0});
    var S0=0;u.forEach(function(o){S0+=o.sum});
    $('sum').innerHTML=tile('заказов без привязки',u.length)+tile('на сумму',money(S0));
    setMsg(flash+(u.length?'Выберите игрока и нажмите «Привязать к игроку».':'Все заказы привязаны.'));flash='';
    $('list').innerHTML=u.map(ucard).join('')||(UNL.length?ksEmpty({icon:'search',title:'Никого не нашли',text:'Измените поиск.'}):ksEmpty({icon:'box',title:'Все заказы привязаны',text:'Заказов без привязки к игроку нет.'}));return;
  }
  var f=F[fv],lv=$('fl').value;
  if(!$('fkf').dataset.init&&Object.keys(PR).length){
    $('fkf').innerHTML=Object.keys(PR).map(function(k){return'<label class="kit"><input type="checkbox" class="fkc" value="'+esc(k)+'"> '+esc(k)+'</label>'}).join('');
    $('fkf').dataset.init='1';
    $('fkf').onchange=function(){show()};
  }
  var kits=[].map.call(document.querySelectorAll('.fkc:checked'),function(c){return c.value});
  $('fk').querySelector('summary').textContent=kits.length?'Товар: выбрано '+kits.length:'Товар: все';
  var a=rows().filter(function(r){
    if(!f(r))return false;
    if(kits.length&&!r.os.some(function(o){return kitsOf(o.kit).some(function(k){return kits.indexOf(k)>=0})}))return false;
    if(lv&&locBucket(r.p.loc)!=lv)return false;
    if(g&&r.p.group!=g&&r.p.extras.indexOf(g)<0)return false;
    return !q||(r.p.name+' '+r.p.id).toLowerCase().indexOf(q)>=0;
  });
  // Порядок: сначала красный парк, потом ортачала и исани, затем остальные; внутри категории по реестру
  a=a.map(function(r,i){return{r:r,i:i}}).sort(function(x,y){
    return (LOC_ORD[locBucket(x.r.p.loc)]-LOC_ORD[locBucket(y.r.p.loc)])||(x.i-y.i)}).map(function(x){return x.r});
  var S=0,Pd=0,Dt=0;a.forEach(function(r){S+=r.sum;Pd+=r.paid;Dt+=r.debt});
  $('sum').innerHTML=tile('игроков в списке',a.length)+tile('заказано',money(S))+tile('оплачено',money(Pd))+tile('долг',money(Dt),Dt>0);
  setMsg(flash+(UNL.length?'Заказов без привязки: '+UNL.length+' (фильтр «Заказы без привязки»).':''));flash='';
  $('list').innerHTML=a.slice(0,150).map(card).join('')+(a.length>150?'<p class="sub">Показаны первые 150, уточните поиск.</p>':'');
  // UI-010: пустые состояния — заказов нет совсем / по фильтрам никого
  if(!a.length){
    var noOrd=!O.length&&!UNL.length&&!q&&fv!='not';
    $('list').innerHTML=!P.length?ksEmpty({icon:'users',title:'Нет игроков',text:'Добавьте игроков в реестр в разделе «Игроки».'})
      :noOrd?ksEmpty({icon:'box',title:'Заказов пока нет',text:'Новый заказ добавляется кнопкой «Новый заказ».',btn:'Новый заказ',id:'enew'})
      :ksEmpty({icon:'search',title:'Никого не нашли',text:'Измените поиск или фильтры.',btn:'Сбросить фильтры',id:'ereset'});
  }
}
function pid(v){var m=/\((KS-\d+)\)\s*$/.exec(v.trim());if(m)return m[1];var f=P.filter(function(p){return p.name==v.trim()})[0];return f?f.id:''}
function relink(row,id,fix,btn){
  btn.disabled=true;
  run('appRelink',[pin,Number(row),id,fix],function(r){
    flash=(r.dryRun?'Пробный режим: в таблицу ничего не записано. ':'')+(id?'Заказ привязан.':'Заказ отвязан.')+(r.moved?' Платежей перенесено: '+r.moved+'.':'')+' ';
    load();
  },function(m){
    btn.disabled=false;var rm=btn.closest('.ord')&&btn.closest('.ord').querySelector('.rm');
    if(rm&&!btn.classList.contains('ul'))rm.textContent=m;else setMsg(m,true);
  });
}
$('list').onclick=function(e){
  var b=e.target.closest('button');if(!b)return;
  var ord=b.closest('.ord');
  if(b.classList.contains('pay')){var pf=ord.querySelector('.pf');pf.hidden=!pf.hidden;return}
  if(b.classList.contains('pok')){payOrder(b,ord);return}
  if(b.classList.contains('rl')){var f=ord.querySelector('.rlf');f.hidden=!f.hidden;return}
  if(b.classList.contains('ul')){
    if(!b.dataset.sure){b.dataset.sure=1;b.textContent='Точно отвязать?';return}
    relink(b.dataset.row,'',false,b);return;
  }
  if(b.classList.contains('rok')){
    var id=pid(ord.querySelector('.rpl').value);
    if(!id){ord.querySelector('.rm').textContent='Выберите игрока из списка';return}
    var fix=ord.querySelector('.rfix').checked,ro=orderByRow(b.dataset.row)||{};
    // Привязка заказа с оплатами переносит платежи: подтверждаем (риск высокий)
    if(ro.paid>0&&ro.id!==id){
      ksConfirm({title:'Привязать заказ с оплатами?',ok:'Привязать заказ',
        text:'Платежи по этому заказу будут перенесены к выбранному игроку.',
        rows:[['Заказ',ro.kit||'комплект не указан'],['Сейчас',ro.id?playerName(ro.id)||ro.oname:'не привязан ('+ro.oname+')'],['Станет',playerName(id)],['Оплачено',ksMoney(ro.paid)]],
        run:function(ok,bad){
          run('appRelink',[pin,Number(b.dataset.row),id,fix],function(r){
            ok();flash=(r.dryRun?'Пробный режим: в таблицу ничего не записано. ':'')+'Заказ привязан.'+(r.moved?' Платежей перенесено: '+r.moved+'.':'')+' ';load();
          },bad);
        }});
      return;
    }
    relink(b.dataset.row,id,fix,b);
  }
  if(b.classList.contains('ed')){var ef=ord.querySelector('.edf');ef.hidden=!ef.hidden;if(!ef.hidden)editSumShow(ef);return}
  if(b.classList.contains('delo')){
    var dord=orderByRow(b.dataset.row)||{},dm=b.parentNode.querySelector('.dm');dm.textContent='';
    // Сервер удаляет только заказ без оплат (deleteOrderCore_): с оплатой — сразу объясняем, диалог не открываем
    if(dord.paid>0){dm.textContent='По заказу есть оплата ('+money(dord.paid)+'). Сначала отмените оплату, потом удалите заказ.';return}
    ksConfirm({title:'Удалить заказ?',ok:'Удалить заказ',danger:true,
      text:'Заказ будет удалён. Проверьте данные перед подтверждением.',
      rows:[['Заказ',(dord.kit||'Комплект не указан')+(dord.no?' (№'+dord.no+')':'')],['Игрок',playerName(dord.id)||dord.oname],['Сумма заказа',ksMoney(dord.sum)],['Оплачено',dord.paid>0?ksMoney(dord.paid):'нет оплат']],
      run:function(ok,bad){
        run('appDeleteOrder',[pin,Number(b.dataset.row)],function(r){ok();flash=(r.dryRun?'Пробный режим: в таблицу ничего не записано. ':'')+'Заказ удалён. ';load()},bad);
      }});
    return;
  }
  if(b.classList.contains('eok')){
    var ed=ord.querySelector('.em');
    var ekits=Array.from(ord.querySelectorAll('.ekit:checked')).map(function(c){return c.value});
    if(!ekits.length){ed.textContent='Отметьте хотя бы один комплект';return}
    var eo=orderByRow(b.dataset.row)||{},nk=ekits.join(' + ');
    var patch={kit:nk,size:ord.querySelector('.esize').value,inscr:ord.querySelector('.einscr').value,num:ord.querySelector('.enum').value,inst:ord.querySelector('.einst').checked};
    var save=function(ok,bad){
      b.disabled=true;ed.textContent='Сохраняю…';
      run('appEditOrder',[pin,Number(b.dataset.row),patch],
        function(r){if(ok)ok();flash=(r.dryRun?'Пробный режим: в таблицу ничего не записано. ':'')+'Заказ изменён. ';load()},
        function(m){b.disabled=false;ed.textContent=bad?'':m;if(bad)bad(m)});
    };
    // Сумма, которую запишет сервер (editOrderCore_ + equipDiscCalc_): тот же расчёт, что в EquipLinks.js
    var pv=editSumPreview(eo,ekits,patch.inst);
    if(pv.newSum!==null&&Math.round(pv.newSum*100)!==Math.round((eo.sum||0)*100)){
      var rows4=[['Игрок',playerName(eo.id)||eo.oname],['Заказ',nk],['Было',ksMoney(eo.sum)]];
      if(pv.disc!==null){
        rows4.push(['По каталогу',ksMoney(pv.total)]);
        if(pv.total-pv.newSum>0)rows4.push(['Скидка '+(DC?DC.pct:'')+'%','−'+ksMoney(pv.total-pv.newSum)]);
        if(pv.socks>0)rows4.push(['Без скидки','по полной цене, '+ksMoney(pv.socks)]);
      }
      rows4.push(['Станет',ksMoney(pv.newSum),'total'],['Оплачено',ksMoney(eo.paid)]);
      ksConfirm({title:'Изменить сумму заказа?',ok:'Сохранить заказ',
        text:nk!==eo.kit?'Комплект изменился: сумма заказа будет пересчитана по ценам каталога.':'Сумма заказа будет пересчитана со скидкой '+(DC?DC.pct:'')+'%.',
        rows:rows4,run:save});
      return;
    }
    save();
    return;
  }
};
// Предпросмотр суммы при правке заказа — повторяет серверный расчёт (EquipLinks.js: editOrderCore_, orderSumWithDisc_).
// newSum: что будет записано (null — сумма не меняется); disc: сумма со скидкой (null — скидки нет).
// Подсказка суммы в форме правки заказа: что запишется при сохранении (тот же расчёт, что на сервере)
function editSumShow(ef){
  var el=ef.querySelector('.esum');if(!el)return;
  var eo=orderByRow(ef.querySelector('.eok').dataset.row)||{},ks=[].map.call(ef.querySelectorAll('.ekit:checked'),function(c){return c.value});
  if(!ks.length){el.textContent='';return}
  var inst=ef.querySelector('.einst').checked,pv=editSumPreview(eo,ks,inst),was=Number(eo.sum)||0,t;
  if(pv.disc!==null)t='Весь комплект: скидка '+DC.pct+'% — '+(pv.prior+pv.total-pv.socks)+' ₾ → '+pv.target+' ₾'+(pv.prior?' (из них в других заказах '+pv.prior+' ₾)':'')+'. В этом заказе будет '+pv.newSum+' ₾'+(pv.newSum!==was?' вместо '+was+' ₾':'')+'.';
  else if(pv.newSum!==null)t='По каталогу: '+pv.newSum+' ₾'+(pv.newSum!==was?' вместо '+was+' ₾':'')+'. Скидки нет: '+(inst?'рассрочка.':'комплект не полный.');
  else t='Сумма заказа не меняется: '+was+' ₾. Скидки нет: '+(inst?'рассрочка.':'комплект не полный.');
  el.textContent=t;
}
document.addEventListener('change',function(e){var t=e.target;if(t.classList&&(t.classList.contains('ekit')||t.classList.contains('einst'))){var ef=t.closest('.edf');if(ef)editSumShow(ef)}});
function editSumPreview(eo,ks,inst){
  var missing=ks.some(function(k){return!(k in PR)}),kit=ks.join(' + ');
  var needCat=kit!==String(eo.kit||'').trim()||!(Number(eo.sum)>0);
  var id=String(eo.id||'').trim(),others=id?O.concat(UNL).filter(function(o){return Number(o.row)!==Number(eo.row)&&String(o.id||'').trim()===id&&String(o.kit||'').trim()}):[];
  var c=discCalc(ks,inst,others),disc=missing?null:c.disc;
  return {total:c.total,socks:c.excl,disc:disc,prior:c.prior||0,target:c.target||0,newSum:needCat?(disc!==null?disc:c.total):disc};
}
// Скидка на комплект — правило из настроек (DC, приходит с сервера): тот же расчёт, что equipDiscCalc_ в EquipLinks.js.
// ks — позиции заказа; others — прежние заказы игрока [{kit,sum}]. Возвращает {total, excl, disc}; disc=null — скидки нет.
function lowParts(kit){return String(kit||'').split(' + ').map(function(x){return x.trim().toLowerCase()}).filter(Boolean)}
function discCalc(ks,inst,others){
  var parts=ks.map(function(k){return String(k).trim().toLowerCase()}),total=0,excl=0;
  ks.forEach(function(k){var v=Number(PR[k])||0;total+=v;if(DC&&DC.exclude.indexOf(String(k).trim().toLowerCase())>=0)excl+=v});
  var out={total:total,excl:excl,disc:null};
  if(!DC||inst||!(DC.pct>0)||!parts.length)return out;
  if(!DC.needAll.every(function(alt){return alt.some(function(k){return parts.indexOf(k)>=0})}))return out;
  var own={};parts.forEach(function(k){own[k]=1});(others||[]).forEach(function(o){lowParts(o.kit).forEach(function(k){own[k]=1})});
  if(!DC.needOwn.every(function(alt){return alt.some(function(k){return own[k]})}))return out;
  var base=[].concat.apply([],DC.needOwn);
  var prior=(others||[]).filter(function(o){return lowParts(o.kit).some(function(k){return base.indexOf(k)>=0})}).reduce(function(s,o){return s+(Number(o.sum)||0)},0);
  var target=Math.round((prior+total-excl)*(100-DC.pct)/100/DC.round)*DC.round;
  out.disc=Math.max(target-prior,0)+excl;out.prior=prior;out.target=target;
  return out;
}
function selKits(){return[].map.call(document.querySelectorAll('#fkits input:checked'),function(i){return i.value})}
function kitsBox(){
  $('fkits').innerHTML=Object.keys(PR).map(function(k){
    return'<label class="kit"><input type="checkbox" value="'+esc(k)+'"> '+esc(k)+' — '+PR[k]+' ₾</label>';
  }).join('');
  [].forEach.call(document.querySelectorAll('#fkits input'),function(i){i.onchange=refreshSum});
}
function refreshSum(){
  var ks=selKits(),id=pid($('fpl').value),inst=$('finst').checked;
  var others=id?O.filter(function(o){return o.id===id}):[];
  var c=discCalc(ks,false,others),base=c.total;
  var disc=!inst&&c.disc!==null;
  var sum=disc?c.disc:base;
  $('fsum').value=ks.length?sum:'';
  $('fbundle').textContent=!ks.length?'':(disc?(c.prior?'Скидка '+DC.pct+'% на общую сумму '+(c.prior+base-c.excl)+' ₾ → '+c.target+' ₾ (из них в других заказах '+c.prior+' ₾), в этот заказ '+sum+' ₾':'Скидка '+DC.pct+'% на заказ: '+sum+' ₾ вместо '+base+' ₾'):(inst&&c.disc!==null?'Рассрочка: скидка не применяется, '+base+' ₾':''));
  refreshSizes();
}
function refreshSizes(){
  var ks=selKits(),list=ks.length===1?(SZ[ks[0]]||[]):[];
  $('fsizeSel').hidden=!list.length;$('fsize').hidden=!!list.length;
  if(list.length)$('fsizeSel').innerHTML=list.map(function(v){return'<option>'+esc(v)+'</option>'}).join('');
}
function openForm(){
  $('app').hidden=true;$('form').hidden=false;fmsg('');
  kitsBox();
  ['fpl','fsize','finscr','fnum'].forEach(function(i){$(i).value=''});
  $('finst').checked=false;$('fpaid').value=0;$('fmt').value='';$('fmrow').hidden=true;$('fdate').value=today();
  refreshSum();
}
function submit(){
  var id=pid($('fpl').value);
  if(!id){fmsg('Выберите игрока из списка',true);return}
  if(!selKits().length){fmsg('Отметьте хотя бы одну позицию',true);return}
  var kit=selKits().join(' + ');
  var o={id:id,kit:kit,sum:Number($('fsum').value),size:(!$('fsizeSel').hidden?$('fsizeSel').value:$('fsize').value.trim()),inscr:$('finscr').value.trim(),num:$('fnum').value.trim(),inst:$('finst').checked,paid:Number($('fpaid').value)||0,date:$('fdate').value,method:$('fmt').value};
  if(o.paid>0&&!o.method){fmsg('Выберите способ оплаты: наличные или перевод',true);return}
  var send=function(ok,bad){
    $('fsave').disabled=true;fmsg('Сохраняю…');
    run('appAddOrder',[pin,o],function(r){
      if(ok)ok();$('fsave').disabled=false;
      flash=(r.dryRun?'Пробный режим: в таблицу ничего не записано. ':'')+'Заказ добавлен (строка '+r.row+'). ';
      load();
    },function(m){$('fsave').disabled=false;fmsg(bad?'':m,!bad);if(bad)bad(m)});
  };
  // Заказ без оплаты создаётся как раньше; с «Оплачено сейчас» — после подтверждения обеих операций
  if(!(o.paid>0)){send();return}
  var osum=o.sum>0?o.sum:selKits().reduce(function(s,k){return s+(Number(PR[k])||0)},0);
  var dp=/^(\d{4})-(\d\d)-(\d\d)$/.exec(o.date||'');
  ksConfirm({title:'Создать заказ и принять оплату?',ok:'Создать заказ и принять оплату',
    rows:[['Игрок',playerName(id)],['Заказ',kit+', сумма '+ksMoney(osum)],['Оплачено сейчас',ksMoney(o.paid)],['Останется',ksMoney(Math.max(osum-o.paid,0))],['Способ',o.method],['Дата заказа',dp?dp[3]+'.'+dp[2]+'.'+dp[1]:'']],
    run:send});
}
$('list').addEventListener('click',function(e){
  var b=e.target.closest('#enew,#ereset');if(!b)return;
  if(b.id=='enew'){$('new').click();return}
  $('q').value='';$('fs').value='all';$('fg').value='';$('fl').value='';[].forEach.call(document.querySelectorAll('.fkc:checked'),function(c){c.checked=false});show();
});
$('q').oninput=show;$('fs').onchange=show;$('fg').onchange=show;$('fl').onchange=show;
$('new').onclick=openForm;
$('fcancel').onclick=function(){$('form').hidden=true;$('app').hidden=false};
$('finst').onchange=refreshSum;
$('fpl').oninput=refreshSum;
$('fpl').onchange=refreshSum;
$('fpaid').oninput=function(){$('fmrow').hidden=!(Number(this.value)>0)};
$('fsave').onclick=submit;
$('go').onclick=function(){pin=$('pin').value.trim();if(!pin)return;try{localStorage.setItem('kspin',pin)}catch(e){}load()};
try{pin=localStorage.getItem('kspin')||''}catch(e){}
if(pin)load();else showLogin('');
