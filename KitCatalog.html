<script>
(function(){
  var CAT=[];
  function active(){return CAT.filter(function(x){return x.active})}
  function sizesOf(s){return String(s||'').split(/[,;]/).map(function(x){return x.trim()}).filter(Boolean)}
  function loadCat(cb){run('appCatalog',[pin],function(r){CAT=r.items;if(cb)cb()},function(m){fail(m)})}

  // Кнопка «Каталог» рядом с «+ Новый заказ».
  var cb=document.createElement('button');cb.className='btn sec';cb.id='catb';cb.textContent='Каталог экипировки';
  $('new').insertAdjacentElement('afterend',cb);

  // Панель каталога.
  var pn=document.createElement('div');pn.id='catp';pn.className='wrap';pn.hidden=true;
  pn.innerHTML='<h1>Каталог экипировки</h1><div class="msg" id="cmsg" role="status"></div><div id="clist"></div>'
    +'<h2 id="cft" style="font-size:18px;margin:18px 0 0">Новая позиция</h2>'
    +'<label>Название</label><input id="cname" placeholder="например, Дождевик">'
    +'<label>Цена, ₾</label><input id="cprice" type="number" min="0" step="1">'
    +'<label>Размеры через запятую (необязательно)</label><input id="csizes" placeholder="116, 122, 128, 134, 140">'
    +'<label class="chk"><input type="checkbox" id="cinscr" checked> Нужна надпись</label>'
    +'<label class="chk"><input type="checkbox" id="cnum" checked> Нужен номер</label>'
    +'<div class="msg err" id="cerr"></div>'
    +'<button class="btn" id="csave">Сохранить позицию</button>'
    +'<button class="btn sec" id="cnew" hidden>Отменить изменение</button>'
    +'<button class="btn sec" id="cback">Назад к заказам</button>';
  document.body.appendChild(pn);
  var editRow=0;
  function cm(t,bad){$('cmsg').textContent=t||'';$('cmsg').className='msg'+(bad?' err':'')}
  function resetForm(){
    editRow=0;$('cft').textContent='Новая позиция';
    ['cname','cprice','csizes'].forEach(function(i){$(i).value=''});
    $('cinscr').checked=true;$('cnum').checked=true;$('cerr').textContent='';$('cnew').hidden=true;
  }
  function drawCat(){
    $('clist').innerHTML=CAT.map(function(x){
      return'<details'+(x.active?'':' style="opacity:.6"')+'><summary><div class="top"><span>'+esc(x.name)+'</span><span>'+money(x.price)+'</span></div>'
        +'<div class="sub">'+(x.active?'в каталоге':'скрыта')+(x.sizes?' · размеры: '+esc(x.sizes):'')+(x.inscr?' · надпись':'')+(x.num?' · номер':'')+'</div></summary>'
        +'<div class="acts"><button class="btn sec ced" data-row="'+x.row+'">Изменить</button><button class="btn sec ctg" data-row="'+x.row+'">'+(x.active?'Скрыть':'Вернуть')+'</button></div></details>';
    }).join('')||'<p class="sub">Каталог пуст.</p>';
  }
  function openCat(){
    loadCat(function(){$('app').hidden=true;$('form').hidden=true;pn.hidden=false;cm('');resetForm();drawCat()});
  }
  function item(row){return CAT.filter(function(x){return x.row==row})[0]}
  function save(o,btn){
    if(btn)btn.disabled=true;
    run('appCatalogSave',[pin,o],function(r){
      if(btn)btn.disabled=false;
      loadCat(function(){drawCat();resetForm();cm(r.dryRun?'Пробный режим: ничего не записано.':'Каталог сохранён.')});
    },function(m){if(btn)btn.disabled=false;$('cerr').textContent=m;cm(m,true)});
  }
  cb.onclick=openCat;
  $('cback').onclick=function(){pn.hidden=true;$('app').hidden=false};
  $('cnew').onclick=resetForm;
  $('csave').onclick=function(){
    save({row:editRow,was:editRow?(item(editRow)||{}).name:'',name:$('cname').value,price:$('cprice').value,sizes:$('csizes').value,inscr:$('cinscr').checked,num:$('cnum').checked,active:editRow?(item(editRow)||{active:true}).active:true},this);
  };
  $('clist').onclick=function(e){
    var b=e.target.closest('button');if(!b)return;
    var x=item(b.dataset.row);if(!x)return;
    if(b.classList.contains('ced')){
      editRow=x.row;$('cft').textContent='Изменение: '+x.name;
      $('cname').value=x.name;$('cprice').value=x.price;$('csizes').value=x.sizes;$('cinscr').checked=x.inscr;$('cnum').checked=x.num;$('cnew').hidden=false;$('cerr').textContent='';
      $('cname').scrollIntoView({behavior:'smooth',block:'center'});
    } else if(b.classList.contains('ctg')){
      save({row:x.row,was:x.name,name:x.name,price:x.price,sizes:x.sizes,inscr:x.inscr,num:x.num,active:!x.active},b);
    }
  };

  $('fcancel').onclick=function(){$('form').hidden=true;pn.hidden=true;$('app').hidden=false};
})();
</script>
