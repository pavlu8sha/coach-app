<!-- UI-017 (проба): единый каркас. Меню загружается один раз, разделы открываются внутри без перезагрузки.
     Каждый раздел — та же страница, что и раньше, в своём окне (iframe srcdoc): свои переменные и стили не смешиваются.
     Открытые разделы остаются в памяти: повторный переход мгновенный. Разделы вне SHELL_PAGES_ открываются обычной страницей. -->
<style>
#kshost{position:fixed;left:0;right:0;top:0;bottom:calc(var(--navh) + env(safe-area-inset-bottom));z-index:1;background:var(--bg)}
#kshost>iframe{position:absolute;top:0;left:0;width:100%;height:100%;border:0;display:block;background:var(--bg)}
#kshost>iframe[hidden],#kshost>.ksshl[hidden],#kshost>.ksshe[hidden]{display:none}
#kshost>.ksshl{position:absolute;inset:0;padding:16px;overflow:hidden;background:var(--bg)}
#kshost>.ksshl .bar{position:absolute;left:0;top:0;height:3px;width:30%;background:var(--g);animation:ksgo 1.1s ease-in-out infinite}
#kshost>.ksshl .in{max-width:560px;margin:0 auto}
#kshost>.ksshl .h{height:26px;width:45%;border-radius:8px;background:var(--line);margin:8px 0 16px}
#kshost>.ksshl .r{height:64px;border-radius:12px;background:var(--card);border:1px solid var(--line);margin-bottom:8px;animation:skp 1.2s ease-in-out infinite}
#kshost>.ksshe{position:absolute;inset:0;padding:16px;background:var(--bg)}
#kshost>.ksshe .in{max-width:560px;margin:0 auto}
@keyframes ksgo{0%{left:-30%}100%{left:100%}}
@keyframes skp{50%{opacity:.45}}
@media (prefers-reduced-motion:reduce){#kshost>.ksshl .bar,#kshost>.ksshl .r{animation:none}}
</style>
<div id="kshost">
  <div class="ksshl" role="status" aria-label="Открываю раздел" hidden><div class="bar"></div><div class="in"><div class="h"></div><div class="r"></div><div class="r"></div><div class="r"></div><div class="r"></div></div></div>
  <div class="ksshe" hidden><div class="in" id="ksshein"></div></div>
</div>
<script>
(function(){
  var PAGES=__SHELL_PAGES__,START='__START__',URL='__URL__';
  var host=document.getElementById('kshost'),load=host.querySelector('.ksshl'),err=host.querySelector('.ksshe');
  var frames={},cur='',want='';
  function pageOf(href){var m=/[?&]page=([^&#]+)/.exec(href||'');return m?decodeURIComponent(m[1]):'att'}

  // Окно раздела занимает место между меню и краем экрана (меню снизу на телефоне, сверху на компьютере)
  function layout(){
    var n=document.getElementById('ksnav'),r=n&&getComputedStyle(n).display!=='none'?n.getBoundingClientRect():null;
    if(!r||!r.height){host.style.top='0';host.style.bottom='0';return}
    if(r.top>window.innerHeight/2){host.style.top='0';host.style.bottom=(window.innerHeight-r.top)+'px'}
    else{host.style.top=r.bottom+'px';host.style.bottom='0'}
  }
  window.addEventListener('resize',layout);
  new MutationObserver(layout).observe(document.documentElement,{attributes:true,attributeFilter:['data-ok']});

  // У каждого окна свой объект google: вызовы сервера идут через каркас, а обёртки страниц не трогают друг друга
  window.ksChildGoogle=function(){
    var g=google.script;
    return{script:{get run(){return g.run},history:g.history,url:g.url,host:g.host}};
  };

  function markNav(page){
    [].forEach.call(document.querySelectorAll('#ksnav a[href],#ksmore a[href]'),function(a){
      var on=pageOf(a.getAttribute('href'))===page;a.classList.toggle('on',on);
      if(on)a.setAttribute('aria-current','page');else a.removeAttribute('aria-current');
    });
  }
  function showOnly(page){
    Object.keys(frames).forEach(function(k){frames[k].hidden=(k!==page)});
    load.hidden=true;err.hidden=true;
  }
  function hist(page){try{google.script.history.push({page:page},{shell:'1',page:page})}catch(e){}}

  function open(page,push){
    if(PAGES.indexOf(page)<0){ // раздел ещё не в каркасе — обычный переход
      try{window.top.location.href=URL+(page&&page!=='att'?'?page='+encodeURIComponent(page):'')}catch(e){}
      return;
    }
    want=page;markNav(page);
    var sheet=document.getElementById('ksmore');if(sheet)sheet.hidden=true;
    var mb=document.getElementById('ksmb');if(mb)mb.setAttribute('aria-expanded','false');
    if(push&&page!==cur)hist(page);
    cur=page;
    if(frames[page]){showOnly(page);return}
    Object.keys(frames).forEach(function(k){frames[k].hidden=true});
    err.hidden=true;load.hidden=false;
    google.script.run.withSuccessHandler(function(html){
      if(frames[page])return;
      var f=document.createElement('iframe');f.title=page;f.hidden=true;
      html=String(html).replace(/<head([^>]*)>/i,function(m){return m+'<script>window.KS_EMBED=1;try{window.google=parent.ksChildGoogle()}catch(e){}<\/script>'});
      f.addEventListener('load',function(){if(want===page)showOnly(page)});
      f.srcdoc=html;frames[page]=f;host.appendChild(f);
    }).withFailureHandler(function(e){
      if(want!==page)return;
      load.hidden=true;
      document.getElementById('ksshein').innerHTML=ksEmpty({tag:'div',icon:'alert',title:'Не удалось открыть раздел',text:(e&&e.message)||'Проверьте соединение и попробуйте ещё раз.',btn:'Повторить',id:'ksshretry'});
      err.hidden=false;
    }).appPageHtml(page);
  }
  err.addEventListener('click',function(e){if(e.target.closest('#ksshretry'))open(want,false)});

  // Переходы из меню каркаса (до обработчиков меню и быстрого скелетона — фаза перехвата)
  document.addEventListener('click',function(e){
    if(e.button||e.metaKey||e.ctrlKey||e.shiftKey||e.altKey)return;
    var a=e.target.closest&&e.target.closest('#ksnav a[href],#ksmore a[href]');if(!a)return;
    var p=pageOf(a.getAttribute('href'));
    if(PAGES.indexOf(p)<0)return; // обычный переход
    e.preventDefault();e.stopPropagation();open(p,true);
  },true);
  // Ссылки внутри разделов (подразделы, «К отметкам») приходят сюда из окна раздела
  window.ksShellGo=function(href){open(pageOf(href),true)};

  // Кнопка «Назад» браузера
  try{google.script.history.setChangeHandler(function(ev){
    var p=(ev&&ev.state&&ev.state.page)||(ev&&ev.location&&ev.location.parameter&&ev.location.parameter.page)||START;
    open(p,false);
  })}catch(e){}

  // Тема и режим, выбранные в меню каркаса, сразу применяются в открытых разделах
  document.addEventListener('kstheme',function(){Object.keys(frames).forEach(function(k){try{var w=frames[k].contentWindow;w.ksSetTheme(window.ksTheme())}catch(e){}})});
  window.addEventListener('ksmodechange',function(){Object.keys(frames).forEach(function(k){try{frames[k].contentWindow.dispatchEvent(new Event('ksmodechange'))}catch(e){}})});
  // Вход по коду выполнен внутри раздела — перезапускаем каркас, чтобы показать меню
  var pin0=null;try{pin0=localStorage.getItem('kspin')}catch(e){}
  window.addEventListener('storage',function(e){if(e.key==='kspin'&&!pin0&&e.newValue){try{window.top.location.href=URL+'?shell=1&page='+encodeURIComponent(cur||START)}catch(x){}}});

  layout();setTimeout(layout,300);
  open(START,false);
})();
</script>
