<!DOCTYPE html>
<html lang="ru">
<head>
<base target="_top">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Дополнительные</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.wrap{max-width:560px;margin:0 auto;padding:0 16px}
h1{font-size:22px;margin:16px 0 10px}
input,select,textarea{font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;min-height:46px;width:100%}
textarea{min-height:110px;resize:vertical}
input[type=checkbox]{width:20px;min-height:20px;height:20px;margin:0 6px 0 0;padding:0;flex:none}
button{font:inherit;cursor:pointer}
.btn{width:100%;min-height:48px;border:0;border-radius:14px;background:var(--g);color:var(--gi);font-weight:700}
.sm{min-height:40px;padding:6px 12px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--g);font-weight:600;font-size:14px}
.sm.bad{color:var(--a,#C0392B)}
.sm.armed{background:var(--a,#C0392B);color:#fff;border-color:transparent}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:8px 0}
.row2>*{min-width:0;max-width:100%;box-sizing:border-box}
input[type=date]{-webkit-appearance:none;appearance:none;width:100%;min-width:0;max-width:100%;display:block;box-sizing:border-box}
details{background:var(--card);border:1px solid var(--line);border-radius:14px;margin:0 0 10px;padding:0 14px}
summary{cursor:pointer;padding:12px 0;display:flex;gap:8px;align-items:baseline;flex-wrap:wrap;list-style:none}
summary::-webkit-details-marker{display:none}
.cnt{margin-left:auto;color:var(--mute);font-size:14px}
.th{color:var(--mute);font-size:14px;margin:-4px 0 8px}
.pl{border-top:1px solid var(--line);padding:10px 0}
.pn{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}.pn b{flex:1}
.gr{color:var(--mute);font-size:13px}
.tag{font-size:12px;font-weight:700;padding:2px 8px;border-radius:8px;background:var(--pb);color:var(--g)}
.tag.no{background:none;border:1px solid var(--line);color:var(--mute)}
.acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.add{border-top:1px solid var(--line);padding:12px 0 14px;display:grid;gap:8px}
.msg{color:var(--mute);font-size:14px;min-height:20px;margin:6px 0}.err{color:var(--a,#C0392B)}
</style>
</head>
<body>
<div id="login" class="wrap" hidden>
  <h1>Дополнительные</h1><p>Введите код администратора</p>
  <input id="pin" type="password" autocomplete="off"><p id="lerr" class="err"></p>
  <button class="btn" id="go">Войти</button>
</div>
<div id="app" class="wrap" hidden>
  <h1>Дополнительные тренировки</h1>
  <div class="msg" id="msg" role="status"></div>
  <details id="debt"><summary><b>Должники</b><span class="cnt" id="dcnt"></span></summary>
    <div id="dlist"></div>
  </details>
  <details id="msgx" open><summary><b>Сообщение по неоплаченным</b></summary>
    <label>Тренировка</label><select id="mev"></select>
    <label>Место тренировки</label>
    <div class="row2"><input id="mplace" placeholder="например, Исани"><button class="btn sec" id="mpsave">Сохранить место</button></div>
    <label>Текст сообщения ({место} и {дата} подставятся сами)</label>
    <textarea id="mtpl" rows="3"></textarea>
    <button class="btn" id="mcopy">Скопировать текст</button>
    <div class="sub" style="margin-top:12px">Отметьте, кому уже написали</div>
    <div id="mlist"></div>
  </details>
  <details id="slist" open><summary><b>Список записавшихся</b></summary>
    <label>Тренировка</label><select id="sev"></select>
    <textarea id="stxt" rows="12" style="margin-top:8px"></textarea>
    <button class="btn" id="scopy">Скопировать список</button>
    <div class="sub" style="margin-top:8px">Заголовок пишете сами; здесь только нумерованный список по порядку записи.</div>
  </details>
  <details id="newev"><summary><b>+ Новая тренировка</b></summary>
    <div class="row2"><input type="date" id="nd" aria-label="Дата"><input type="number" min="0" step="1" id="na" placeholder="Сумма, ₾" aria-label="Сумма"></div>
    <div style="padding-bottom:14px"><button class="btn" id="nadd">Создать тренировку</button></div>
  </details>
  <div id="list"></div>
</div>
<datalist id="dl"></datalist>
<script>
var pin='',D=null,PL=[],open={},armed='',editing='',busy=false;
function $(i){return document.getElementById(i)}
function run(fn,args,ok,fail){var r=google.script.run.withSuccessHandler(ok).withFailureHandler(function(e){fail(e&&e.message?e.message:String(e))});r[fn].apply(r,args)}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function money(n){return String(Math.round(n*100)/100).replace('.',',')+' ₾'}
function gl(k){try{return localStorage.getItem(k)||''}catch(e){return''}}
function sl(k,v){try{localStorage.setItem(k,v)}catch(e){}}
function msg(t,bad){$('msg').textContent=t||'';$('msg').className='msg'+(bad?' err':'')}
function showLogin(t){$('app').hidden=true;$('login').hidden=false;$('lerr').textContent=t||''}
function showApp(){$('login').hidden=true;$('app').hidden=false}
function dl(d){var p=d.split('-'),w=['вс','пн','вт','ср','чт','пт','сб'][new Date(Date.UTC(+p[0],+p[1]-1,+p[2])).getUTCDay()];return w+' '+p[2]+'.'+p[1]}
function today(){var d=new Date(),z=function(n){return(n<10?'0':'')+n};return d.getFullYear()+'-'+z(d.getMonth()+1)+'-'+z(d.getDate())}
function fail(m){busy=false;if(/Неверный код/.test(m))showLogin('Неверный код администратора');else{showApp();msg(m,true)}}
function load(){
  msg('Загрузка…');
  run('appExtraData',[pin],function(r){D=r;busy=false;armed='';showApp();msg('');render();loadWrote()},fail);
  if(!PL.length)run('appIndPlayers',[pin],function(r){PL=r;$('dl').innerHTML=r.map(function(p){return'<option value="'+esc(p.name)+'">'+esc(p.group)+'</option>'}).join('')},function(){});
}
function renderDebts(){
  var h='',tot=0,n=0;
  D.debts.forEach(function(d,i){
    tot+=d.total;n+=d.count;
    h+='<div class="pl"><div class="pn"><b>'+esc(d.name)+'</b><span class="gr">'+esc(d.group)+'</span><span class="tag no">'+(d.total?money(d.total):d.count+' трен.')+'</span></div>';
    d.events.forEach(function(e,j){
      h+='<div class="acts" style="align-items:center"><span class="gr" style="flex:1">'+dl(e.date)+(e.price?' · '+money(e.price):' · сумма не задана')+'</span>';
      if(e.price)h+='<button class="sm" data-a="dpay" data-m="Наличные" data-i="'+i+'" data-j="'+j+'">Наличные</button><button class="sm" data-a="dpay" data-m="Перевод" data-i="'+i+'" data-j="'+j+'">Перевод</button>';
      h+='</div>';
    });
    h+='</div>';
  });
  $('dlist').innerHTML=h||'<p class="th">Долгов нет</p>';
  $('dcnt').textContent=D.debts.length?D.debts.length+' · '+(tot?money(tot):n+' трен.'):'нет';
}
// Список записавшихся: только нумерованные ФИ по порядку записи, без заголовка.
function fillSList(){
  var sel=$('sev'),prev=sel.value,evs=D.events.slice().sort(function(a,b){return b.date.localeCompare(a.date)});
  sel.innerHTML=evs.map(function(e){return'<option value="'+esc(e.id)+'">'+esc(dl(e.date)+(e.place?' · '+e.place:''))+'</option>'}).join('')||'<option value="">Нет тренировок</option>';
  if(prev&&evs.some(function(e){return e.id===prev}))sel.value=prev;
  renderSList();
}
function renderSList(){
  var e=D.events.filter(function(x){return x.id===$('sev').value})[0];
  $('stxt').value=e?e.players.map(function(p,i){return(i+1)+'.\u00A0'+p.name}).join('\n'):'';
}
$('sev').onchange=renderSList;
$('scopy').onclick=function(){
  var t=$('stxt').value,b=this;if(!t)return;
  var flash=function(){var old=b.textContent;b.textContent='Скопировано';setTimeout(function(){b.textContent=old},1800)};
  if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(t).then(flash,function(){if(copyTxt(t))flash()})}
  else if(copyTxt(t))flash();
};
// Сообщение по неоплаченным тренировкам: место и дата подставляются из выбранной тренировки.
var MSG_DEF='Добрый день\nУ вас не оплачена тренировка на {место} {дата}';
function ddmm(d){var p=d.split('-');return p[2]+'.'+p[1]}
function msgEvents(){return D.events.filter(function(e){return e.players.some(function(p){return!p.paid})})}
function curEv(){return D.events.filter(function(e){return e.id===$('mev').value})[0]}
var wroteSrv={};
function wroteMap(){return wroteSrv}
function loadWrote(){run('appWroteList',[pin],function(list){wroteSrv={};list.forEach(function(k){wroteSrv[k]=1});renderMsgList()},function(m){msg(m,true)})}
function copyTxt(t){var a=document.createElement('textarea');a.value=t;a.style.position='fixed';a.style.opacity='0';document.body.appendChild(a);a.select();var ok=false;try{ok=document.execCommand('copy')}catch(x){}document.body.removeChild(a);return ok}
function renderMsgList(){
  var e=curEv(),wrote=wroteMap();
  $('mplace').value=e?e.place:'';
  if(!e){$('mlist').innerHTML='';return}
  $('mlist').innerHTML=e.players.filter(function(p){return!p.paid}).map(function(p){
    var k=e.id+'|'+p.name;
    return'<div style="display:flex;justify-content:space-between;align-items:center;gap:8px;padding:6px 0;border-top:1px solid var(--line)"><span>'+esc(p.name)+' <span class="gr">'+esc(p.group)+'</span></span><span class="gr"><input type="checkbox" data-w="'+esc(k)+'"'+(wrote[k]?' checked':'')+'> написал(а)</span></div>';
  }).join('');
}
function fillMsg(){
  var evs=msgEvents(),sel=$('mev'),prev=sel.value;
  sel.innerHTML=evs.map(function(e){return'<option value="'+esc(e.id)+'">'+esc(dl(e.date)+(e.place?' · '+e.place:' · место не указано'))+'</option>'}).join('')||'<option value="">Нет неоплаченных</option>';
  if(prev&&evs.some(function(e){return e.id===prev}))sel.value=prev;
  if(!$('mtpl').dataset.init){$('mtpl').value=gl('extraMsgTpl')||MSG_DEF;$('mtpl').dataset.init='1'}
  renderMsgList();
  fillSList();
}
$('mev').onchange=function(){renderMsgList()};
$('mtpl').oninput=function(){try{localStorage.setItem('extraMsgTpl',this.value)}catch(x){}};
$('mcopy').onclick=function(){
  var e=curEv();if(!e)return;
  if(!e.place){msg('Сначала укажите место тренировки',true);return}
  var t=$('mtpl').value.replace(/\{место\}/g,e.place).replace(/\{дата\}/g,ddmm(e.date)),b=this;
  var flash=function(){var old=b.textContent;b.textContent='Скопировано';setTimeout(function(){b.textContent=old},1800)};
  if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(t).then(flash,function(){if(copyTxt(t))flash()})}
  else if(copyTxt(t))flash();
};
$('mpsave').onclick=function(){
  var e=curEv();if(!e)return;
  var v=$('mplace').value.trim(),b=this;
  b.disabled=true;
  run('appSetExtraPlace',[pin,e.id,v],function(r){
    b.disabled=false;
    if(r&&r.dryRun){msg('Пробный режим: в таблицу ничего не записано.');return}
    e.place=v;fillMsg();msg('Место сохранено');
  },function(m){b.disabled=false;msg(m,true)});
};
$('mlist').onchange=function(ev){
  var c=ev.target;if(!c.dataset||!c.dataset.w)return;
  var m=wroteMap();if(c.checked)m[c.dataset.w]=1;else delete m[c.dataset.w];
  run('appWroteSet',[pin,Object.keys(m).filter(function(k){return m[k]})],function(){},function(e){msg(e,true)});
};
function render(){
  renderDebts();fillMsg();
  var h='';
  D.events.forEach(function(e,i){
    var paid=e.players.filter(function(p){return p.paid}).length,dk='d'+e.id;
    h+='<details data-id="'+esc(e.id)+'"'+(open[e.id]?' open':'')+'><summary><b>'+dl(e.date)+'</b><span>'+(e.price?money(e.price):'без суммы')+'</span><span class="cnt">оплатили '+paid+' из '+e.players.length+'</span></summary>';
    if(editing==e.id){
      h+='<div class="add" style="border-top:0;padding-top:0"><div class="row2"><input type="date" id="ed'+i+'" value="'+e.date+'"><input type="number" min="0" step="1" id="ea'+i+'" value="'+(e.price||'')+'" placeholder="Сумма, ₾"></div><input id="ep'+i+'" value="'+esc(e.place||'')+'" placeholder="Место, например Исани" style="margin-bottom:8px"><div class="acts"><button class="sm" data-a="esave" data-e="'+i+'">Сохранить</button><button class="sm" data-a="ecancel">Отмена</button></div></div>';
    }else{
      h+='<div class="acts" style="margin:0 0 8px"><button class="sm" data-a="eedit" data-e="'+i+'">Изменить дату и сумму</button><button class="sm bad'+(armed==dk?' armed':'')+'" data-a="edel" data-e="'+i+'">'+(armed==dk?'Точно удалить?':'Удалить тренировку')+'</button></div>';
    }
    if(!e.price)h+='<div class="add" style="border-top:0;padding-top:0"><input type="number" min="0" step="1" id="pa'+i+'" placeholder="Сумма оплаты, ₾ (у тренировки не задана)"></div>';
    e.players.forEach(function(p,j){
      var k='r'+i+'_'+j;
      h+='<div class="pl"><div class="pn"><b>'+esc(p.name)+'</b><span class="gr">'+esc(p.group)+'</span><span class="tag'+(p.paid?'':' no')+'">'+(p.paid?'Оплачено':'Не оплачено')+'</span></div><div class="acts">';
      if(!p.paid)h+='<button class="sm" data-a="pay" data-m="Наличные" data-e="'+i+'" data-p="'+j+'">Оплата: наличные</button><button class="sm" data-a="pay" data-m="Перевод" data-e="'+i+'" data-p="'+j+'">Оплата: перевод</button><button class="sm bad'+(armed==k?' armed':'')+'" data-a="rm" data-k="'+k+'" data-e="'+i+'" data-p="'+j+'">'+(armed==k?'Точно снять?':'Снять')+'</button>';
      else h+='<button class="sm bad'+(armed==k?' armed':'')+'" data-a="unpay" data-k="'+k+'" data-e="'+i+'" data-p="'+j+'">'+(armed==k?'Точно отменить?':'Отменить оплату')+'</button>';
      h+='</div></div>';
    });
    h+='<div class="add"><input list="dl" id="in'+i+'" placeholder="Игрок из реестра или гость (имя)" autocomplete="off"><button class="btn" data-a="add" data-e="'+i+'">Записать</button></div>';
    h+='</details>';
  });
  $('list').innerHTML=h||'<p class="th">Тренировок пока нет</p>';
}
$('list').addEventListener('toggle',function(ev){var d=ev.target;if(d.dataset&&d.dataset.id)open[d.dataset.id]=d.open},true);
function go(fn,args,ok){busy=true;msg('Сохраняю…');run(fn,args,function(){msg(ok);load()},fail)}
$('list').onclick=function(ev){
  var b=ev.target.closest('button');if(!b||busy||!b.dataset.a)return;
  var a=b.dataset.a,e=D.events[b.dataset.e],p=e&&e.players[b.dataset.p];
  if(a=='pay'){
    var amt='';
    if(!e.price){amt=$('pa'+b.dataset.e).value;if(!(Number(amt)>0)){msg('Введите сумму оплаты',true);return}}
    go('appExtraPay',[pin,e.id,p.name,b.dataset.m,amt],'Оплата принята: '+p.name);
  }else if(a=='unpay'||a=='rm'){
    if(armed!=b.dataset.k){armed=b.dataset.k;render();return}
    armed='';
    if(a=='unpay')go('appExtraUnpay',[pin,e.id,p.name],'Оплата отменена: '+p.name);
    else go('appExtraRemove',[pin,e.id,p.name],'Игрок снят: '+p.name);
  }else if(a=='add'){
    var nm=$('in'+b.dataset.e).value.trim();if(!nm){msg('Укажите имя игрока',true);return}
    var g='гость';PL.forEach(function(x){if(x.name.toLowerCase()==nm.toLowerCase()){g=x.group;nm=x.name}});
    go('appExtraAdd',[pin,e.id,nm,g],'Записан: '+nm+(g=='гость'?' (гость)':''));
  }else if(a=='eedit'){editing=e.id;open[e.id]=true;armed='';render()}
  else if(a=='ecancel'){editing='';render()}
  else if(a=='esave'){
    var i=b.dataset.e,d=$('ed'+i).value;
    if(!d){msg('Укажите дату',true);return}
    editing='';go('appExtraEventEdit',[pin,e.id,d,$('ea'+i).value,$('ep'+i).value],'Тренировка изменена');
  }else if(a=='edel'){
    var k='d'+e.id;if(armed!=k){armed=k;render();return}
    armed='';go('appExtraEventDelete',[pin,e.id],'Тренировка удалена');
  }
};
$('dlist').onclick=function(ev){
  var b=ev.target.closest('button');if(!b||busy||b.dataset.a!='dpay')return;
  var d=D.debts[b.dataset.i],e=d.events[b.dataset.j];
  go('appExtraPay',[pin,e.id,d.name,b.dataset.m,''],'Оплата принята: '+d.name);
};
$('nd').value=today();
$('nadd').onclick=function(){
  if(busy)return;
  if(!$('nd').value){msg('Укажите дату',true);return}
  if(!(Number($('na').value)>0)){msg('Введите сумму за тренировку',true);return}
  busy=true;msg('Создаю…');
  run('appExtraAddEvent',[pin,$('nd').value,$('na').value],function(r){msg(r.exists?'Тренировка на эту дату уже есть':'Тренировка создана');$('newev').open=false;$('na').value='';load()},fail);
};
$('go').onclick=function(){pin=$('pin').value.trim();if(!pin)return;sl('kspin',pin);sl('kspin',pin);load()};
pin=gl('kspin')||gl('kspin')||gl('kspin');
if(pin)load();else showLogin('');
</script>
</body>
</html>
