<style>
/* Общий слой дизайн-системы v1 (DESIGN_SYSTEM_V1.md). Подключается ко всем страницам после Nav.html.
   Новые имена токенов — алиасы текущих: значения не меняются, старые имена продолжают работать. */
:root{
  --color-bg:var(--bg);--color-surface:var(--card);--color-text:var(--ink);--color-text-muted:var(--mute);
  --color-border:var(--line);--color-primary:var(--g);--color-on-primary:var(--gi);
  --color-primary-subtle:var(--pb);--color-neutral-fill:var(--n);--color-danger:var(--a);
  --color-warning:#8A5A00;--color-warning-subtle:#FBEFCF;--color-danger-subtle:#F8E1DD;--color-danger-strong:#9E2B1F;--color-border-strong:#7A86A6;--color-on-danger:#fff;
  --radius-xl:16px;--shadow-pop:0 8px 30px rgba(0,0,0,.18);
  /* DS-013: семантические цвета (DESIGN_SYSTEM_V1 §4.1–4.3); --color-on-status — текст на сплошной заливке статуса */
  --color-success:#1E7A4C;--color-success-subtle:#DFF2E7;--color-neutral-strong:#5A6584;--color-on-status:#fff;
  /* DS-011 (вариант б): бывшие локальные токены страниц — в общем слое */
  --ab:var(--color-danger-subtle);--okbg:var(--color-primary-subtle)
}
@media (prefers-color-scheme:dark){html:not([data-theme=light]):root{
  --color-warning:#E8C26A;--color-warning-subtle:#3A2F12;--color-danger-subtle:#3C1F1B;--color-danger-strong:#F0866F;--color-border-strong:#6474A6;--color-on-danger:#0B1020;
  --color-success:#5FC48D;--color-success-subtle:#16382A;--color-neutral-strong:#97A3C2;--color-on-status:#0B1020
}}
html[data-theme=dark]:root{
  --color-warning:#E8C26A;--color-warning-subtle:#3A2F12;--color-danger-subtle:#3C1F1B;--color-danger-strong:#F0866F;--color-border-strong:#6474A6;--color-on-danger:#0B1020;
  --color-success:#5FC48D;--color-success-subtle:#16382A;--color-neutral-strong:#97A3C2;--color-on-status:#0B1020
}
/* Широкий контейнер для таблиц и плотных списков (UI-004, затем по одному экрану): выходит из узкой колонки
   страницы до 960 px и центрируется; на телефоне равен ширине колонки. Формы остаются узкими. */
.ks-wide{--ks-w:min(960px,calc(100vw - 32px));width:var(--ks-w);max-width:none;margin-left:calc(50% - var(--ks-w) / 2);margin-right:0}
.wrap.ks-wide-w{max-width:960px}
/* DS-014: рамки полей ввода и выбора — контраст не ниже 3:1 к фону в обеих темах (было около 1,3:1).
   Селектор с :not() сильнее локальных правил страниц, поэтому меняется только цвет рамки, не форма и не размеры. */
input:not([type=checkbox]):not([type=radio]):not([type=button]):not([type=submit]):not([type=hidden]),select,textarea{border-color:var(--color-border-strong)}
input[type=checkbox],input[type=radio]{accent-color:var(--color-primary)}
/* Состояние «Сохраняю…» у кнопки */
.ks-loading{opacity:.7;cursor:progress!important}
/* Диалог подтверждения */
#ksdlg{position:fixed;top:0;right:0;bottom:0;left:0;z-index:80;display:none;align-items:center;justify-content:center;padding:16px;padding-bottom:calc(16px + env(safe-area-inset-bottom));overscroll-behavior:contain;background:rgba(10,14,28,.55)}
#ksdlg.ks-open{display:flex}
#ksdlg .ks-box{width:100%;max-width:480px;max-height:calc(100vh - 32px);max-height:calc(100dvh - 32px - env(safe-area-inset-bottom));overflow:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;background:var(--color-surface,#fff);color:var(--color-text,#141C33);border:1px solid var(--color-border,#DADFEC);border-radius:var(--radius-xl);box-shadow:var(--shadow-pop);padding:20px;font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;box-sizing:border-box}
#ksdlg h2{font-size:19px;margin:0 0 8px;font-weight:700}
#ksdlg .ks-text{margin:0 0 12px;color:var(--color-text-muted,#5A6584);font-size:15px}
#ksdlg dl{margin:0 0 12px;display:grid;grid-template-columns:auto 1fr;gap:6px 12px;font-size:15px}
#ksdlg dt{color:var(--color-text-muted,#5A6584)}
#ksdlg dd{margin:0;font-weight:600;overflow-wrap:anywhere}
#ksdlg .ks-warn{background:var(--color-warning-subtle);color:var(--color-warning);border-radius:12px;padding:10px 12px;margin:0 0 12px;font-size:14px;font-weight:600}
#ksdlg .ks-warn b{display:block;margin-bottom:2px}
#ksdlg .ks-warn span{font-weight:500}
#ksdlg dd.ks-total{font-size:17px;font-weight:800}
#ksdlg .ks-err{background:var(--color-danger-subtle);color:var(--color-danger-strong);border-radius:12px;padding:10px 12px;margin:0 0 12px;font-size:14px;font-weight:600}
#ksdlg .ks-acts{display:flex;gap:8px;flex-direction:row-reverse}
#ksdlg .ks-acts button{flex:1;min-height:48px;border-radius:14px;font:700 16px system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;cursor:pointer;padding:0 12px}
#ksdlg .ks-ok{border:0;background:var(--color-primary,#25335A);color:var(--color-on-primary,#fff)}
#ksdlg .ks-ok.ks-danger{background:var(--color-danger,#C0392B);color:var(--color-on-danger,#fff)}
#ksdlg .ks-cancel{border:1px solid var(--color-border-strong,#7A86A6);background:var(--color-surface,#fff);color:var(--color-text,#141C33)}
#ksdlg button:disabled{opacity:.6;cursor:progress}
#ksdlg [hidden]{display:none!important}
@media (max-width:420px){#ksdlg .ks-acts{flex-direction:column}}
/* Очень узкий экран или крупный масштаб: меньше отступы, длинные слова переносятся */
#ksdlg h2,#ksdlg .ks-text,#ksdlg .ks-warn,#ksdlg .ks-err,#ksdlg .ks-acts button{overflow-wrap:anywhere}
@media (max-width:300px){#ksdlg{padding:8px}#ksdlg .ks-box{padding:12px;max-height:calc(100vh - 16px);max-height:calc(100dvh - 16px - env(safe-area-inset-bottom))}#ksdlg dl{grid-template-columns:1fr;gap:0}#ksdlg dd{margin-bottom:6px}}
html.ks-dlg-lock,html.ks-dlg-lock body{overflow:hidden!important}
/* UI-010: ошибка формы под кнопкой, пустые состояния, явная загрузка */
.ks-ferr{display:flex;gap:6px;align-items:flex-start;margin:6px 0 0;color:var(--color-danger-strong);font-size:14px;font-weight:600;line-height:1.35}
.ks-ferr::before{content:"!";flex:none;display:inline-flex;align-items:center;justify-content:center;width:18px;height:18px;margin-top:1px;border-radius:50%;background:var(--color-danger-strong);color:var(--color-on-danger);font-size:12px;font-weight:800}
.ks-empty{display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px;padding:28px 16px;margin:8px 0;background:var(--card);border:1px solid var(--line);border-radius:14px;list-style:none}
.ks-empty svg{color:var(--g);margin-bottom:4px}
.ks-empty b{font-size:16px;color:var(--ink)}
.ks-empty p{margin:0;color:var(--mute);font-size:14px;max-width:320px}
.ks-empty button{margin-top:10px;min-height:44px;padding:10px 20px;border-radius:12px;border:0;background:var(--g);color:var(--gi);font:700 15px system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;cursor:pointer;width:auto}
.ks-load{display:flex;flex-direction:column;align-items:center;gap:12px;padding:56px 16px;color:var(--mute);font-size:15px}
.ks-load[hidden],.ks-empty[hidden],.ks-ferr[hidden]{display:none}
/* Пустая строка сообщения не оставляет дыру в разметке: место появляется только вместе с текстом */
.msg:empty{min-height:0!important}
/* Сообщение о процессе («Сохраняю…», «Загрузка…») — нейтральным цветом, даже если строка предназначена для ошибок */
.msg.ks-progress,.ks-progress.err{color:var(--mute)!important}
.ks-spin{width:28px;height:28px;border-radius:50%;border:3px solid var(--line);border-top-color:var(--g);animation:ks-spin .9s linear infinite}
@keyframes ks-spin{to{transform:rotate(360deg)}}
@media(prefers-reduced-motion:reduce){.ks-spin{animation-duration:2.5s}}
/* UI-011: подпись поля входа; фокус для строк-кнопок */
label.ks-pinl{display:block;margin:16px 0 8px;color:var(--ink);font-size:16px;font-weight:400}
[data-ks-row]:focus-visible{outline:3px solid var(--g);outline-offset:2px}
</style>
<div id="ksdlg" role="presentation">
  <div class="ks-box" role="dialog" aria-modal="true" aria-labelledby="ksdlg-t" aria-describedby="ksdlg-x ksdlg-d ksdlg-w">
    <h2 id="ksdlg-t"></h2>
    <p class="ks-text" id="ksdlg-x" hidden></p>
    <dl id="ksdlg-d"></dl>
    <div class="ks-warns" id="ksdlg-w"></div>
    <div class="ks-err" role="alert" hidden></div>
    <div class="ks-acts"><button type="button" class="ks-ok"></button><button type="button" class="ks-cancel">Отмена</button></div>
  </div>
</div>
<script>
(function(){
  var root=document.getElementById('ksdlg'),box=root.querySelector('.ks-box'),tt=root.querySelector('#ksdlg-t'),
      tx=root.querySelector('.ks-text'),dl=root.querySelector('dl'),wr=root.querySelector('.ks-warns'),er=root.querySelector('.ks-err'),
      ok=root.querySelector('.ks-ok'),cn=root.querySelector('.ks-cancel'),cur=null,busy=false,back=null;
  function txt(s){return s===null||s===undefined?'':String(s)}
  function close(){
    if(!cur)return;
    root.classList.remove('ks-open');document.documentElement.classList.remove('ks-dlg-lock');
    var c=cur;cur=null;busy=false;
    if(back&&back.focus&&document.contains(back)){try{back.focus()}catch(e){}}
    back=null;
    return c;
  }
  function cancel(){if(busy)return;var c=close();if(c&&c.onCancel)c.onCancel()}
  function setBusy(on){
    busy=on;ok.disabled=on;cn.disabled=on;
    ok.textContent=on?'Сохраняю…':cur.ok;
    ok.classList.toggle('ks-loading',on);
  }
  /* Диалог подтверждения.
     o.title — заголовок; o.text — пояснение; o.rows — [[подпись, значение], …] (пустые значения пропускаются);
     o.warn — предупреждение (строка, {title,text} или массив); строка сводки [подпись, значение, 'total'] — итог крупнее; o.ok — текст основной кнопки; o.danger — красная кнопка;
     o.run(done, fail) — вызывается после «Подтвердить»: done() закрывает диалог, fail(текст) показывает ошибку в диалоге.
     o.onCancel — при отмене. Возвращает false, если уже открыт другой диалог. */
  window.ksConfirm=function(o){
    if(cur)return false;
    cur={ok:o.ok||'Подтвердить',run:o.run,onCancel:o.onCancel};
    back=document.activeElement;
    tt.textContent=txt(o.title);
    tx.hidden=!o.text;tx.textContent=txt(o.text);
    dl.innerHTML='';
    (o.rows||[]).forEach(function(r){
      if(!r||r[1]===null||r[1]===undefined||r[1]==='')return;
      var a=document.createElement('dt'),b=document.createElement('dd');a.textContent=txt(r[0]);b.textContent=txt(r[1]);
      if(r[2]==='total')b.className='ks-total';
      dl.appendChild(a);dl.appendChild(b);
    });
    dl.hidden=!dl.children.length;
    // o.warn — строка, {title, text} или массив из них: каждое предупреждение отдельной плашкой
    wr.innerHTML='';
    [].concat(o.warn||[]).forEach(function(w){
      if(!w)return;
      var d=document.createElement('div');d.className='ks-warn';
      if(typeof w=='object'){var b=document.createElement('b');b.textContent=txt(w.title);d.appendChild(b);var sp=document.createElement('span');sp.textContent=txt(w.text);d.appendChild(sp)}
      else d.textContent=txt(w);
      wr.appendChild(d);
    });
    er.hidden=true;er.textContent='';
    ok.classList.toggle('ks-danger',!!o.danger);
    setBusy(false);
    root.classList.add('ks-open');document.documentElement.classList.add('ks-dlg-lock');
    // Фокус на «Отмена» без прокрутки к кнопке; новый диалог всегда с начала: заголовок и сумма видны сразу
    try{cn.focus({preventScroll:true})}catch(e){cn.focus()}
    box.scrollTop=0;
    return true;
  };
  ok.onclick=function(){
    if(!cur||busy)return;
    var c=cur;setBusy(true);er.hidden=true;
    var fin=false;
    function done(){if(fin||cur!==c)return;fin=true;close()}
    function fail(m){
      if(fin||cur!==c)return;fin=true;setBusy(false);
      // Неверный код: диалог закрывается, страница показывает экран входа (одинаково на всех страницах)
      if(/Неверный код/.test(txt(m))){close();ksAuthFail(m);return}
      er.textContent=typeof friendly_=='function'?friendly_(m):txt(m);er.hidden=false;
    }
    try{c.run(done,fail)}catch(e){fail(e&&e.message?e.message:String(e))}
  };
  cn.onclick=cancel;
  root.addEventListener('mousedown',function(e){if(e.target===root)cancel()});
  document.addEventListener('keydown',function(e){
    if(!cur)return;
    if(e.key==='Escape'){e.preventDefault();cancel();return}
    if(e.key==='Tab'){
      var f=[].filter.call(box.querySelectorAll('button'),function(b){return !b.disabled});
      if(!f.length){e.preventDefault();return}
      var i=f.indexOf(document.activeElement);
      if(e.shiftKey&&(i<=0)){e.preventDefault();f[f.length-1].focus()}
      else if(!e.shiftKey&&(i<0||i===f.length-1)){e.preventDefault();f[0].focus()}
    }
  },true);
  window.ksDialogOpen=function(){return !!cur};
  /* Ошибка кода доступа во время действия: экран входа страницы, а если его нет — перезагрузка */
  function ksAuthFail(m){
    var t=/администратора/.test(txt(m))?'Неверный код администратора':'Неверный код доступа';
    if(typeof window.showLogin=='function'){try{window.showLogin(t);return}catch(e){}}
    try{location.reload()}catch(e){}
  }
  window.ksAuthFail=ksAuthFail;
  /* Блокировка кнопки на время запроса: ksBusy(кнопка, true[, текст]) / ksBusy(кнопка, false) */
  window.ksBusy=function(b,on,label){
    if(!b)return;
    if(on){if(b.dataset.ksText===undefined)b.dataset.ksText=b.textContent;b.disabled=true;b.classList.add('ks-loading');b.setAttribute('aria-busy','true');if(label)b.textContent=label}
    else{b.disabled=false;b.classList.remove('ks-loading');b.removeAttribute('aria-busy');if(b.dataset.ksText!==undefined){b.textContent=b.dataset.ksText;delete b.dataset.ksText}}
  };
  /* Формат суммы для сводок: 165 → «165 ₾», 82.5 → «82,5 ₾» */
  window.ksMoney=function(n){return String(Math.round((Number(n)||0)*100)/100).replace('.',',')+' ₾'};
  /* Тариф группы за месяц из карточки игрока (appPlayerSubs): цена того месяца, иначе текущая */
  window.ksTariff=function(sub,month,group){var b=sub&&sub.tariffsBy&&sub.tariffsBy[month];return b&&b[group]!==undefined?b[group]:(sub&&sub.tariffs?sub.tariffs[group]:undefined)};
  /* Дата yyyy-mm-dd → дд.мм.гггг; пусто, если дата сегодняшняя */
  window.ksDateIfNotToday=function(s){
    var m=/^(\d{4})-(\d\d)-(\d\d)$/.exec(String(s||''));if(!m)return '';
    var d=new Date(),z=function(n){return(n<10?'0':'')+n},t=d.getFullYear()+'-'+z(d.getMonth()+1)+'-'+z(d.getDate());
    return s===t?'':m[3]+'.'+m[2]+'.'+m[1];
  };
  /* UI-010: пустое состояние. ksEmpty({icon:'users'|'box'|'search', title, text, btn:'Текст', id:'idКнопки', tag:'li'}) → HTML */
  var EICON={users:'<path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/>',
    box:'<path d="M21 8l-9-5-9 5v8l9 5 9-5z"/><path d="M3 8l9 5 9-5M12 13v8"/>',search:'<circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/>',alert:'<path d="M10.3 3.9L1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/><path d="M12 9v4M12 17h.01"/>'};
  window.ksEmpty=function(o){
    var tag=o.tag||'div',txt=function(v){return String(v==null?'':v).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})};
    return'<'+tag+' class="ks-empty" role="status"><svg viewBox="0 0 24 24" width="36" height="36" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'+(EICON[o.icon]||EICON.search)+'</svg>'
      +'<b>'+txt(o.title)+'</b>'+(o.text?'<p>'+txt(o.text)+'</p>':'')+(o.btn?'<button type="button" id="'+o.id+'">'+txt(o.btn)+'</button>':'')+'</'+tag+'>';
  };
  /* Предупреждение о переплате: сумма больше остатка */
  window.ksOverpay=function(amount,left){
    amount=Number(amount)||0;left=Number(left)||0;
    return amount>left+0.001?Math.round((amount-left)*100)/100:0;
  };
})();
</script>
<script>
/* DS-012: ручная тема. Ключ kstheme: нет / '' — как на устройстве, 'light', 'dark'. ksTheme() → '' | 'light' | 'dark'. «Выйти» его не очищает.
   Тёмные стили во всех файлах написаны через @media(prefers-color-scheme:dark): при ручном выборе такие правила
   включаются или выключаются заменой условия, при «Как на устройстве» возвращается исходное условие. */
(function(){
  var DARK=/\(\s*prefers-color-scheme\s*:\s*dark\s*\)/gi;
  function get(){var v='';try{v=localStorage.getItem('kstheme')||''}catch(e){}return v=='light'||v=='dark'?v:''}
  function walk(rules,t){
    for(var i=0;i<rules.length;i++){
      var r=rules[i];
      if(r.media&&r.cssRules){
        if(r.__ksMedia===undefined){if(!DARK.test(r.media.mediaText)){DARK.lastIndex=0;r.__ksMedia=null}else{DARK.lastIndex=0;r.__ksMedia=r.media.mediaText}}
        if(r.__ksMedia!==null){
          var m=!t?r.__ksMedia:r.__ksMedia.replace(DARK,t=='dark'?'(min-width:0px)':'(prefers-color-scheme:ks-none)');
          if(t=='light'&&/^\s*\(prefers-color-scheme:ks-none\)\s*$/.test(m))m='not all';
          if(r.media.mediaText!==m)r.media.mediaText=m;
        }
        walk(r.cssRules,t);
      }else if(r.cssRules)walk(r.cssRules,t);
    }
  }
  function apply(){
    var t=get(),ss=document.styleSheets,de=document.documentElement;
    for(var i=0;i<ss.length;i++){var rs=null;try{rs=ss[i].cssRules}catch(e){}if(rs)walk(rs,t)}
    if(!t){de.removeAttribute('data-theme');de.style.colorScheme='light dark'}
    else{de.setAttribute('data-theme',t);de.style.colorScheme=t}
  }
  window.ksTheme=get;
  window.ksSetTheme=function(t){try{if(t=='light'||t=='dark')localStorage.setItem('kstheme',t);else localStorage.removeItem('kstheme')}catch(e){}apply();try{document.dispatchEvent(new Event('kstheme'))}catch(e){}};
  apply();
  document.addEventListener('DOMContentLoaded',apply);
  window.addEventListener('load',apply);
  /* стили, которые страница добавляет позже (например, StatsMatches) */
  try{new MutationObserver(function(ms){for(var i=0;i<ms.length;i++)for(var j=0;j<ms[i].addedNodes.length;j++){var n=ms[i].addedNodes[j];if(n.nodeName=='STYLE'||n.nodeName=='LINK'){apply();return}}}).observe(document.head,{childList:true})}catch(e){}
  /* другая вкладка сменила тему */
  window.addEventListener('storage',function(e){if(e.key=='kstheme'){apply();try{document.dispatchEvent(new Event('kstheme'))}catch(x){}}});
})();
</script>
<script>
/* UI-011. Клавиатура и подписи — только разметка доступности, логика страниц не меняется:
   • <label> без for, за которым сразу идёт поле, связывается с ним (for/id); поле без подписи получает
     aria-label из placeholder;
   • строки списков, открываемые нажатием (li.p, li[data-i]), — фокусируемые кнопки: Tab, Enter, пробел;
   • переключатели разделов на странице ([data-t], .seg2) — вкладки: role=tab, aria-selected по классу .on,
     стрелки влево/вправо;
   • вход: Enter в поле кода нажимает «Войти». */
(function(){
  var n=0,CTRL=/^(INPUT|SELECT|TEXTAREA)$/;
  function uid(e){if(!e.id)e.id='ks-f'+(++n);return e.id}
  function labels(root){
    [].forEach.call(root.querySelectorAll('label:not([for])'),function(l){
      if(l.querySelector('input,select,textarea'))return;
      var c=l.nextElementSibling;
      if(c&&CTRL.test(c.tagName)&&c.type!='hidden'&&!(c.labels&&c.labels.length))l.htmlFor=uid(c);
    });

<script>
/* Процесс vs ошибка: строки .msg получают класс ks-progress, пока в них текст о ходе действия */
(function(){
  var RX=/^\s*(Сохраняю|Загрузка|Загружаю|Проверяю|Удаляю|Отменяю|Записываю|Отправляю|Создаю|Обновляю)/;
  function mark(el){if(el&&el.classList&&el.classList.contains('msg'))el.classList.toggle('ks-progress',RX.test(el.textContent||''))}
  function scan(root){if(!root||!root.querySelectorAll)return;if(root.classList&&root.classList.contains('msg'))mark(root);[].forEach.call(root.querySelectorAll('.msg'),mark)}
  function start(){
    scan(document.body);
    new MutationObserver(function(ms){ms.forEach(function(m){
      var t=m.target.nodeType===3?m.target.parentNode:m.target;
      var el=t&&t.closest?t.closest('.msg'):null;if(el)mark(el);
      [].forEach.call(m.addedNodes||[],function(n){if(n.nodeType===1)scan(n)});
    })}).observe(document.body,{subtree:true,childList:true,characterData:true});
  }
  if(document.body)start();else document.addEventListener('DOMContentLoaded',start);
})();

<script>

  window.ksCacheClear=function(){try{Object.keys(sessionStorage).forEach(function(k){if(k.indexOf('kscache:')===0)sessionStorage.removeItem(k)})}catch(e){}};
