<script>
(function(){
  var D=null;
  var st=document.createElement('style');
  st.textContent='[hidden]{display:none!important}.seg2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:0 0 10px}.seg2 button{min-height:44px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--mute);font-weight:700}.seg2 button.on{background:var(--g);border-color:var(--g);color:var(--gi)}.mfl{display:grid;grid-template-columns:1fr 1fr;gap:8px}.r3{display:inline-flex;align-items:center;justify-content:center;gap:2px;min-width:30px;height:22px;vertical-align:middle;border-radius:999px;padding:0 7px 0 5px;font-weight:800;font-size:12px;line-height:1;color:var(--color-on-status,#fff)}.r3 svg{flex:none}#mapp li>b{white-space:nowrap;flex:none}#mapp .r3,#mapp .tile .r3{color:var(--color-on-status,#fff);font-size:12px;display:inline-flex}.r3.w{background:var(--color-success,#1E7A4C)}.r3.d{background:var(--color-neutral-strong,#5A6584)}.r3.l{background:var(--color-danger,#C0392B)}.rec{display:inline-flex;align-items:center;gap:4px;white-space:nowrap;font-weight:700}.rec .n{margin-right:6px}.mt3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:-4px 0 8px}.mt3 .tile{display:flex;flex-direction:column;gap:4px}.mt3 .tile .r3{align-self:flex-start}.leg{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;margin:0 0 12px;color:var(--mute);font-size:13px}.leg span{display:inline-flex;align-items:center;gap:6px}.lm li{align-items:center}.lm li>span{min-width:0}.lm .sc{display:inline-flex;align-items:center;gap:8px;white-space:nowrap;font-weight:700}.mh{font-size:15px;margin:14px 0 4px}';
  document.head.appendChild(st);
  var app=$('app'),h1=app.querySelector('h1');
  var seg=document.createElement('div');seg.className='seg2';
  seg.innerHTML='<button class="on" data-t="att">Посещаемость</button><button data-t="mat">Матчи</button>';
  h1.insertAdjacentElement('afterend',seg);
  var mp=document.createElement('div');mp.id='mapp';mp.hidden=true;
  mp.innerHTML='<div class="mfl"><select id="mtm" aria-label="Команда"></select><select id="mkd" aria-label="Тип игр"><option value="">Все игры</option><option>Чемпионат</option><option>Товарищеские</option><option>Турниры и кубки</option></select></div>'
    +'<div class="msg" id="mmsg" role="status"></div><div class="tiles" id="msum"></div><div class="mt3" id="mres"></div><div id="mleg"></div><div id="mteams"></div><div id="mtop"></div>';
  app.appendChild(mp);
  var att=[$('per'),$('cust'),$('msg'),$('sum'),$('groups')].filter(Boolean); // #per — выбор периода (раньше #mon)
  function tab(t){
    [].forEach.call(seg.children,function(b){b.className=b.dataset.t==t?'on':''});
    att.forEach(function(e){e.hidden=(t=='mat')});
    if(t!='mat'&&$('cust'))$('cust').hidden=$('per').value!=='custom'; // «Свой период» — только если выбран
    h1.textContent=t=='mat'?'Статистика матчей':'Статистика посещаемости';
    mp.hidden=(t!='mat');
    if(t=='mat')loadM();
  }
  seg.onclick=function(e){var b=e.target.closest('button');if(b)tab(b.dataset.t)};
  function mmsg(t,bad){$('mmsg').textContent=t||'';$('mmsg').className='msg'+(bad?' err':'')}
  function loadM(){
    mmsg('Считаю…');
    run('appMatchStats',[pin],function(d){D=d;mmsg('');fillTeams();draw()},function(m){mmsg(m,true)});
  }
  function fillTeams(){
    var v=$('mtm').value,t=[];
    D.games.forEach(function(g){if(t.indexOf(g.team)<0)t.push(g.team)});
    t.sort();
    $('mtm').innerHTML='<option value="">Все команды</option>'+t.map(function(x){return'<option>'+esc(x)+'</option>'}).join('');
    $('mtm').value=v;
  }
  function dm(d){return d?d.slice(8)+'.'+d.slice(5,7):'—'}
  // UI-002: результат — буква, значок и подпись (не только цвет). В — победа, Н — ничья, П — поражение.
  var RI={w:'<path d="M5 12.5l4.5 4.5L19 7.5"/>',d:'<path d="M6 12h12"/>',l:'<path d="M7 7l10 10M17 7L7 17"/>'},RT={w:['В','Победа'],d:['Н','Ничья'],l:['П','Поражение']};
  function badge(k){return'<span class="r3 '+k+'" role="img" aria-label="'+RT[k][1]+'" title="'+RT[k][1]+'"><svg viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'+RI[k]+'</svg>'+RT[k][0]+'</span>'}
  function kindOf(g){return g.gf>g.ga?'w':(g.gf<g.ga?'l':'d')}
  function res(g){return badge(kindOf(g))}
  function recHtml(r){return'<span class="rec">'+badge('w')+'<span class="n">'+r.w+'</span>'+badge('d')+'<span class="n">'+r.d+'</span>'+badge('l')+'<span class="n">'+r.l+'</span></span>'}
  function plural(n,a,b,c){var m=n%10,h=n%100;return n+' '+(m==1&&h!=11?a:m>=2&&m<=4&&(h<12||h>14)?b:c)}
  var LEGEND='<div class="leg" aria-label="Обозначения"><span>'+badge('w')+' победа</span><span>'+badge('d')+' ничья</span><span>'+badge('l')+' поражение</span></div>';
  function agg(parts){
    var m={};
    parts.forEach(function(p){
      var x=m[p.id]||(m[p.id]={name:p.name,games:0,goals:0});
      if(p.played)x.games++;x.goals+=p.goals;
    });
    return Object.keys(m).map(function(k){return m[k]}).sort(function(a,b){return b.goals-a.goals||b.games-a.games||a.name.localeCompare(b.name)});
  }
  function rec(G){
    var r={n:0,w:0,d:0,l:0,gf:0,ga:0};
    G.forEach(function(g){
      r.n++;r.gf+=g.gf;r.ga+=g.ga;
      if(g.gf>g.ga)r.w++;else if(g.gf<g.ga)r.l++;else r.d++;
    });
    return r;
  }
  function tile(t,v){return'<div class="tile"><b>'+v+'</b><span>'+t+'</span></div>'}
  function draw(){
    if(!D)return;
    var tm=$('mtm').value,kd=$('mkd').value;
    var pr=currentRange(); // тот же период, что и на вкладке посещаемости
    var G=D.games.filter(function(g){return g.date&&g.date>=pr[0]&&g.date<=pr[1]&&(!tm||g.team==tm)&&(!kd||g.kind==kd)});
    var ids={};G.forEach(function(g){ids[g.id]=g});
    var P=D.parts.filter(function(p){return ids[p.g]});
    var R=rec(G);
    function rt(k,n,word){return'<div class="tile"><b>'+n+'</b><span>'+word+'</span>'+badge(k)+'</div>'}
    $('msum').innerHTML=tile('игр',R.n)+tile('голы (забито:пропущено)',R.gf+':'+R.ga)+tile('разница голов',(R.gf-R.ga>0?'+':'')+(R.gf-R.ga));
    $('mres').innerHTML=rt('w',R.w,'побед')+rt('d',R.d,'ничьих')+rt('l',R.l,'поражений');
    $('mleg').innerHTML=G.length?LEGEND:'';
    if(!G.length){$('mteams').innerHTML='<p class="sub">Игр со счётом пока нет.</p>';$('mtop').innerHTML='';return}
    // Последние матчи — 5 самых свежих по выбранным фильтрам
    var last=G.slice().sort(function(a,b){return(b.date||'').localeCompare(a.date||'')}).slice(0,5);
    var lastHtml='<details open class="lm"><summary><div class="top"><span>Последние матчи</span></div></summary><ul>'+last.map(function(g){
      return'<li><span>'+dm(g.date)+' · '+esc(g.team)+' — '+esc(g.opp||g.title)+'</span><span class="sc">'+g.gf+':'+g.ga+' '+res(g)+'</span></li>'}).join('')+'</ul></details>';
    var teams=[];G.forEach(function(g){if(teams.indexOf(g.team)<0)teams.push(g.team)});
    teams.sort();
    $('mteams').innerHTML=lastHtml+'<div class="mh"><b>Результаты команд</b></div>'+teams.map(function(t){
      var gs=G.filter(function(g){return g.team==t}).sort(function(a,b){return(b.date||'').localeCompare(a.date||'')});
      var r=rec(gs);
      var pl=agg(P.filter(function(p){return ids[p.g]&&ids[p.g].team==t}));
      var gl=gs.map(function(g){
        return'<li><span>'+dm(g.date)+' · '+esc(g.title)+(g.opp?' — '+esc(g.opp):'')+'</span><b>'+g.gf+':'+g.ga+' '+res(g)+'</b></li>';
      }).join('');
      var pls=pl.map(function(x){return'<li><span>'+esc(x.name)+'</span><b>игр '+x.games+(x.goals?', голов '+x.goals:'')+'</b></li>'}).join('');
      return'<details><summary><div class="top"><span>'+esc(t)+'</span><span class="sub" style="margin:0;font-weight:400">'+plural(r.n,'игра','игры','игр')+'</span></div>'
        +'<div class="sub" style="margin-top:6px">'+recHtml(r)+' · голы '+r.gf+':'+r.ga+' · разница '+(r.gf-r.ga>0?'+':'')+(r.gf-r.ga)+'</div></summary>'
        +'<div class="mh"><b>Игры</b></div><ul>'+gl+'</ul><div class="mh"><b>Игроки</b></div><ul>'+(pls||'<li><span class="sub">нет данных</span></li>')+'</ul></details>';
    }).join('');
    var top=agg(P).filter(function(x){return x.goals>0}).slice(0,10);
    $('mtop').innerHTML=top.length?'<details open><summary><div class="top"><span>Бомбардиры</span></div></summary><ul>'+top.map(function(x,i){return'<li><span>'+(i+1)+'. '+esc(x.name)+'</span><b>'+x.goals+' (игр '+x.games+')</b></li>'}).join('')+'</ul></details>':'';
  }
  $('mtm').onchange=draw;$('mkd').onchange=draw;
  ['per','from','to'].forEach(function(id){$(id).addEventListener('change',draw)});
})();
</script>
